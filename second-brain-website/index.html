<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Second Brain" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Second Brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root{
        --c-bg:#F8FAFC;--c-surface:#FFFFFF;--c-surface-alt:#F1F5F9;--c-border:#E2E8F0;--c-border-strong:#CBD5E1;
        --c-text:#1E293B;--c-text-secondary:#475569;--c-text-muted:#94A3B8;
        --c-focus:#0F172A;--c-focus-dim:#F1F5F9;--c-onfocus:#FFFFFF;
        --c-warn:#F59E0B;--c-warn-dim:#FEF3C7;
        --c-good:#10B981;--c-good-dim:#D1FAE5;--c-danger:#F43F5E;--c-danger-dim:#FFE4E6;
        --c-info:#0EA5E9;--c-info-dim:#E0F2FE;--c-oninvert:#0F172A;
        --radius-lg:16px;--radius-md:12px;--radius-sm:8px;
        --shadow-1:0 1px 2px rgba(15,23,42,.05);--shadow-2:0 6px 20px rgba(15,23,42,.10);
        color-scheme:light;
      }
      [data-theme="dark"]{
        --c-bg:#0F172A;--c-surface:#1E293B;--c-surface-alt:#334155;--c-border:#334155;--c-border-strong:#475569;
        --c-text:#F1F5F9;--c-text-secondary:#CBD5E1;--c-text-muted:#94A3B8;
        --c-focus:#F1F5F9;--c-focus-dim:#334155;--c-onfocus:#0F172A;
        --c-warn:#F59E0B;--c-warn-dim:#3A2E1A;
        --c-good:#10B981;--c-good-dim:#113328;--c-danger:#F43F5E;--c-danger-dim:#3A1622;
        --c-info:#0EA5E9;--c-info-dim:#0C2C3D;--c-oninvert:#F1F5F9;
        --shadow-1:0 1px 2px rgba(0,0,0,.25);--shadow-2:0 10px 30px rgba(0,0,0,.35);
        color-scheme:dark;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;background:var(--c-bg);color:var(--c-text);
        font-family:Inter,ui-sans-serif,system-ui,sans-serif;
        -webkit-font-smoothing:antialiased;line-height:1.45;
      }
      .font-display{font-family:'Space Grotesk',Inter,sans-serif}
      .font-mono{font-family:'JetBrains Mono',monospace}
      button{font:inherit;cursor:pointer}
      input,textarea,select{font:inherit;color:inherit}
      a{color:inherit}
      ::selection{background:var(--c-info-dim)}

      /* ---------- shell ---------- */
      #app{display:flex;min-height:100vh}
      .sidebar{
        width:230px;flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);
        display:flex;flex-direction:column;padding:18px 14px;gap:4px;transition:width .18s ease,padding .18s ease;
        position:sticky;top:0;height:100vh;overflow-y:auto;
      }
      .sidebar.collapsed{width:72px;padding:18px 10px}
      .sb-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 16px;gap:8px}
      .sb-brand{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden}
      .sb-brand .dot{width:11px;height:11px;border-radius:4px;background:var(--c-focus);flex-shrink:0}
      .sidebar.collapsed .sb-brand span{display:none}
      .sb-toggle{width:28px;height:28px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
      .sb-toggle:hover{background:var(--c-surface-alt)}
      .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--c-text-secondary);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden}
      .nav-item .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
      .nav-item:hover{background:var(--c-surface-alt);color:var(--c-text)}
      .nav-item.active{background:var(--c-focus);color:var(--c-onfocus);font-weight:600}
      .sidebar.collapsed .nav-item span.label{display:none}
      .sidebar.collapsed .nav-item{justify-content:center}
      .nav-badge{margin-left:auto;background:var(--c-focus);color:var(--c-onfocus);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;min-width:18px;text-align:center}
      .sidebar.collapsed .nav-badge{display:none}
      .nav-divider{height:1px;background:var(--c-border);margin:10px 6px}
      .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-muted);padding:8px 10px 4px}
      .sidebar.collapsed .nav-group-label{display:none}
      .sb-foot{margin-top:auto;padding-top:10px}

      .main{flex:1;min-width:0;display:flex;flex-direction:column}
      .topbar{
        position:sticky;top:0;z-index:20;background:var(--c-bg);
        display:flex;align-items:center;gap:18px;padding:16px 28px;border-bottom:1px solid var(--c-border);
        flex-wrap:wrap;
      }
      .xp-block{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
      .xp-level{
        width:38px;height:38px;border-radius:11px;background:var(--c-focus);
        color:var(--c-onfocus);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
        box-shadow:var(--shadow-1);
      }
      .xp-mid{flex:1;min-width:120px}
      .xp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--c-text-muted);margin-bottom:4px;font-weight:600}
      .xp-bar{height:7px;border-radius:99px;background:var(--c-surface-alt);overflow:hidden}
      .xp-bar-fill{height:100%;background:var(--c-good);border-radius:99px;transition:width .4s ease}
      .streak-chip{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--c-surface);border:1px solid var(--c-border);padding:6px 12px;border-radius:99px;white-space:nowrap}
      .topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
      .icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-secondary);display:flex;align-items:center;justify-content:center}
      .icon-btn:hover{background:var(--c-surface-alt)}

      .view{padding:24px 28px 80px;max-width:980px;width:100%;margin:0 auto}
      .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
      .view-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}
      .today-stamp{text-align:right;line-height:1.35;flex-shrink:0}
      .today-day{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--c-text)}
      .today-date{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--c-text-muted)}
      .view-sub{color:var(--c-text-muted);font-size:13.5px;margin-top:3px}

      /* ---------- buttons ---------- */
      .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text);font-size:13.5px;font-weight:600;white-space:nowrap}
      .btn:hover{border-color:var(--c-border-strong)}
      .btn-primary{background:var(--c-focus);border-color:var(--c-focus);color:var(--c-onfocus)}
      .btn-primary:hover{filter:brightness(1.06)}
      .btn-ghost{background:transparent;border-color:transparent;color:var(--c-text-secondary)}
      .btn-ghost:hover{background:var(--c-surface-alt)}
      .btn-danger{color:var(--c-danger)}
      .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
      .btn:disabled{opacity:.45;cursor:not-allowed}

      /* ---------- cards / misc ---------- */
      .card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-1)}
      .empty{color:var(--c-text-muted);font-size:14px;text-align:center;padding:50px 20px;border:1.5px dashed var(--c-border);border-radius:var(--radius-lg)}
      .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--c-border);background:var(--c-surface-alt);color:var(--c-text-secondary);white-space:nowrap}
      .chip.on{background:var(--c-focus);border-color:var(--c-focus);color:var(--c-onfocus)}
      .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
      .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
      .pri-high{color:var(--c-danger)}.pri-medium{color:var(--c-warn)}.pri-low{color:var(--c-text-muted)}
      .pri-dot.pri-high{background:var(--c-danger)}.pri-dot.pri-medium{background:var(--c-warn)}.pri-dot.pri-low{background:var(--c-text-muted)}

      /* quick capture */
      .capture{display:flex;gap:8px;margin-bottom:18px}
      .capture input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-surface);font-size:14px}
      .capture input:focus{outline:2px solid var(--c-info-dim);border-color:var(--c-info)}

      /* inbox item */
      .item-row{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--radius-md);border:1px solid var(--c-border);background:var(--c-surface);margin-bottom:9px}
      .item-row:hover{border-color:var(--c-border-strong)}
      .check{width:20px;height:20px;border-radius:7px;border:2px solid var(--c-border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--c-surface)}
      .check.done{background:var(--c-good);border-color:var(--c-good)}
      .check.done svg{stroke:#fff}
      .item-main{flex:1;min-width:0}
      .item-title{font-size:14.5px;font-weight:500;word-break:break-word}
      .item-title.done{text-decoration:line-through;color:var(--c-text-muted)}
      .item-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--c-text-muted)}
      .item-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}

      /* now / focus */
      .focus-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
      .focus-card{display:flex;align-items:flex-start;gap:14px;padding:18px;border-radius:var(--radius-lg);border:1px solid var(--c-border);border-left:3px solid var(--c-info);background:var(--c-surface);box-shadow:var(--shadow-1)}
      .focus-num{width:26px;height:26px;border-radius:8px;background:var(--c-info-dim);color:var(--c-info);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
      .focus-title{font-size:16px;font-weight:600}
      .focus-empty-slot{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;border-radius:var(--radius-lg);border:1.5px dashed var(--c-border-strong);color:var(--c-text-muted);font-size:13.5px}
      .pipeline{border-radius:var(--radius-lg);border:1px solid var(--c-border);background:var(--c-surface-alt);padding:14px 16px}
      .pipeline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
      .pipeline-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted)}
      .pipeline-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);background:var(--c-surface)}
      .pipeline-row+.pipeline-row{margin-top:6px}

      /* habits */
      .habit-strip{border-radius:var(--radius-lg);border:1px solid var(--c-border);background:var(--c-surface);padding:16px 18px;margin-bottom:26px}
      .habit-strip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
      .habit-row{display:flex;align-items:center;gap:12px;padding:8px 0}
      .habit-row+.habit-row{border-top:1px solid var(--c-border)}
      .habit-name{width:130px;flex-shrink:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
      .habit-days{display:flex;gap:6px;flex:1}
      .day-cell{flex:1;text-align:center}
      .day-lbl{font-size:10px;color:var(--c-text-muted);font-weight:700;margin-bottom:4px}
      .day-dot{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--c-border-strong);margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--c-surface)}
      .day-dot.done{background:var(--c-good);border-color:var(--c-good);color:#fff}
      .day-dot.today{box-shadow:0 0 0 2px var(--c-info-dim);border-color:var(--c-info)}
      .day-dot.future{opacity:.35;cursor:not-allowed}
      .day-dot.offsched{opacity:.3}
      .day-dot.offsched.done{opacity:1}
      .habit-streak{width:76px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:700;color:var(--c-warn)}

      /* project cards */
      .project-card{border-radius:var(--radius-lg);border:1px solid var(--c-border);background:var(--c-surface);margin-bottom:14px;overflow:hidden}
      .project-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}
      .project-title{font-size:15.5px;font-weight:600}
      .project-progress-track{height:6px;border-radius:99px;background:var(--c-surface-alt);margin-top:8px;position:relative;overflow:visible}
      .project-progress-fill{height:100%;background:var(--c-good);border-radius:99px}
      .project-progress-track.risk .project-progress-fill{background:var(--c-warn)}
      .project-progress-track.behind .project-progress-fill{background:var(--c-danger)}
      .sched-marker{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--c-text-secondary);opacity:.8}
      .health-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
      .health-ahead{color:var(--c-good);border-color:var(--c-good);background:var(--c-good-dim)}
      .health-ontrack{color:var(--c-info);border-color:var(--c-info);background:var(--c-info-dim)}
      .health-risk{color:var(--c-warn);border-color:var(--c-warn);background:var(--c-warn-dim)}
      .health-behind{color:var(--c-danger);border-color:var(--c-danger);background:var(--c-danger-dim)}
      .health-overdue{color:var(--c-danger);border-color:var(--c-danger);background:var(--c-danger-dim)}
      .health-noplan{color:var(--c-text-muted);border-color:var(--c-border-strong);background:var(--c-surface-alt)}
      .health-nodate{color:var(--c-text-muted);border-color:var(--c-border-strong);background:var(--c-surface-alt)}
      .health-done{color:var(--c-good);border-color:var(--c-good);background:var(--c-good-dim)}
      .health-stalled{color:var(--c-warn);border-color:var(--c-warn);background:var(--c-warn-dim)}
      .effort-chip{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;line-height:16px;min-width:22px;text-align:center;padding:0 5px;border-radius:5px;border:1px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-text-muted);cursor:pointer;flex-shrink:0}
      .effort-chip:hover{border-color:var(--c-focus);color:var(--c-focus)}
      .rollup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:14px}
      .rollup-tile{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:12px 14px}
      button.rollup-tile{width:100%;text-align:left;font:inherit;cursor:pointer;display:block;transition:border-color .12s,background .12s}
      button.rollup-tile:hover{border-color:var(--c-border-strong);background:var(--c-surface-alt)}
      button.rollup-tile:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
      .rollup-tile .drill{font-size:10px;font-weight:700;color:var(--c-text-muted);margin-top:6px;opacity:.75}
      .rollup-tile .v{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;color:var(--c-text);line-height:1.1}
      .rollup-tile .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);margin-top:5px}
      .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:4px}
      .mini-table th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);padding:0 10px 7px 0;font-weight:700}
      .mini-table td{padding:7px 10px 7px 0;border-top:1px solid var(--c-border);vertical-align:middle}
      .mini-table td.num{font-family:'JetBrains Mono',monospace;text-align:right;padding-right:0;white-space:nowrap}
      /* A numeric header must sit directly over its numbers: same alignment AND
         same right edge, or the column reads as two columns that drifted apart. */
      .mini-table th.num{text-align:right;padding-right:0;white-space:nowrap}
      .mini-table th.num,.mini-table td.num{font-variant-numeric:tabular-nums}
      .mini-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
      .mini-table tr.row-link{cursor:pointer}
      .mini-table tr.row-link:hover td{background:var(--c-surface-alt)}
      .mini-table tr.row-link td:first-child{border-top-left-radius:8px;border-bottom-left-radius:8px}
      .project-body{border-top:1px solid var(--c-border);padding:16px 18px;background:var(--c-surface-alt)}
      .sub-list{margin-bottom:12px}
      .sub-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
      .sub-add{display:flex;gap:8px;margin-top:8px}
      .sub-add input{flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface);font-size:13px}
      .rv-step{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--c-border)}
      .rv-step:last-child{border-bottom:none}
      .rv-step .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--c-border-strong);background:var(--c-surface);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer}
      .rv-step .box.on{background:var(--c-good);border-color:var(--c-good)}
      .rv-step.done .rv-what{text-decoration:line-through;color:var(--c-text-muted)}
      .rv-body{flex:1;min-width:0;cursor:pointer}
      .rv-what{font-size:14px;font-weight:600}
      .rv-why{font-size:12.5px;color:var(--c-text-muted);margin-top:2px}
      .rv-where{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--c-text-secondary);background:var(--c-surface-alt);border:1px solid var(--c-border);border-radius:5px;padding:1px 6px;margin-top:5px}
      .rv-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 2px;padding-top:12px;border-top:1px solid var(--c-border-strong);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c-text-secondary)}
      .rv-sec:first-of-type{border-top:none;padding-top:6px;margin-top:8px}
      .rv-sec-count{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--c-text-muted);letter-spacing:0}
      .rv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
      .clickable-title{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
      .clickable-title:hover{text-decoration-color:var(--c-border-strong)}
      .parent-chip{font-size:11.5px;color:var(--c-text-muted)}
      .row-tools{display:inline-flex;gap:2px;flex-shrink:0}
      .row-tools .icon-btn{padding:2px 5px;font-size:12px;line-height:1.1}
      .icon-btn[disabled]{opacity:.25;cursor:not-allowed}
      .search-box{flex:1;min-width:180px;padding:8px 12px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);font-size:13.5px;color:var(--c-text)}
      .search-box:focus{outline:2px solid var(--c-info-dim);border-color:var(--c-info)}
      .filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
      .habit-row.inactive{opacity:.5}
      .week-pager{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--c-text-muted)}
      .dom-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--c-border);flex-wrap:wrap}
      .dom-row:last-child{border-bottom:none}

      @media (max-width:820px){

        .sidebar.collapsed{width:0;padding:0;overflow:hidden;border:none}
        .main{width:100%}

      }

    <script>
'use strict';

/* =========================================================
   Constants
   ========================================================= */
const STATE_KEY = "adhd-second-brain-v1";
const INACTIVE_KEY = "sb-project-inactive-v1";
const DAY_LABELS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const AREA_MIGRATION_MAP = {

const XP_TASK = 10, XP_MILESTONE = 25, XP_HABITS = 15;

/* Review checklists. Deliberately outside the XP system — ticking these awards

   Each list is split into sections so the Second Brain pass and the finance

const REVIEW_LISTS = {

      { name: 'Second Brain', steps: [
        ['Read the portfolio roll-up', 'Weighted completion, off track, stalled, not broken down. One number for the whole book of work.', 'Reports → Projects'],
        ['Work the off-track list', 'For each: genuinely behind, or does it just need a start date set to when work actually began?', 'Reports → Projects → Off track'],

      { name: 'Finance', steps: [
        ['Take a net worth snapshot', 'One number, same day each month. The trend matters more than the level.', 'Finance app'],
        ['Audit every subscription', 'Cancel what you did not use this month. They only ever accumulate.', 'Finance app'],
        ['Read the whole month against budget', 'The week view hides seasonality; the month does not.', 'Finance app'],
        ['Check the Nigist and Tamar records are current', 'Current and separate from personal is what makes the formalisation work possible later.', 'Finance app / business records'],

      ]},
      { name: 'Second Brain', steps: [

        ['Re-read each area’s purpose and guiding principle', 'The Binder is the layer that stops the task list becoming the whole point.', 'Life Binder'],

};
function reviewSteps(kind){
  const out = [];
  (REVIEW_LISTS[kind].sections||[]).forEach((sec,si)=>sec.steps.forEach((st,i)=>out.push({sec:sec.name, si, i, key:`s${si}i${i}`, st})));
  return out;
}

/* Effort weighting — a step's size, so a 3-week survey doesn't count the same as a phone call. */
const EFFORT_ORDER = ['S','M','L','XL'];
const EFFORT = {
  S:  { weight:1, label:'S',  title:'Small — hours' },
  M:  { weight:2, label:'M',  title:'Medium — a day or two' },
  L:  { weight:3, label:'L',  title:'Large — about a week' },
  XL: { weight:5, label:'XL', title:'Extra large — multiple weeks' }
};
const DEFAULT_EFFORT = 'S';

/* Schedule-health bands: weighted completion % minus % of the timeline already spent. */
const HEALTH_AHEAD_MIN = 10;    // >= +10pts  -> ahead
const HEALTH_TRACK_MIN = -10;   // >= -10pts  -> on track
const HEALTH_RISK_MIN  = -25;   // >= -25pts  -> at risk, below that -> behind
const STALL_DAYS = 14;          // no step closed in this many days -> stalled
const HEALTH_META = {
  done:    { cls:'health-done',    label:'Complete' },
  overdue: { cls:'health-overdue', label:'Overdue' },
  behind:  { cls:'health-behind',  label:'Behind' },
  risk:    { cls:'health-risk',    label:'At risk' },
  ontrack: { cls:'health-ontrack', label:'On track' },
  ahead:   { cls:'health-ahead',   label:'Ahead' },
  nodate:  { cls:'health-nodate',  label:'No due date' },
  notstarted: { cls:'health-nodate', label:'Not started' },
  noplan:  { cls:'health-noplan',  label:'No plan' }
};
const HEALTH_ORDER = ['overdue','behind','risk','ontrack','ahead','nodate','notstarted','noplan','done'];

/* =========================================================
   Small utilities
   ========================================================= */
function uid(){
  if(window.crypto && crypto.randomUUID){ try{ return crypto.randomUUID(); }catch(e){} }
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return n<10?'0'+n:''+n; }
function fmtISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return fmtISO(new Date()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; return addDays(x,-day); } // Monday start
function fmtDue(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return '';
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  if(diff<0) return Math.abs(diff)+'d overdue';
  if(diff<7) return 'in '+diff+'d';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function isOverdue(item){
  if(!item.dueDate || item.status==='done') return false;
  return item.dueDate < todayISO();
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
const CAT_PALETTE = ['#F59E0B','#6366F1','#06B6D4','#EC4899','#14B8A6','#8B5CF6','#F97316','#84CC16','#0EA5E9','#F43F5E','#22C55E','#64748B'];
function colorFor(str){
  let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0;
  return CAT_PALETTE[h%CAT_PALETTE.length];
}
function catStyle(cat){
  const hex = colorFor(cat||'General');
  return `background:${hex}22;color:${hex};border-color:${hex}55`;
}

/* =========================================================
   State: load / migrate / save / cloud sync
   ========================================================= */
let state = null;      // {version, state:{items, settings, lifeAreas, habits, gamification}}
let inactiveProjects = []; // array of project ids marked archived

function defaultRoot(){
  return {
    version: 1,
    state: {
      items: [],
      settings: { nowPins: [], themeMode: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light' },
      lifeAreas: [],
      habits: [],
      reviews: { daily:{}, weekly:{}, monthly:{} },
      gamification: { xp:0, habitBonusDates:[] }
    }
  };
}

function loadRoot(){
  let raw=null;
  try{ raw = JSON.parse(localStorage.getItem(STATE_KEY)); }catch(e){}
  if(!raw || typeof raw!=='object') raw = defaultRoot();
  if(!raw.state) raw.state = {};
  const st = raw.state;
  st.items = Array.isArray(st.items) ? st.items : [];
  st.items.forEach(it=>{
    if(!it.id) it.id = uid();
    if(!Array.isArray(it.subtasks)) it.subtasks = [];
    it.subtasks.forEach(s=>{
      if(!s.id) s.id=uid();
      if(s.xpAwarded==null) s.xpAwarded=!!s.done;
      if(!EFFORT[s.effort]) s.effort = DEFAULT_EFFORT;
      if(s.doneAt===undefined) s.doneAt = null;   // legacy done milestones have no date; treated as pre-history
      if(!s.done) s.doneAt = null;
    });
    if(it.isStarred==null) it.isStarred=false;
    if(it.xpAwarded==null) it.xpAwarded = (it.status==='done'); // don't retro-award xp for legacy completed items
    if(!it.priority) it.priority='medium';
    if(!it.category) it.category='Inbox';
    if(!it.type) it.type='task';
    if(!it.status) it.status='open';
    if(!EFFORT[it.effort]) it.effort = DEFAULT_EFFORT;
    if(it.startDate===undefined) it.startDate = null;   // schedule window start; falls back to createdAt
  });
  st.settings = st.settings || {};
  if(!Array.isArray(st.settings.nowPins)) st.settings.nowPins=[];
  st.settings.nowPins = st.settings.nowPins.slice(0,3);
  if(!st.settings.themeMode) st.settings.themeMode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  if(typeof st.settings.numberLists!=='boolean') st.settings.numberLists = false;
  if(!Array.isArray(st.lifeAreas)) st.lifeAreas = [];
  st.lifeAreas.forEach(a=>{
    if(!Array.isArray(a.framework)) a.framework=[];
    if(!Array.isArray(a.routines)) a.routines=[];
    if(!Array.isArray(a.open_items)) a.open_items=[];
    if(!a.purpose) a.purpose='';
    if(!a.guiding_principle) a.guiding_principle='';
  });
  st.habits = Array.isArray(st.habits) ? st.habits : [];
  st.habits.forEach(h=>{
    if(!h.id) h.id=uid(); if(!h.log) h.log={}; if(!h.emoji) h.emoji='✅'; if(h.category===undefined) h.category=null;
    if(typeof h.active!=='boolean') h.active = true;   // retired habits stay for their history
    if(!h.frequency || !h.frequency.type) h.frequency={type:'daily'};
    if(h.frequency.type==='days' && !Array.isArray(h.frequency.days)) h.frequency.days=[0,1,2,3,4,5,6];
    if(h.frequency.type==='weekly' && !h.frequency.target) h.frequency.target=3;
  });
  // Review ticks live outside gamification on purpose: they never award XP.
  st.reviews = st.reviews || {};
  ['daily','weekly','monthly'].forEach(k=>{ if(typeof st.reviews[k]!=='object' || !st.reviews[k]) st.reviews[k] = {}; });
  st.gamification = st.gamification || {};
  if(typeof st.gamification.xp!=='number') st.gamification.xp=0;
  if(!Array.isArray(st.gamification.habitBonusDates)) st.gamification.habitBonusDates=[];
  raw.state = st;
  if(!raw.version) raw.version=1;
  return raw;
}

function migrateAreasIfNeeded(){
  if(state.areasMigratedV2) return Promise.resolve();
  if(typeof window.SB_LB==='undefined') return Promise.resolve();
  return window.SB_LB.load().then(()=>{
    const binderAreas = window.SB_LB.areas();
    if(Array.isArray(binderAreas) && binderAreas.length){
      state.state.lifeAreas = JSON.parse(JSON.stringify(binderAreas));
    }
    items().forEach(it=>{
      if(it.category && it.category!=='Inbox'){
        it.category = AREA_MIGRATION_MAP[it.category] || 'Inbox';
      }
    });
    state.areasMigratedV2 = true;
    persist();
  }).catch(()=>{});
}

const persistLocal = ()=>{ try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){} };
const cloudPushDebounced = debounce(()=>{
  if(typeof db==='undefined'){ pushToast('⚠️ Could not reach cloud — using local data'); return; }
  try{
    db.collection('snapshots').doc('primary').set({
      data: state, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(()=>{ pushToast('⚠️ Sync failed — changes saved locally only'); });
  }catch(e){}
}, 1200);

function persist(){ persistLocal(); cloudPushDebounced(); render(); }

function loadInactive(){
  let ids; try{ ids=JSON.parse(localStorage.getItem(INACTIVE_KEY)||'[]'); }catch(e){ ids=[]; }
  return Array.isArray(ids)?ids:[];
}
function saveInactive(){
  try{ localStorage.setItem(INACTIVE_KEY, JSON.stringify(inactiveProjects)); }catch(e){}
  if(typeof db==='undefined'){ pushToast('⚠️ Could not reach cloud — using local data'); return; }
  try{
    db.collection('snapshots').doc('project-flags').set({
      data: {inactive:inactiveProjects}, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(()=>{ pushToast('⚠️ Sync failed — changes saved locally only'); });
  }catch(e){}
}
function toggleInactive(projectId){
  const i=inactiveProjects.indexOf(projectId);
  if(i>=0) inactiveProjects.splice(i,1); else inactiveProjects.push(projectId);
  saveInactive(); render();
}

function resetApp(){
  if(typeof db==='undefined'){ pushToast('⚠️ Could not reach cloud — using local data'); return; }
  Promise.all([
    db.collection('snapshots').doc('primary').delete(),
    db.collection('snapshots').doc('project-flags').delete(),
    window.SB_LB.clear()
  ]).catch(()=>{ pushToast('⚠️ Cloud wipe failed — old data may still exist in the cloud'); })
  .finally(()=>{
    try{ localStorage.removeItem(STATE_KEY); }catch(e){}
    try{ localStorage.removeItem(INACTIVE_KEY); }catch(e){}
    state = defaultRoot();
    inactiveProjects = [];
    ui.view = 'now'; ui.processInbox = false;
    closeModal();
    render();
    pushToast('App reset — all local data cleared');
  });
}

/* =========================================================
   Gamification: XP / Level / Streak
   ========================================================= */
function levelInfo(xp){
  let level=1, into=xp, need=100;
  while(into>=need){ into-=need; level++; need=100+(level-1)*40; }
  return {level, into, need};
}
function grantXP(amount, label){
  const g = state.state.gamification;
  const before = levelInfo(g.xp);
  g.xp += amount;
  const after = levelInfo(g.xp);
  pushToast(`+${amount} XP · ${label}`);
  if(after.level>before.level) pushToast(`🎉 Level up! You're now Level ${after.level}`, true);
}
function activeDateSet(){
  const set = new Set();
  state.state.items.forEach(it=>{ if(it.status==='done' && it.completedAt){ set.add(it.completedAt.slice(0,10)); } });
  state.state.habits.forEach(h=>{ Object.keys(h.log).forEach(d=>{ if(h.log[d]) set.add(d); }); });
  return set;
}
function dayStreak(){
  const set = activeDateSet();
  let cursor = new Date(); let streak=0; let first=true;
  while(true){
    const key = fmtISO(cursor);
    if(set.has(key)) streak++;
    else if(!first) break;
    first=false;
    cursor = addDays(cursor,-1);
    if(streak>3650) break;
  }
  return streak;
}

/* =========================================================
   Toasts
   ========================================================= */
function pushToast(msg, big){
  const stack = qs('#toast-stack');
  const el = document.createElement('div');
  el.className = 'toast'+(big?' level':'');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(),220); }, big?3200:2200);
}

/* Move within an array, clamped. Returns true when something actually moved. */
function moveInArray(arr, from, dir){
  const to = from + dir;
  if(from<0 || from>=arr.length || to<0 || to>=arr.length) return false;
  const [x] = arr.splice(from,1);
  arr.splice(to,0,x);
  return true;
}
/* Reorder the shared items array so `view` (a filtered slice) takes a new order. */

  all[a] = view[to]; all[b] = view[from];
  return true;
}

/* =========================================================
   Project analytics — one source of truth for every % in the app.

   Completion is EFFORT-WEIGHTED: each milestone / child task carries an
   S·M·L·XL size (1/2/3/5), so closing a three-week survey moves the bar
   further than closing a phone call. Schedule progress is measured against
   the project's own createdAt -> dueDate window, and the gap between the two
   is what tells you whether a project is actually healthy.
   ========================================================= */
function effortWeight(x){ return (EFFORT[x && x.effort] || EFFORT[DEFAULT_EFFORT]).weight; }
/* A project's schedule window opens on its start date if it has one, else on creation. */
function explicitStartMs(p){
  const t = p.startDate ? Date.parse(p.startDate+'T00:00:00') : NaN;
  return isNaN(t) ? null : t;
}
function projectStartMs(p){
  const t = explicitStartMs(p);
  return t!=null ? t : (Date.parse(p.createdAt) || Date.now());
}
function cycleEffort(key){
  const i = EFFORT_ORDER.indexOf(EFFORT[key] ? key : DEFAULT_EFFORT);
  return EFFORT_ORDER[(i+1) % EFFORT_ORDER.length];
}
function dayDiff(fromMs, toMs){ return Math.round((toMs-fromMs)/86400000); }
function endOfDayMs(dateISO){ const t = Date.parse(dateISO+'T23:59:59'); return isNaN(t)?null:t; }
function clampPct(n){ return Math.max(0, Math.min(100, n)); }

/* Every countable unit of a project: its milestones plus its child tasks. */
function projectUnits(p){
  const units = [];
  (p.subtasks||[]).forEach(s=>units.push({
    kind:'milestone', id:s.id, title:s.title, done:!!s.done,
    weight:effortWeight(s), effort:(EFFORT[s.effort]?s.effort:DEFAULT_EFFORT),
    doneAt:s.doneAt||null, dueDate:null
  }));
  tasksOf(p.id).forEach(c=>units.push({
    kind:'task', id:c.id, title:c.title, done:c.status==='done',
    weight:effortWeight(c), effort:(EFFORT[c.effort]?c.effort:DEFAULT_EFFORT),
    doneAt:c.completedAt||null, dueDate:c.dueDate||null
  }));
  return units;
}

function projectStats(p){
  const units = projectUnits(p);
  const total = units.length;
  const done = units.filter(u=>u.done).length;
  const weightTotal = units.reduce((a,u)=>a+u.weight, 0);
  const weightDone  = units.reduce((a,u)=>a+(u.done?u.weight:0), 0);
  const hasPlan = total > 0;
  const isDone = p.status==='done';

  // Effort-weighted completion. A project with no steps has NO percentage —
  // it is unmeasured, which is a different thing from 0% done.
  const pct = hasPlan ? Math.round(weightDone/weightTotal*100) : (isDone?100:null);
  const countPct = hasPlan ? Math.round(done/total*100) : (isDone?100:null);

  // Schedule: how much of the project's own window has been spent. The window opens on
  // startDate when one is set, so a project that sat in the list before work began is not
  // punished for the wait; otherwise it falls back to when the project was created.
  const nowMs = Date.now();
  const startMs = projectStartMs(p);
  const startedFromDate = explicitStartMs(p)!=null;
  const notStarted = startMs > nowMs;
  const dueMs = p.dueDate ? endOfDayMs(p.dueDate) : null;
  let timePct = null, daysTotal = null, daysLeft = null, daysElapsed = null;
  if(dueMs){
    daysTotal = Math.max(1, dayDiff(startMs, dueMs));
    daysElapsed = dayDiff(startMs, nowMs);
    daysLeft = dayDiff(nowMs, dueMs);
    timePct = clampPct((nowMs-startMs)/Math.max(1,(dueMs-startMs))*100);
  }
  const overdue = !!(dueMs && !isDone && nowMs > dueMs);
  // Schedule variance in percentage points: positive = ahead of the calendar.
  const variance = (pct!=null && timePct!=null) ? Math.round(pct - timePct) : null;

  // Last time any step in this project actually closed.
  const stamps = units.filter(u=>u.done && u.doneAt).map(u=>Date.parse(u.doneAt)).filter(n=>!isNaN(n));
  const lastActivityMs = stamps.length ? Math.max.apply(null, stamps) : null;
  const daysSinceActivity = dayDiff(lastActivityMs!=null?lastActivityMs:startMs, nowMs);
  const stalled = hasPlan && !isDone && !notStarted && pct<100 && daysSinceActivity>=STALL_DAYS;

  let health;
  if(isDone || pct===100) health='done';
  else if(!hasPlan) health='noplan';
  else if(overdue) health='overdue';
  else if(notStarted) health='notstarted';
  else if(timePct==null) health='nodate';
  else if(variance>=HEALTH_AHEAD_MIN) health='ahead';
  else if(variance>=HEALTH_TRACK_MIN) health='ontrack';
  else if(variance>=HEALTH_RISK_MIN) health='risk';
  else health='behind';

  return {
    units, hasPlan, done, total, weightDone, weightTotal,
    pct, countPct, timePct, variance, overdue, health,
    daysTotal, daysLeft, daysElapsed, lastActivityMs, daysSinceActivity, stalled,
    startMs, startedFromDate, notStarted
  };
}

/* Reconstruct a project's completion curve from when each step was closed.
   Steps completed before the app started recording dates have no timestamp;
   they are counted from the start of the window (flagged in the UI). */
function projectHistory(p, maxPoints){
  const units = projectUnits(p);
  const weightTotal = units.reduce((a,u)=>a+u.weight, 0);
  if(!weightTotal) return { points:[], undated:0 };
  const undated = units.filter(u=>u.done && !u.doneAt).length;
  const nowMs = Date.now();
  const startMs = Math.min(projectStartMs(p), nowMs);
  const span = Math.max(86400000, nowMs-startMs);
  const n = Math.max(2, Math.min(maxPoints||14, Math.ceil(span/86400000)+1));
  const points = [];
  for(let i=0;i<n;i++){
    const at = startMs + span*(i/(n-1));
    const w = units.reduce((a,u)=>{
      if(!u.done) return a;
      const t = u.doneAt ? Date.parse(u.doneAt) : startMs;   // undated = already done at window start
      return a + ((isNaN(t)?startMs:t) <= at ? u.weight : 0);
    }, 0);
    points.push({ ms:at, label:new Date(at).toLocaleDateString(undefined,{month:'short',day:'numeric'}), pct:Math.round(w/weightTotal*100) });
  }
  return { points, undated };
}

/* Portfolio roll-up: one number for the whole book of work, plus a
   per-domain breakdown so IntelMotion / Nigist / Tamar read separately. */
function portfolioStats(list){
  const rows = list.map(p=>({ p, st:projectStats(p) }));
  const planned = rows.filter(r=>r.st.hasPlan);
  const weightTotal = planned.reduce((a,r)=>a+r.st.weightTotal, 0);
  const weightDone  = planned.reduce((a,r)=>a+r.st.weightDone, 0);
  const health = {};
  HEALTH_ORDER.forEach(k=>health[k]=0);
  rows.forEach(r=>{ health[r.st.health] = (health[r.st.health]||0)+1; });

  const areaMap = {};
  rows.forEach(r=>{
    const key = r.p.category || 'Uncategorised';
    const a = areaMap[key] || (areaMap[key] = { area:key, count:0, planned:0, weightDone:0, weightTotal:0, offTrack:0, stalled:0, noPlan:0 });
    a.count++;
    if(r.st.hasPlan){ a.planned++; a.weightDone+=r.st.weightDone; a.weightTotal+=r.st.weightTotal; }
    else a.noPlan++;
    if(r.st.health==='behind' || r.st.health==='risk' || r.st.health==='overdue') a.offTrack++;
    if(r.st.stalled) a.stalled++;
  });
  const byArea = Object.values(areaMap).map(a=>Object.assign(a, {
    pct: a.weightTotal ? Math.round(a.weightDone/a.weightTotal*100) : null
  })).sort((x,y)=>(y.offTrack-x.offTrack) || (y.count-x.count) || x.area.localeCompare(y.area));

  return {
    rows, total:rows.length,
    plannedCount: planned.length,
    noPlanCount: rows.length - planned.length,
    weightDone, weightTotal,
    weightedPct: weightTotal ? Math.round(weightDone/weightTotal*100) : null,
    simplePct: planned.length ? Math.round(planned.reduce((a,r)=>a+r.st.pct,0)/planned.length) : null,
    offTrack: health.behind + health.risk + health.overdue,
    stalledCount: rows.filter(r=>r.st.stalled).length,
    health, byArea
  };
}

/* Every roll-up number is a question: which projects is this? Each tile and each
   domain row drills into the list behind it, so a "1 off track" is never a dead end.
   `pick` takes the {p,st} rows portfolioStats already computed — no recount, so the
   list can never disagree with the tile it came from. */
const ROLLUP_DRILLS = {
  weighted: {
    label: 'Weighted complete',
    blurb: port => `${port.weightDone} of ${port.weightTotal} effort points closed across ${port.plannedCount} measurable project${port.plannedCount===1?'':'s'}. Big projects move this number more than small ones.`,
    empty: 'No project has been broken into steps yet, so there is no weighted percentage to explain.',
    pick: rows => rows.filter(r=>r.st.hasPlan),
    sort: (a,b) => (b.st.weightTotal-b.st.weightDone)-(a.st.weightTotal-a.st.weightDone),
    note: st => `${st.weightDone}/${st.weightTotal} points · ${st.weightTotal-st.weightDone} left`
  },
  average: {
    label: 'Average project',
    blurb: port => `The plain average of each measurable project's own percentage — every project counts once, whatever its size. Weighted, the same book of work reads ${port.weightedPct==null?'—':port.weightedPct+'%'}.`,
    empty: 'No project has been broken into steps yet, so there is nothing to average.',
    pick: rows => rows.filter(r=>r.st.hasPlan),
    sort: (a,b) => a.st.pct-b.st.pct,
    note: st => `${st.pct}% · ${st.done}/${st.total} steps`
  },
  offtrack: {
    label: 'Off track',
    blurb: () => 'Less work done than time spent, or already past the due date. Variance is percentage points: -20 means you are twenty points behind where the calendar says you should be.',
    empty: 'Nothing is off track — every measurable project is level with its schedule or ahead of it.',
    pick: rows => rows.filter(r=>r.st.health==='behind'||r.st.health==='risk'||r.st.health==='overdue'),
    sort: (a,b) => (a.st.variance==null?99:a.st.variance)-(b.st.variance==null?99:b.st.variance),
    note: st => `${st.pct}% done vs ${st.timePct==null?'—':Math.round(st.timePct)+'%'} of the time`
       + (st.variance!=null?` · ${st.variance>0?'+':''}${st.variance}pts`:'')
       + (st.daysLeft!=null?` · ${st.daysLeft<0?Math.abs(st.daysLeft)+'d overdue':st.daysLeft+'d left'}`:''),
    // The note already carries the deadline; a due chip beside it only restates it.
    hideDue: true
  },
  stalled: {
    label: `Stalled ${STALL_DAYS}d+`,
    blurb: () => `No step has closed in ${STALL_DAYS} days or more. The project may still be on schedule — stalled is about movement, not deadlines.`,
    empty: `Nothing has stalled — every measurable project has closed a step in the last ${STALL_DAYS} days.`,
    pick: rows => rows.filter(r=>r.st.stalled),
    sort: (a,b) => b.st.daysSinceActivity-a.st.daysSinceActivity,
    note: st => `${st.daysSinceActivity}d since a step closed · ${st.pct}% done`
  },
  noplan: {
    label: 'Not broken down',
    blurb: () => 'No milestones and no tasks, so these have no measurable completion — they are not 0% done, they are unmeasured, and they are excluded from every percentage above. Add steps to bring them into the roll-up.',
    empty: 'Every project has been broken into steps.',
    pick: rows => rows.filter(r=>!r.st.hasPlan),
    sort: (a,b) => a.p.title.localeCompare(b.p.title),
    note: () => 'No milestones or tasks yet'
  },
  all: {
    label: 'Projects',
    blurb: port => `Every active project. ${port.plannedCount} measurable, ${port.noPlanCount} not broken down. Archived projects are not counted here.`,
    empty: 'No active projects.',
    pick: rows => rows,
    sort: (a,b) => HEALTH_ORDER.indexOf(a.st.health)-HEALTH_ORDER.indexOf(b.st.health) || (b.st.weightTotal-a.st.weightTotal),
    note: st => st.hasPlan ? `${st.pct}% · ${st.done}/${st.total} steps · ${st.weightDone}/${st.weightTotal} points` : 'No milestones or tasks yet'
  }
};

/* ---------- shared progress UI fragments ---------- */
function healthChip(st){
  const m = HEALTH_META[st.health];
  const v = st.variance!=null && st.health!=='done' && st.health!=='noplan' && st.health!=='notstarted'
    ? ` ${st.variance>0?'+':''}${st.variance}pts` : '';

}
function healthTitle(st){
  if(!st.hasPlan) return 'No milestones or tasks yet — this project has no measurable completion.';
  if(st.notStarted) return 'Start date is still in the future — the schedule clock has not begun.';
  if(st.timePct==null) return 'No due date, so completion cannot be compared against a schedule.';
  return `${st.pct}% of the work done, ${Math.round(st.timePct)}% of the time spent`
       + (st.daysLeft!=null ? ` · ${st.daysLeft<0?Math.abs(st.daysLeft)+'d overdue':st.daysLeft+'d left'}` : '');
}
function stalledChip(st){

}
/* Bar with a tick showing where the calendar says you should be. */
function progressBar(st, extraStyle){
  const styleAttr = extraStyle ? ` style="${extraStyle}"` : '';
  if(!st.hasPlan){
    return `<div class="project-progress-track"${styleAttr}><div class="project-progress-fill" style="width:0%;background:var(--c-border-strong)"></div></div>`;
  }

    ? `<div class="sched-marker" style="left:calc(${clampPct(st.timePct).toFixed(1)}% - 1px)" title="Schedule: ${Math.round(st.timePct)}% of the time window spent"></div>`
    : '';

function pctLabel(st){ return st.hasPlan ? `${st.pct}%` : 'Not broken down'; }
function effortChip(effortKey, dataAttrs){

function upNextCandidates(){
  const pinned = new Set(nowPins());
  return openTasks()
    .filter(i=>!pinned.has(i.id) && (i.isStarred || i.priority==='high'))
    .sort((a,b)=>{
      const pr = {high:0,medium:1,low:2};
      if(pr[a.priority]!==pr[b.priority]) return pr[a.priority]-pr[b.priority];
      if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
      if(a.dueDate) return -1; if(b.dueDate) return 1;
      return a.createdAt.localeCompare(b.createdAt);
    });
}

function fillNowSlots(){
  const pins = nowPins();
  const pool = upNextCandidates();
  while(pins.length<3 && pool.length){
    const next = pool.shift();
    pins.push(next.id);
  }
}

   Mutations
   ========================================================= */
function newItem(partial){
  const it = Object.assign({
    id: uid(), type:'task', title:'', status:'open',
    category:'Inbox', priority:'medium', dueDate:null, createdAt: new Date().toISOString(),
    completedAt:null, projectId:null, subtasks:[], assignee:null,
    contactName:null, lastContactDate:null, isStarred:false, xpAwarded:false, effort:DEFAULT_EFFORT, startDate:null
  }, partial);
  items().push(it);
  return it;
}

function completeItem(item, viaCheckbox){
  const wasDone = item.status==='done';
  item.status = wasDone ? 'open' : 'done';
  item.completedAt = item.status==='done' ? new Date().toISOString() : null;
  if(item.status==='done' && !item.xpAwarded){
    const isMilestoneTask = item.type==='task' && item.projectId;
    grantXP(isMilestoneTask?XP_MILESTONE:XP_TASK, isMilestoneTask?'Milestone done':'Task done');
    item.xpAwarded = true;
    // remove from Now pins + auto-promote next pipeline item
    const pins = nowPins();
    const idx = pins.indexOf(item.id);
    if(idx>=0){ pins.splice(idx,1); fillNowSlots(); }
  }
}

function deleteItem(id){
  const toRemove = new Set([id, ...items().filter(i=>i.projectId===id).map(i=>i.id)]);
  state.state.items = items().filter(i=>!toRemove.has(i.id));
  const p = nowPins();
  toRemove.forEach(rid=>{ const pi=p.indexOf(rid); if(pi>=0) p.splice(pi,1); });
}

function convertToProject(item, category){
  item.type='project';
  item.category = category;
  item.priority = item.priority||'medium';
}

function toggleStar(item){ item.isStarred = !item.isStarred; }

function addLifeArea(name){
  name = (name||'').trim();
  if(!name || name==='Inbox' || state.state.lifeAreas.some(a=>a.name===name)) return false;
  state.state.lifeAreas.push({name, purpose:'', framework:[], routines:[], guiding_principle:'', open_items:[]});
  return true;
}
function deleteLifeArea(name){
  const idx = state.state.lifeAreas.findIndex(a=>a.name===name);
  if(idx<0) return;
  state.state.lifeAreas.splice(idx,1);
  items().forEach(i=>{ if(i.category===name) i.category='Inbox'; });
  state.state.habits.forEach(h=>{ if(h.category===name) h.category=null; });
}

function togglePin(item){
  const pins = nowPins();
  const idx = pins.indexOf(item.id);
  if(idx>=0){ pins.splice(idx,1); }
  else{
    if(pins.length>=3){ pushToast('Now is full (3/3) — unpin something first'); return; }
    pins.push(item.id);
  }
}

function toggleSubtask(item, subId){
  const s = item.subtasks.find(x=>x.id===subId);
  if(!s) return;
  s.done = !s.done;
  s.doneAt = s.done ? new Date().toISOString() : null;
  if(s.done && !s.xpAwarded){ grantXP(XP_MILESTONE,'Milestone done'); s.xpAwarded=true; }
}

function toggleHabit(habit, dateISO){
  if(dateISO>todayISO()) return;
  habit.log[dateISO] = !habit.log[dateISO];
  if(!habit.log[dateISO]) delete habit.log[dateISO];
  maybeAwardHabitBonus(dateISO);
}
function dowIndex(d){ return (d.getDay()+6)%7; } // 0=Mon..6=Sun, matches DAY_LABELS/startOfWeek
function isHabitRequiredOn(habit, dateISO){
  const f = habit.frequency || {type:'daily'};
  if(f.type==='days') return (f.days||[]).includes(dowIndex(new Date(dateISO+'T00:00:00')));
  if(f.type==='weekly') return false; // evaluated per-week, not required on any single day
  return true; // daily
}
function maybeAwardHabitBonus(dateISO){
  const habits = state.state.habits.filter(h=>h.active!==false && isHabitRequiredOn(h, dateISO));
  if(!habits.length) return;
  const allDone = habits.every(h=>h.log[dateISO]);
  const bonusList = state.state.gamification.habitBonusDates;
  if(allDone && bonusList.indexOf(dateISO)===-1){
    bonusList.push(dateISO);
    grantXP(XP_HABITS, 'All habits complete');
  }
}
function habitStreak(habit){
  const f = habit.frequency || {type:'daily'};
  if(f.type==='weekly') return weeklyHabitStreak(habit, f.target||1);
  let cursor=new Date(); let streak=0; let first=true;
  while(true){
    const key=fmtISO(cursor);
    if(isHabitRequiredOn(habit,key)){
      if(habit.log[key]) streak++;
      else if(!first) break;
    }
    first=false;
    cursor=addDays(cursor,-1);
    if(streak>3650) break;
  }
  return streak;
}
function weeklyHabitStreak(habit, target){
  let weekOffset=0, streak=0;
  while(true){
    const start = startOfWeek(addDays(new Date(), -7*weekOffset));
    let count=0;
    for(let i=0;i<7;i++){ if(habit.log[fmtISO(addDays(start,i))]) count++; }
    if(count>=target){
      streak++;
    } else if(weekOffset>0){
      break; // a fully-elapsed past week missed target — streak ends
    } // else: current week still in progress and hasn't hit target yet — skip, don't break
    weekOffset++;
    if(weekOffset>520) break;
  }
  return streak;
}
function fmtHabitStreak(habit){
  const n = habitStreak(habit);
  return (habit.frequency && habit.frequency.type==='weekly') ? `${n}wk` : `${n}d`;
}

function reviewPeriodKey(kind){
  if(kind==='daily')   return todayISO();
  if(kind==='monthly') return todayISO().slice(0,7);      // YYYY-MM
  return fmtISO(startOfWeek(new Date()));                  // Monday of this week
}
function reviewTicks(kind){
  const store = state.state.reviews[kind] || (state.state.reviews[kind] = {});
  const key = reviewPeriodKey(kind);
  // Only the current period is kept — a new day or week starts clean.
  if(store.key !== key){ store.key = key; store.done = {}; }
  if(!store.done) store.done = {};
  return store;
}

/* ---------- REPORTS ---------- */
function completedItems(){ return items().filter(i=>i.status==='done' && i.completedAt); }

function fmtHistoryDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function inHistoryRange(it){
  const d = it.completedAt.slice(0,10);
  const today = todayISO();
  if(ui.historyRange==='month'){ const first = today.slice(0,8)+'01'; return d>=first && d<=today; }
  if(ui.historyRange==='30d'){ return d>=fmtISO(addDays(new Date(),-30)) && d<=today; }
  if(ui.historyRange==='custom'){
    if(ui.historyCustomFrom && d<ui.historyCustomFrom) return false;
    if(ui.historyCustomTo && d>ui.historyCustomTo) return false;
    return true;
  }
  return true;
}

function habitConsistency(habit, days){
  days = days||30;
  const f = habit.frequency || {type:'daily'};
  if(f.type==='weekly'){
    const target = f.target||1;
    let done=0, cursor=new Date();
    for(let i=0;i<days;i++){ if(habit.log[fmtISO(cursor)]) done++; cursor=addDays(cursor,-1); }
    const expected = target * (days/7);
    return expected>0 ? Math.min(100, Math.round(done/expected*100)) : 0;
  }
  let done=0, required=0, cursor=new Date();
  for(let i=0;i<days;i++){
    const key=fmtISO(cursor);
    if(isHabitRequiredOn(habit,key)){ required++; if(habit.log[key]) done++; }
    cursor=addDays(cursor,-1);
  }
  return required? Math.round(done/required*100) : 0;
}

/* =========================================================
   Charts (Chart.js) — canvases are rebuilt on every render()
   ========================================================= */
let charts = {};
function destroyCharts(){
  Object.values(charts).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  charts = {};
}
function chartTextColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--c-text-secondary')||'').trim() || '#475569'; }
function chartGridColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--c-border')||'').trim() || '#E2E8F0'; }
function barChartOptions(horizontal){
  const tc = chartTextColor(), gc = chartGridColor();
  const valueAxis = { min:0, max:100, ticks:{ color:tc }, grid:{ color:gc } };
  const countAxis = { beginAtZero:true, ticks:{ color:tc, precision:0 }, grid:{ color:gc } };
  const labelAxis = { ticks:{ color:tc }, grid:{ display:false } };
  return {
    indexAxis: horizontal? 'y':'x',
    responsive:true, maintainAspectRatio:false,
    scales: horizontal? { x:valueAxis, y:labelAxis } : { y:countAxis, x:labelAxis },
    plugins:{ legend:{ display:false } }
  };
}
function areaTaskPct(a){
  const areaItems = items().filter(i=>i.category===a.name && (i.type==='task'||i.type==='project'));
  const done = areaItems.filter(i=>i.status==='done').length;
  return areaItems.length? Math.round(done/areaItems.length*100) : 0;
}
function projectPct(p){ const st = projectStats(p); return st.pct==null ? 0 : st.pct; }
const HEALTH_BAR_COLOR = { done:'#10B981', ahead:'#10B981', ontrack:'#06B6D4', nodate:'#94A3B8', notstarted:'#94A3B8', risk:'#F59E0B', behind:'#F43F5E', overdue:'#F43F5E', noplan:'#CBD5E1' };
/* Chart.js comes from a CDN — render no card at all rather than an empty box when it is unavailable. */
function chartsAvailable(){ return typeof Chart!=='undefined'; }
function chartCard(id, height, extraStyle){
  if(!chartsAvailable()) return '';
  return `<div class="card" style="margin-bottom:18px;height:${height}px${extraStyle?';'+extraStyle:''}"><canvas id="${id}"></canvas></div>`;
}

function renderCharts(){
  destroyCharts();
  if(typeof Chart==='undefined') return;

  const areasCanvas = document.getElementById('chart-areas');
  if(areasCanvas){
    const areas = state.state.lifeAreas;
    charts.areas = new Chart(areasCanvas, { type:'bar',
      data:{ labels: areas.map(a=>a.name), datasets:[{ data: areas.map(areaTaskPct), backgroundColor:'#6366F1', borderRadius:4 }] },
      options: barChartOptions(true)
    });
  }
  const projCanvas = document.getElementById('chart-projects');
  if(projCanvas){
    const rows = reportProjectRows().filter(r=>r.st.hasPlan);
    charts.projects = new Chart(projCanvas, { type:'bar',
      data:{ labels: rows.map(r=>r.p.title), datasets:[
        { label:'Complete', data: rows.map(r=>r.st.pct), backgroundColor: rows.map(r=>HEALTH_BAR_COLOR[r.st.health]||'#06B6D4'), borderRadius:4 },
        { label:'Schedule spent', data: rows.map(r=>r.st.timePct==null?null:Math.round(r.st.timePct)), backgroundColor:'transparent',
          borderColor:'#64748B', borderWidth:{top:0,right:2,bottom:0,left:0}, borderRadius:0, barPercentage:.62, grouped:false }
      ] },
      options: Object.assign(barChartOptions(true), { plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ label:(c)=> c.raw==null ? '' : `${c.dataset.label}: ${c.raw}%` } } } })
    });
  }

  const portCanvas = document.getElementById('chart-portfolio');
  if(portCanvas){
    // Domains whose projects have no plan have no percentage — charting them as 0 would lie.
    const measurable = portfolioStats(reportProjectList()).byArea.filter(a=>a.pct!=null);
    charts.portfolio = new Chart(portCanvas, { type:'bar',
      data:{ labels: measurable.map(a=>a.area), datasets:[{ data: measurable.map(a=>a.pct), backgroundColor:'#6366F1', borderRadius:4 }] },
      options: barChartOptions(true)
    });
  }
  const habitCanvas = document.getElementById('chart-habits');
  if(habitCanvas){
    const list = state.state.habits;
    charts.habits = new Chart(habitCanvas, { type:'bar',
      data:{ labels: list.map(h=>h.emoji+' '+h.name), datasets:[{ data: list.map(h=>habitConsistency(h)), backgroundColor:'#F59E0B', borderRadius:4 }] },
      options: barChartOptions(true)
    });
  }
  const timelineCanvas = document.getElementById('chart-timeline');
  if(timelineCanvas){
    const byDay = {};
    completedItems().filter(inHistoryRange).forEach(it=>{ const d=it.completedAt.slice(0,10); byDay[d]=(byDay[d]||0)+1; });
    const days = Object.keys(byDay).sort();
    charts.timeline = new Chart(timelineCanvas, { type:'bar',
      data:{ labels: days.map(d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})), datasets:[{ data: days.map(d=>byDay[d]), backgroundColor:'#10B981', borderRadius:4 }] },
      options: barChartOptions(false)
    });
  }
}

function fmtWeekLabel(weekOffset){
  const start = startOfWeek(addDays(new Date(), -7*weekOffset));
  const end = addDays(start,6);
  const opts = {month:'short',day:'numeric'};
  const label = start.toLocaleDateString(undefined,opts)+' – '+end.toLocaleDateString(undefined,opts);
  return weekOffset===0 ? `This week (${label})` : label;
}

  const port = portfolioStats(reportProjectList().filter(p=>p.category===a.name));
  return `<div class="project-card">

/* Active (non-archived) projects — the book of work the roll-up reports on. */
function reportProjectList(){ return projects().filter(p=>inactiveProjects.indexOf(p.id)===-1); }
function reportProjectRows(){
  const rows = reportProjectList().map(p=>({ p, st:projectStats(p) }));
  const f = ui.projectHealthFilter;
  let kept = f==='offtrack' ? rows.filter(r=>r.st.health==='behind'||r.st.health==='risk'||r.st.health==='overdue')
             : f==='stalled'  ? rows.filter(r=>r.st.stalled)
             : f==='noplan'   ? rows.filter(r=>!r.st.hasPlan)
             : rows;
  if(ui.reportsSearch) kept = kept.filter(r=>matchesSearch(r.p.title, ui.reportsSearch) || matchesSearch(r.p.category, ui.reportsSearch));
  return kept.sort((a,b)=>HEALTH_ORDER.indexOf(a.st.health)-HEALTH_ORDER.indexOf(b.st.health)
                        || (b.st.weightTotal-a.st.weightTotal));
}

    <div class="section-label">By domain</div>
    ${port.byArea.some(a=>a.pct!=null)? chartCard('chart-portfolio', Math.max(130, port.byArea.filter(a=>a.pct!=null).length*34)) : ''}
    <div class="card" style="margin-bottom:20px;padding:14px 16px">

function openModal(html){
  qs('#modal-root').innerHTML = `<div class="modal-overlay" data-action="close-modal"><div class="modal">${html}</div></div>`;
}
let habitTrendChart = null;
let projectTrendChart = null;
function closeModal(){
  if(habitTrendChart){ try{ habitTrendChart.destroy(); }catch(e){} habitTrendChart=null; }
  if(projectTrendChart){ try{ projectTrendChart.destroy(); }catch(e){} projectTrendChart=null; }
  qs('#modal-root').innerHTML='';
}

/* The list behind a roll-up number. `area` narrows it to one domain, which is
   what a click on a By-domain row does. */
function modalRollupDrill(key, area){
  const d = ROLLUP_DRILLS[key] || ROLLUP_DRILLS.all;
  const scoped = reportProjectList().filter(p=>!area || (p.category||'Uncategorised')===area);
  const port = portfolioStats(scoped);
  const list = d.pick(port.rows).slice().sort(d.sort);

  const row = r => `<div class="project-card" style="margin-bottom:8px">
    <div class="project-head" data-action="open-project-report" data-id="${r.p.id}">
      <div class="item-main">
        <div class="project-title">${esc(r.p.title)}</div>
        <div class="item-meta">
          <span class="chip" style="${catStyle(r.p.category)}">${esc(r.p.category)}</span>
          ${healthChip(r.st)}
          ${stalledChip(r.st)}
          <span>${esc(d.note(r.st, r.p))}</span>
          ${r.p.dueDate && !d.hideDue? `<span>${fmtDue(r.p.dueDate)}</span>`:''}
        </div>
        ${progressBar(r.st)}
      </div>
    </div>
  </div>`;

  openModal(`
    <h3>${esc(d.label)}${area? ' — '+esc(area):''} <span style="font-family:'JetBrains Mono',monospace">(${list.length})</span></h3>
    <div class="view-sub" style="margin-bottom:14px">${esc(d.blurb(port))}</div>
    ${list.length ? list.map(row).join('') : `<div class="empty">${esc(d.empty)}</div>`}
    <div class="view-sub" style="margin-top:12px">Click any project for its full report.</div>
    <div class="modal-actions">
      ${key!=='all' || area ? `<button class="btn" data-action="rollup-drill" data-key="all">All projects</button>` : ''}
      <button class="btn btn-primary" data-action="close-modal">Close</button>
    </div>`);
}

      </select>

      <div class="chip-row" style="margin-bottom:0">
        ${DAY_LABELS.map((lbl,i)=>`<button type="button" class="chip ${days.includes(i)?'on':''}" data-action="toggle-hb-day" data-day="${i}">${lbl}</button>`).join('')}
      </div>
    </div>
    <div class="field" id="hb-freq-target-wrap" style="${freq.type==='weekly'?'':'display:none'}">
      <label>Times per week</label>
      <input id="hb-freq-target" type="number" min="1" max="7" value="${target}"/>

}
function readHabitFrequencyFromForm(){
  const type = qs('#hb-freq-type').value;
  if(type==='days'){
    const days = qsa('[data-action="toggle-hb-day"].on').map(b=>+b.getAttribute('data-day'));
    return {type:'days', days: days.length?days:[0,1,2,3,4,5,6]};
  }
  if(type==='weekly'){
    const target = Math.max(1, Math.min(7, parseInt(qs('#hb-freq-target').value,10)||3));
    return {type:'weekly', target};
  }
  return {type:'daily'};
}

function renameLifeArea(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return false;
  if(state.state.lifeAreas.some(a=>a.name===newName)) return false;
  const a = state.state.lifeAreas.find(x=>x.name===oldName);
  if(!a) return false;
  a.name = newName;
  items().forEach(i=>{ if(i.category===oldName) i.category = newName; });
  state.state.habits.forEach(h=>{ if(h.category===oldName) h.category = newName; });
  if(ui.projectFilter===oldName) ui.projectFilter = newName;
  return true;
}
function mergeLifeArea(fromName, intoName){
  if(!fromName || !intoName || fromName===intoName) return false;
  if(!state.state.lifeAreas.some(a=>a.name===intoName)) return false;
  items().forEach(i=>{ if(i.category===fromName) i.category = intoName; });
  state.state.habits.forEach(h=>{ if(h.category===fromName) h.category = intoName; });
  const idx = state.state.lifeAreas.findIndex(a=>a.name===fromName);
  if(idx>=0) state.state.lifeAreas.splice(idx,1);
  if(ui.projectFilter===fromName) ui.projectFilter = intoName;
  return true;
}

function modalHabitDetail(h){
  const pct7 = habitConsistency(h,7);
  const pct30 = habitConsistency(h,30);
  const cells = [];
  let cursor = new Date();
  for(let i=0;i<30;i++){ cells.unshift({date:fmtISO(cursor), done: !!h.log[fmtISO(cursor)]}); cursor=addDays(cursor,-1); }
  const weeks = [];
  for(let w=11;w>=0;w--){
    let wDone=0, c2=addDays(new Date(),-7*w);
    for(let i=0;i<7;i++){ if(h.log[fmtISO(c2)]) wDone++; c2=addDays(c2,-1); }
    weeks.push({label: w===0?'This wk':`-${w}w`, pct: Math.round(wDone/7*100)});
  }
  openModal(`
    <h3>${h.emoji} ${esc(h.name)}</h3>
    <div class="item-meta" style="margin-bottom:14px">
      ${h.category?`<span class="chip" style="${catStyle(h.category)}">${esc(h.category)}</span>`:'<span>Unassigned</span>'}
      <span>🔥 ${habitStreak(h)}d streak</span>
      <span>${pct7}% this week · ${pct30}% last 30d</span>
    </div>
    <div class="section-label">12-week trend</div>
    <div style="height:140px;margin-bottom:16px"><canvas id="chart-habit-trend"></canvas></div>
    <div class="section-label">Last 30 days</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">
      ${cells.map(c=>`<div title="${c.date}${c.done?' — done':''}" style="width:18px;height:18px;border-radius:5px;background:${c.done?'var(--c-good)':'var(--c-surface-alt)'};border:1px solid var(--c-border)"></div>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" data-action="close-modal">Close</button>
    </div>`);
  if(habitTrendChart){ try{ habitTrendChart.destroy(); }catch(e){} habitTrendChart=null; }
  if(typeof Chart!=='undefined'){
    const el = document.getElementById('chart-habit-trend');
    const tc = chartTextColor(), gc = chartGridColor();
    if(el) habitTrendChart = new Chart(el, {
      type:'line',
      data:{ labels: weeks.map(w=>w.label), datasets:[{ data: weeks.map(w=>w.pct), borderColor:'#6366F1', backgroundColor:'#6366F133', fill:true, tension:.3 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{ y:{ min:0, max:100, ticks:{color:tc}, grid:{color:gc} }, x:{ ticks:{color:tc}, grid:{display:false} } },
        plugins:{ legend:{ display:false } } }
    });
  }
}

/* =========================================================
   Bulk import — paste a JSON block to create projects, their
   milestones and tasks, habits and any life areas they need.

   Purely additive: nothing is ever deleted or overwritten. A project
   whose title already exists is skipped and reported, so re-importing
   the same block twice is safe.
   ========================================================= */
const IMPORT_PRIORITIES = ['low','medium','high'];

function planImport(text){
  let raw;
  try{ raw = JSON.parse(text); }
  catch(e){ return {error:'That is not valid JSON — copy the whole block including the outer { and }.'}; }
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) return {error:'Expected a JSON object with "projects" and/or "habits".'};

  const plan = {areas:[], projects:[], habits:[], skippedProjects:[], skippedHabits:[], warnings:[]};
  const haveArea = new Set(state.state.lifeAreas.map(a=>a.name));
  const wantArea = n=>{
    n = String(n||'').trim();
    if(!n || n==='Inbox') return 'Inbox';
    if(!haveArea.has(n) && plan.areas.indexOf(n)<0) plan.areas.push(n);
    return n;
  };
  (Array.isArray(raw.lifeAreas) ? raw.lifeAreas : []).forEach(wantArea);

  const effortOf = v => EFFORT[v] ? v : DEFAULT_EFFORT;
  const dateOf = v => (typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null;
  const priorityOf = v => IMPORT_PRIORITIES.indexOf(v)>=0 ? v : 'medium';

  const takenProject = new Set(projects().map(p=>p.title.trim().toLowerCase()));
  (Array.isArray(raw.projects) ? raw.projects : []).forEach(p=>{
    if(!p || typeof p!=='object') return;
    const title = String(p.title||'').trim();
    if(!title){ plan.warnings.push('A project with no title was skipped.'); return; }
    if(takenProject.has(title.toLowerCase())){ plan.skippedProjects.push(title); return; }
    takenProject.add(title.toLowerCase());
    const category = wantArea(p.category);
    const start = dateOf(p.startDate), due = dateOf(p.dueDate);
    if(start && due && start > due){
      plan.warnings.push(`"${title}": start date is after the due date — both dropped.`);
    }
    plan.projects.push({
      title, category,
      priority: priorityOf(p.priority),
      startDate: (start && due && start > due) ? null : start,
      dueDate: (start && due && start > due) ? null : due,
      assignee: (typeof p.assignee==='string' && p.assignee.trim()) ? p.assignee.trim() : null,
      starred: !!p.starred,
      archived: !!p.archived,
      milestones: (Array.isArray(p.milestones)?p.milestones:[]).map(m=>({
        title: String((m&&m.title)||'').trim(), effort: effortOf(m&&m.effort)
      })).filter(m=>m.title),
      tasks: (Array.isArray(p.tasks)?p.tasks:[]).map(t=>({
        title: String((t&&t.title)||'').trim(), effort: effortOf(t&&t.effort),
        dueDate: dateOf(t&&t.dueDate), priority: priorityOf(t&&t.priority),
        assignee: (t && typeof t.assignee==='string' && t.assignee.trim()) ? t.assignee.trim() : null
      })).filter(t=>t.title)
    });
  });

  const takenHabit = new Set(state.state.habits.map(h=>h.name.trim().toLowerCase()));
  (Array.isArray(raw.habits) ? raw.habits : []).forEach(h=>{
    if(!h || typeof h!=='object') return;
    const name = String(h.name||'').trim();
    if(!name){ plan.warnings.push('A habit with no name was skipped.'); return; }
    if(takenHabit.has(name.toLowerCase())){ plan.skippedHabits.push(name); return; }
    takenHabit.add(name.toLowerCase());
    let f = h.frequency;
    if(!f || typeof f!=='object') f = {type:'daily'};
    if(f.type==='days'){ f = {type:'days', days: Array.isArray(f.days)? f.days.filter(d=>d>=0&&d<=6) : [0,1,2,3,4,5,6]}; }
    else if(f.type==='weekly'){ f = {type:'weekly', target: Math.max(1, Math.min(7, parseInt(f.target,10)||3))}; }
    else f = {type:'daily'};
    plan.habits.push({
      name, emoji: String(h.emoji||'✅').slice(0,4),
      category: h.category ? wantArea(h.category) : null,
      frequency: f
    });
  });

  const total = plan.areas.length + plan.projects.length + plan.habits.length;
  if(!total && !plan.skippedProjects.length && !plan.skippedHabits.length){
    return {error:'Nothing to import — the block contained no projects, habits or life areas.'};
  }
  return plan;
}

function applyImport(plan){
  plan.areas.forEach(addLifeArea);
  let steps = 0, archivedAny = false;
  plan.projects.forEach(p=>{
    const proj = newItem({
      type:'project', title:p.title, category:p.category, priority:p.priority,
      startDate:p.startDate, dueDate:p.dueDate, assignee:p.assignee, isStarred:p.starred,
      subtasks: p.milestones.map(m=>({id:uid(), title:m.title, done:false, xpAwarded:false, effort:m.effort, doneAt:null}))
    });
    steps += p.milestones.length;
    p.tasks.forEach(t=>{
      newItem({ type:'task', title:t.title, projectId:proj.id, category:p.category,
        priority:t.priority, dueDate:t.dueDate, assignee:t.assignee, effort:t.effort });
      steps++;
    });
    if(p.archived && inactiveProjects.indexOf(proj.id)<0){ inactiveProjects.push(proj.id); archivedAny = true; }
  });
  plan.habits.forEach(h=>{
    state.state.habits.push({ id:uid(), name:h.name, emoji:h.emoji, category:h.category, log:{}, frequency:h.frequency, active:true });
  });
  if(archivedAny) saveInactive();
  persist();
  return {projects:plan.projects.length, steps, habits:plan.habits.length, areas:plan.areas.length};
}

function renderImportPlan(){
  const plan = ui.importPlan;
  if(!plan) return '';
  if(plan.error) return `<div class="import-plan import-err"><b>Could not read that.</b><br>${esc(plan.error)}</div>`;
  const li = [];
  if(plan.areas.length) li.push(`<li><b>${plan.areas.length}</b> new life area${plan.areas.length===1?'':'s'}: ${plan.areas.map(esc).join(', ')}</li>`);
  if(plan.projects.length){
    const steps = plan.projects.reduce((a,p)=>a+p.milestones.length+p.tasks.length, 0);
    const pts = plan.projects.reduce((a,p)=>a
      + p.milestones.reduce((b,m)=>b+EFFORT[m.effort].weight, 0)
      + p.tasks.reduce((b,t)=>b+EFFORT[t.effort].weight, 0), 0);
    li.push(`<li><b>${plan.projects.length}</b> project${plan.projects.length===1?'':'s'} with <b>${steps}</b> steps (${pts} effort points)</li>`);
  }
  if(plan.habits.length) li.push(`<li><b>${plan.habits.length}</b> habit${plan.habits.length===1?'':'s'}</li>`);
  if(plan.skippedProjects.length) li.push(`<li style="color:var(--c-warn)"><b>${plan.skippedProjects.length}</b> project${plan.skippedProjects.length===1?'':'s'} already exist and will be skipped: ${plan.skippedProjects.map(esc).join(', ')}</li>`);
  if(plan.skippedHabits.length) li.push(`<li style="color:var(--c-warn)"><b>${plan.skippedHabits.length}</b> habit${plan.skippedHabits.length===1?'':'s'} already exist and will be skipped</li>`);
  plan.warnings.forEach(w=>li.push(`<li style="color:var(--c-warn)">${esc(w)}</li>`));
  const nothing = !plan.areas.length && !plan.projects.length && !plan.habits.length;
  return `<div class="import-plan">
    <b>${nothing? 'Nothing new to add — it is all already here.' : 'Ready to import:'}</b>
    <ul>${li.join('')}</ul>
    ${nothing? '' : `<button class="btn btn-primary btn-sm" data-action="import-apply" style="margin-top:12px">Import ${plan.projects.length+plan.habits.length} item${plan.projects.length+plan.habits.length===1?'':'s'}</button>`}
  </div>`;
}

/* =========================================================
   Lightweight DOCX-compatible export (no external library)
   ========================================================= */
function downloadWordDoc(filename, title, bodyHtml){
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>${esc(title)}</title>
  <style>body{font-family:Calibri,Arial,sans-serif;font-size:12pt;color:#1E293B}h1{font-size:20pt;margin-bottom:4pt}h2{font-size:13pt;color:#475569;text-transform:uppercase;letter-spacing:.5pt;margin-top:18pt;border-bottom:1pt solid #E2E8F0;padding-bottom:4pt}
  p{margin:4pt 0}ul{margin:4pt 0}li{margin:2pt 0}.muted{color:#94A3B8}</style></head>
  <body>${bodyHtml}</body></html>`;
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportProjectReport(p){
  const st = projectStats(p);
  const eff = k=>(EFFORT[k]||EFFORT[DEFAULT_EFFORT]).label;
  const line = u=>`<li>${u.done?'☑':'☐'} [${eff(u.effort)}] ${esc(u.title)}${u.dueDate?` <span class="muted">(due ${esc(u.dueDate)})</span>`:''}${u.done&&u.doneAt?` <span class="muted">— closed ${esc(u.doneAt.slice(0,10))}</span>`:''}</li>`;
  const milestones = st.units.filter(u=>u.kind==='milestone');
  const tasks = st.units.filter(u=>u.kind==='task');
  const summary = st.hasPlan ? `
    <h2>At a glance</h2>
    <table cellpadding="6" cellspacing="0" border="1" style="border-collapse:collapse;border-color:#E2E8F0">
      <tr><td><b>Complete (effort-weighted)</b></td><td>${st.pct}%</td></tr>
      <tr><td>Unweighted step count</td><td>${st.countPct}% (${st.done} of ${st.total} steps)</td></tr>
      <tr><td>Effort closed</td><td>${st.weightDone} of ${st.weightTotal} points</td></tr>
      <tr><td>Schedule window</td><td>${new Date(st.startMs).toLocaleDateString()}${st.startedFromDate?' (start date)':' (project created)'}${p.dueDate?' → '+p.dueDate:' → no due date'}</td></tr>
      <tr><td>Schedule spent</td><td>${st.timePct==null?'No due date set':Math.round(st.timePct)+'% of the window'}</td></tr>
      <tr><td>Schedule variance</td><td>${st.variance==null?'—':(st.variance>0?'+':'')+st.variance+' pts (' + HEALTH_META[st.health].label + ')'}</td></tr>
      <tr><td>Time remaining</td><td>${st.daysLeft==null?'—':st.daysLeft<0?Math.abs(st.daysLeft)+' days overdue':st.daysLeft+' days left'}</td></tr>
      <tr><td>Last step closed</td><td>${st.lastActivityMs? st.daysSinceActivity+' days ago'+(st.stalled?' — STALLED':'') : 'No step closed yet'}</td></tr>
    </table>`
  : `<h2>At a glance</h2><p><b>No measurable completion.</b> This project has no milestones and no tasks, so it has no percentage — it is unmeasured rather than 0% done, and it is excluded from portfolio roll-ups.</p>`;
  const html = `<h1>${esc(p.title)}</h1>
    <p class="muted">Domain: ${esc(p.category)} &nbsp;·&nbsp; Priority: ${esc(p.priority)} &nbsp;·&nbsp; Status: ${esc(p.status)}${p.assignee?` &nbsp;·&nbsp; Owner: ${esc(p.assignee)}`:''}${p.startDate?` &nbsp;·&nbsp; Start ${esc(p.startDate)}`:''}${p.dueDate?` &nbsp;·&nbsp; Due ${esc(p.dueDate)}`:''}</p>
    <p class="muted">Generated ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p>
    ${summary}
    <h2>Milestones</h2><ul>${milestones.map(line).join('') || '<li class="muted">None</li>'}</ul>
    <h2>Tasks</h2><ul>${tasks.map(line).join('') || '<li class="muted">None</li>'}</ul>
    <p class="muted">Effort sizes: S=1, M=2, L=3, XL=5. Weighted completion is closed effort points over total effort points.</p>`;
  downloadWordDoc(`${p.title.replace(/[^a-z0-9]+/gi,'-')}-report.doc`, p.title, html);
  pushToast('Report downloaded');
}
