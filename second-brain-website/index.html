/* ---------- INBOX ---------- */
/* Every open task, wherever it lives — the Inbox is the one place to see them all.
   "Unfiled" is the classic inbox and is what Process Inbox works through. */
function allOpenTasks(){ return items().filter(i=>i.type==='task' && i.status==='open'); }
/* Scopes are filters, not a partition — Unfiled is deliberately a subset of
   Standalone. "Standalone" means exactly what the chip on each row means: not
   part of a project. It used to also require a domain, so a freshly captured
   task was chipped "standalone" on its own row and then missing from the
   Standalone scope, which is the one thing a filter must never do. */
function inboxScoped(){
  const t = allOpenTasks();
  // 'unfiled' is kept as an alias so an old saved view still resolves.
  if(ui.inboxScope==='project')     return t.filter(i=>i.projectId);
  if(ui.inboxScope==='standalone' || ui.inboxScope==='unfiled') return t.filter(i=>!i.projectId);
  if(ui.inboxScope==='recurring')   return t.filter(i=>i.seriesId);
  return t;
}

/* Exactly the rows the Inbox is showing, scope + filters + search applied.
   Rendering and reordering both call this, so row 3 on screen is row 3 here. */
/* Everything the Inbox is showing except the date filter. Kept separate so the
   date chips can count what each one would actually reveal, rather than counting
   against a list the date filter has already narrowed. */
/* Each filter holds a list of chosen values; empty means "everything". Within a
   filter the choices are OR'd — two domains means either — and the filters are
   AND'd with each other, which is what "these domains, due this week" means. */
function inboxBaseList(){
  let list = inboxScoped();
  if(ui.inboxAssignees.length) list = list.filter(i=>ui.inboxAssignees.indexOf(i.assignee)>=0);
  if(ui.inboxProjects.length)  list = list.filter(i=>ui.inboxProjects.indexOf(i.projectId)>=0);
  if(ui.inboxCategories.length)list = list.filter(i=>ui.inboxCategories.indexOf(i.category)>=0);
  if(ui.inboxSearch) list = list.filter(i=>matchesSearch(i.title, ui.inboxSearch)
    || matchesSearch(i.assignee, ui.inboxSearch)
    || matchesSearch(i.category, ui.inboxSearch)
    || (i.projectId && matchesSearch((byId(i.projectId)||{}).title, ui.inboxSearch)));
  return list;
}

/* Due-date buckets. "Next 7 days" includes today, so Today is a subset of it —
   they answer different questions and overlapping is the honest behaviour. */
const INBOX_DATES = {
  overdue:  { label:'Overdue',     match: it => !!it.dueDate && it.dueDate < todayISO() },
  today:    { label:'Today',       match: it => it.dueDate === todayISO() },
  week:     { label:'Next 7 days', match: it => !!it.dueDate && it.dueDate >= todayISO() && it.dueDate <= fmtISO(addDays(new Date(),7)) },
  nodate:   { label:'No date',     match: it => !it.dueDate }
};
function inboxAnyFilter(){
  return !!(ui.inboxCategories.length || ui.inboxProjects.length || ui.inboxDates.length || ui.inboxAssignees.length);
}
/* A label for a multi-select button: the value itself when one is chosen, a count
   when several, so the button says what it is doing without growing with the list. */
function pickLabel(chosen, none, noun, nameOf){
  if(!chosen.length) return none;
  if(chosen.length===1) return nameOf ? nameOf(chosen[0]) : chosen[0];
  return `${chosen.length} ${noun}`;
}

function inboxViewList(){
  let list = inboxBaseList();
  // Buckets overlap on purpose (Today is inside Next 7 days), so selecting both
  // must not list anything twice — matching any chosen bucket is enough.
  if(ui.inboxDates.length) list = list.filter(it=>ui.inboxDates.some(k=>INBOX_DATES[k] && INBOX_DATES[k].match(it)));
  // Anything without a domain sorts first — that is the work the Inbox is for.
  // A stable partition, so manual ordering inside each half is preserved.
  const needsDomain = list.filter(i=>i.category==='Inbox');
  return needsDomain.length ? needsDomain.concat(list.filter(i=>i.category!=='Inbox')) : list;
}

function renderInboxView(){
  const unfiled = inboxItems();
  const all = inboxScoped();
  const dateBase = inboxBaseList();
  // Only domains that actually hold something in this scope, with their counts —
  // a picker that offers empty choices is just a longer list to read.
  const domCounts = {};
  inboxScoped().forEach(i=>{ domCounts[i.category] = (domCounts[i.category]||0)+1; });
  // A chosen domain stays listed even at zero, so a choice never vanishes from its own picker.
  ui.inboxCategories.forEach(c=>{ if(domCounts[c]==null) domCounts[c]=0; });
  const inboxDomains = Object.keys(domCounts).sort((a,b)=>a==='Inbox'?-1:b==='Inbox'?1:a.localeCompare(b)).map(k=>[k,domCounts[k]]);
  const projList = projects();
  const assignees = Array.from(new Set(allOpenTasks().filter(i=>i.assignee).map(i=>i.assignee))).sort();
  const list = inboxViewList();
  return `<div class="view">
    <div class="view-head">
      <div><div class="view-title">Inbox</div><div class="view-sub">Every open task, wherever it lives. Capture here, then process the unfiled ones.</div></div>
      <button class="btn btn-primary" data-action="process-inbox">Process Inbox (${unfiled.length})</button>
    </div>
    <div class="capture">
      <input id="capture-input" type="text" placeholder="Capture a thought or task… (Enter to add)" data-action-enter="capture-add" />
      <button class="btn btn-primary" data-action="capture-add">Add</button>
    </div>
    <div class="chip-row">
      ${[['all','All open tasks',allOpenTasks().length,'Every open task, wherever it lives'],
         ['project','In a project',allOpenTasks().filter(i=>i.projectId).length,'A step inside a project'],
         ['standalone','Standalone',allOpenTasks().filter(i=>!i.projectId).length,'Not part of any project. Anything still needing a domain sorts to the top and is marked “needs a domain”.'],
         ['recurring','Recurring',allOpenTasks().filter(i=>i.seriesId).length,'Created by a recurring cadence']
        ].map(([k,label,n,tip])=>`<button class="chip ${ui.inboxScope===k?'on':''}" data-action="inbox-scope" data-scope="${k}" title="${esc(tip)}">${label} (${n})</button>`).join('')}
    </div>
    <div class="filter-bar">
      ${searchBox('inbox-search', ui.inboxSearch, 'Search tasks, projects, domains, owners…')}
      ${ui.inboxSearch? `<button class="btn btn-sm" data-action="clear-inbox-search">Clear</button>`:''}
      ${inboxDomains.length? `<button class="btn btn-sm ${ui.inboxCategories.length?'btn-primary':''}" data-action="pick-domains">${esc(pickLabel(ui.inboxCategories,'Any domain','domains'))} ▾</button>`:''}
      ${projList.length? `<button class="btn btn-sm ${ui.inboxProjects.length?'btn-primary':''}" data-action="pick-projects">${esc(pickLabel(ui.inboxProjects,'Any project','projects', id=>(byId(id)||{title:'?'}).title))} ▾</button>`:''}
      ${inboxAnyFilter()? `<button class="btn btn-sm btn-ghost" data-action="clear-inbox-filters">Clear filters</button>` : ''}
    </div>
    <div class="chip-row">
      <button class="chip ${ui.inboxDates.length?'':'on'}" data-action="inbox-date" data-date="">Any date (${dateBase.length})</button>
      ${Object.keys(INBOX_DATES).map(k=>{
        const n = dateBase.filter(INBOX_DATES[k].match).length;
        const on = ui.inboxDates.indexOf(k)>=0;
        const danger = k==='overdue' && n && !on;
        return `<button class="chip ${on?'on':''}" data-action="inbox-date" data-date="${k}"${danger?' style="color:var(--c-danger);font-weight:700"':''}>${INBOX_DATES[k].label} (${n})</button>`;
      }).join('')}
    </div>
    ${assignees.length? `<div class="chip-row">
      <button class="chip ${ui.inboxAssignees.length?'':'on'}" data-action="filter-assignee" data-assignee="">Anyone</button>
      ${assignees.map(a=>`<button class="chip ${ui.inboxAssignees.indexOf(a)>=0?'on':''}" data-action="filter-assignee" data-assignee="${esc(a)}">👤 ${esc(a)}</button>`).join('')}
    </div>` : ''}
    ${(inboxViewLen = list.length, '')}
    ${list.length? list.map((it,i)=>renderInboxRow(it,i)).join('')
      : `<div class="empty">${ui.inboxSearch? 'Nothing matches that search.'
          : inboxAnyFilter()? `Nothing matches these filters. <button class="btn btn-sm" data-action="clear-inbox-filters" style="margin-left:8px">Clear filters</button>`
          : ui.inboxScope==='unfiled'? 'Inbox zero 🎉 — nothing waiting to be triaged.'
          : 'Nothing here yet.'}</div>`}
  </div>`;
}

let inboxViewLen = 0;
function renderInboxRow(it, i){
  return `<div class="item-row" data-dnd-row>
    ${numLabel(i)}
    <button class="check ${it.status==='done'?'done':''}" data-action="complete" data-id="${it.id}">${checkSvg()}</button>
    <div class="item-main">
      <div class="item-title clickable-title" data-action="open-item" data-id="${it.id}" title="Where does this come from?">${esc(it.title)}</div>
      ${renderMeta(it)}
    </div>
    <div class="item-actions">
      ${moveTools('move-inbox', it.id, i, inboxViewLen)}
      ${pinButton(it.id)}
      <button class="btn btn-sm" data-action="convert-project" data-id="${it.id}" title="Convert to a Project">→ Project</button>
      <button class="btn btn-sm btn-ghost" data-action="open-editor" data-id="${it.id}">Edit</button>
      <button class="icon-btn btn-sm btn-danger" data-action="delete" data-id="${it.id}">✕</button>
    </div>
  </div>`;
}

/* ---------- PROCESS INBOX ---------- */
/* What is still to be decided in this pass. Skipping sets an item aside rather
   than stepping past it: the old skip advanced an index modulo the list length,
   so with one item left it landed back on the same card and looked broken, and
   with several it cycled forever and never finished. */
function triageQueue(){
  const set = new Set(ui.triageSkipped);
  return inboxItems().filter(i=>!set.has(i.id));
}
function triageCurrent(){
  const q = triageQueue();
  if(!q.length) return null;
  if(ui.triageIndex >= q.length) ui.triageIndex = 0;
  return q[ui.triageIndex];
}

function renderProcessInbox(){
  const list = triageQueue();
  if(!list.length){
    const left = ui.triageSkipped.length;
    return `<div class="view"><div class="triage-wrap"><div class="triage-card">
      <div class="triage-title">${left? 'Done for now' : 'Inbox zero 🎉'}</div>
      <div class="view-sub" style="margin-bottom:16px">${left
        ? `${left} item${left===1?'':'s'} left unfiled — ${left===1?'it stays in your Inbox as a standalone task':'they stay in your Inbox as standalone tasks'}.`
        : 'Nothing left to process.'}</div>
      <button class="btn btn-primary" data-action="exit-triage">Done</button>
    </div></div></div>`;
  }
  if(ui.triageIndex>=list.length) ui.triageIndex=0;
  const it = list[ui.triageIndex];
  const areas = state.state.lifeAreas;
  // Remember the last domain filed to — consecutive items usually belong together.
  const lastCat = areas.some(a=>a.name===ui.triageLastCat) ? ui.triageLastCat : (areas[0]&&areas[0].name);
  return `<div class="view"><div class="triage-wrap">
    <div class="triage-progress">Processing ${ui.triageIndex+1} of ${list.length}${ui.triageSkipped.length? ` · ${ui.triageSkipped.length} skipped` : ''}</div>
    <div class="triage-card">
      <div class="triage-title">${esc(it.title)}</div>
      ${areas.length? `<div class="field" style="margin:14px 0 4px;text-align:left">
        <label>Domain for this task</label>
        <select id="triage-cat" data-action-change="triage-cat-changed">${areas.map(a=>`<option value="${esc(a.name)}" ${a.name===lastCat?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
      </div>` : `<div class="view-sub" style="margin:12px 0">No life areas yet — add one under Manage domains on the Projects tab, then filing will work.</div>`}
      <div class="field" style="margin:0 0 6px;text-align:left">
        <label>Due date (optional)</label>
        <input id="triage-due" type="date" value="${esc(it.dueDate||'')}" data-action-change="triage-due-changed"/>
        <div class="view-sub" style="margin:4px 0 0">Saved as you set it. Nothing moves on until you press Keep or Skip.</div>
      </div>
      <div class="triage-actions">
        <button class="btn" data-action="triage-keep-task" ${areas.length?'':'disabled'} title="Keep this task and file it in ${esc(lastCat||'the chosen domain')}">✅ Keep</button>
        <button class="btn" data-action="triage-to-project" ${areas.length?'':'disabled'}>📁 Turn into a project</button>
        <button class="btn btn-danger" data-action="triage-delete">🗑 Delete</button>

/* ---------- PROJECTS ---------- */
/* Exactly the cards the Projects tab is showing. Rendering and reordering share it. */
function projectViewList(){
  let list = projects();
  if(!ui.showArchived) list = list.filter(p=>inactiveProjects.indexOf(p.id)===-1);
  if(ui.projectKindFilter!=='all') list = list.filter(p=>(p.kind||'project')===ui.projectKindFilter);
  if(ui.projectFilter!=='all') list = list.filter(p=>p.category===ui.projectFilter);
  if(ui.projectSearch) list = list.filter(p=>matchesSearch(p.title, ui.projectSearch)
    || matchesSearch(p.category, ui.projectSearch)
    || matchesSearch(p.assignee, ui.projectSearch)
    || (p.subtasks||[]).some(st=>matchesSearch(st.title, ui.projectSearch)));
  return list;
}

/* How many projects the Projects tab is currently showing — reorder controls
   need it to know which row is last. */
let projectViewLen = 0;
function projectViewCount(){ return projectViewLen; }

/* One-line health read on whatever slice of projects is on screen. */
function renderProjectsSummary(list){
  if(!list.length) return '';
  const port = portfolioStats(list);
  const bits = [];
  bits.push(`<b>${port.weightedPct==null?'—':port.weightedPct+'%'}</b> complete across ${port.plannedCount} measurable project${port.plannedCount===1?'':'s'}`);
  if(port.offTrack) bits.push(`<span style="color:var(--c-danger);font-weight:600">${port.offTrack} off track</span>`);
  if(port.stalledCount) bits.push(`<span style="color:var(--c-warn);font-weight:600">${port.stalledCount} stalled</span>`);
  if(port.noPlanCount) bits.push(`<span style="color:var(--c-warn);font-weight:600">${port.noPlanCount} not broken down</span>`);
  return `<div class="view-sub" style="margin:-6px 0 16px">${bits.join(' · ')} · <a href="#" data-action="open-portfolio-report" style="color:var(--c-focus);font-weight:600">full roll-up →</a></div>`;
}

/* The board. Three columns, one card per item, moved with ‹ and ›: a drag would
   be prettier and far less reliable on a phone, which is where this gets used. */
function renderBoard(p){
  const scope = (ui.boardSprint||{})[p.id] || 'all';
  const sprints = sprintsOf(p);
  const sprint = activeSprint(p);
  const all = backlogOf(p);
  const list = scope==='all' ? all             : scope==='none' ? all.filter(b=>!b.sprintId)
             : all.filter(b=>b.sprintId===scope);
  const tally = sprint ? sprintTally(p, sprint.id) : null;
  const hybrid = (p.method||'traditional')==='hybrid';
  const milestones = (p.subtasks||[]).filter(s=>s.source==='backlog');

  const card = b => `
    <div class="story">
      <div class="story-top">
        <button class="effort-chip" data-action="story-points" data-id="${p.id}" data-story="${b.id}" title="Story points — tap to step">${storyPoints(b)}</button>
        <span class="story-title ${b.status==='done'?'done':''}">${esc(b.title)}</span>
      </div>
      <div class="story-foot">
        <button class="icon-btn btn-sm" data-action="story-move" data-dir="-1" data-id="${p.id}" data-story="${b.id}" title="Move back" ${b.status==='todo'?'disabled':''}>‹</button>
        <button class="icon-btn btn-sm" data-action="story-move" data-dir="1" data-id="${p.id}" data-story="${b.id}" title="Move on" ${b.status==='done'?'disabled':''}>›</button>
        <select data-action-change="story-sprint" data-id="${p.id}" data-story="${b.id}" title="Which sprint">

        </select>
        ${hybrid && milestones.length ? `<select data-action-change="story-stage" data-id="${p.id}" data-story="${b.id}" title="Which milestone this belongs to">
          <option value="">No milestone</option>
          ${milestones.map(m=>`<option value="${esc(m.id)}" ${m.id===b.stageId?'selected':''}>${esc(m.title)}</option>`).join('')}
        </select>`:''}
        ${pinButton(storyRef(p.id, b.id))}
        <button class="icon-btn btn-sm" data-action="story-edit" data-id="${p.id}" data-story="${b.id}" title="Rename">✎</button>
        <button class="icon-btn btn-sm btn-danger" data-action="story-delete" data-id="${p.id}" data-story="${b.id}" title="Delete">✕</button>
      </div>
    </div>`;

  return `
    <div class="section-label" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <span>Sprint</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">

      </span>
    </div>
    ${sprint ? `<div class="sprint-bar">
      <div>
        <b>${esc(sprint.name)}</b>
        <span class="view-sub" style="margin:0"> · ${fmtHistoryDate(sprint.start+'T00:00:00')} to ${fmtHistoryDate(sprint.end+'T00:00:00')}</span>
        ${sprint.goal? `<div class="view-sub" style="margin:2px 0 0">🎯 ${esc(sprint.goal)}</div>`:''}
      </div>
      <div class="view-sub" style="margin:0;white-space:nowrap">${tally.done} of ${tally.total} pts · ${tally.items} item${tally.items===1?'':'s'}</div>
    </div>` : `<div class="view-sub" style="margin-bottom:10px">No sprint yet. You can work the board without one — a sprint just puts a fence and a date around a slice of it.</div>`}

    <div class="section-label" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">

          <span class="sub-title" style="${s.done?'text-decoration:line-through;color:var(--c-text-muted)':''}">${esc(s.title)}${(!s.done && s.pct)?` <span style="color:var(--c-info);font-weight:600;font-size:12px">${s.pct}%</span>`:''}</span>
          <div class="item-actions">

/* ---------- REVIEW ---------- */
function reviewPeriodKey(kind){
  if(kind==='daily')   return todayISO();
  if(kind==='monthly') return todayISO().slice(0,7);      // YYYY-MM
  return fmtISO(startOfWeek(new Date()));                  // Monday of this week
}
function reviewTicks(kind){
  const store = state.state.reviews[kind] || (state.state.reviews[kind] = {});
  const key = reviewPeriodKey(kind);
  // Only the current period is kept — a new day or week starts clean.
  if(store.key !== key){ store.key = key; store.done = {}; }
  if(!store.done) store.done = {};
  return store;
}
function renderReviewList(kind){
  const list = REVIEW_LISTS[kind];
  const store = reviewTicks(kind);
  const sections = reviewSections(kind);
  const hidden = reviewHiddenSteps(kind);
  const all = reviewSteps(kind);
  const doneCount = all.filter(x=>store.done[x.key]).length;
  const pct = all.length? Math.round(doneCount/all.length*100) : 0;
  return `<div class="card" style="margin-bottom:20px">
    <div class="rv-head">
      <div>
        <div style="font-weight:600;font-size:15px">${esc(list.label)}</div>
        <div class="view-sub" style="margin-top:2px">${esc(list.blurb)} ${esc(list.resets.charAt(0).toUpperCase()+list.resets.slice(1))}.</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="view-sub" style="margin:0;font-family:'JetBrains Mono',monospace">${doneCount}/${all.length}</span>
        ${doneCount? `<button class="btn btn-sm" data-action="review-reset" data-kind="${kind}">Reset</button>`:''}
      </div>
    </div>
    <div class="project-progress-track" style="margin-bottom:4px"><div class="project-progress-fill" style="width:${pct}%"></div></div>
    ${sections.map((sec,si)=>{
      const mine = all.filter(x=>x.si===si);
      const secDone = mine.filter(x=>store.done[x.key]).length;
      return `<div class="rv-sec">
        <span>${esc(sec.name)}</span>
        <span class="rv-sec-count">${secDone}/${mine.length}</span>
      </div>
      ${mine.map((x,ri)=>{
        const [what,why,where] = x.st;
        const on = !!store.done[x.key];
        return `<div class="rv-step ${on?'done':''}" data-dnd-row>
          <div class="box ${on?'on':''}" data-action="review-tick" data-kind="${kind}" data-key="${x.key}">${on?'✓':''}</div>
          <div class="rv-body" data-action="review-tick" data-kind="${kind}" data-key="${x.key}">
            <div class="rv-what">${esc(what)}</div>
            <div class="rv-why">${esc(why)}</div>
            <span class="rv-where">${esc(where)}</span>
          </div>
          <div class="item-actions rv-tools">
            ${sec.builtin
              ? `<button class="icon-btn btn-sm" data-action="hide-review-step" data-kind="${kind}" data-key="${x.key}" title="Hide this step — you can restore it below">✕</button>`
              : `${moveTools('move-review', x.customId, ri, mine.length, '', kind)}
                 <button class="icon-btn btn-sm" data-action="edit-review-step" data-kind="${kind}" data-id="${x.customId}" title="Edit">✎</button>
                 <button class="icon-btn btn-sm btn-danger" data-action="delete-review-step" data-kind="${kind}" data-id="${x.customId}" title="Delete">✕</button>`}
          </div>
        </div>`;
      }).join('')}`;
    }).join('')}
    <div class="rv-foot">
      <button class="btn btn-sm" data-action="add-review-step" data-kind="${kind}">+ Add your own step</button>
      ${hidden.length? `<button class="btn btn-sm btn-ghost" data-action="restore-review-steps" data-kind="${kind}">Restore ${hidden.length} hidden step${hidden.length===1?'':'s'}</button>` : ''}
    </div>
  </div>`;
}
function renderReviewView(){
  const kinds = ['daily','weekly','monthly'];
  const tab = kinds.indexOf(ui.reviewTab)>=0 ? ui.reviewTab : 'daily';
  return `<div class="view">
    <div class="view-head">
      <div><div class="view-title">Review</div><div class="view-sub">What to do when you open Second Brain, and what to do in the finance app. Ticking these earns no XP — it is a checklist, not a game.</div></div>
      ${renderTodayStamp()}
    </div>
    <div class="chip-row">
      ${kinds.map(k=>{
        const store = reviewTicks(k), all = reviewSteps(k);
        const done = all.filter(x=>store.done[x.key]).length;
        return `<button class="chip ${tab===k?'on':''}" data-action="review-tab" data-tab="${k}">${esc(REVIEW_LISTS[k].label)} (${done}/${all.length})</button>`;
      }).join('')}
    </div>
    ${renderReviewList(tab)}
    <div class="view-sub">Daily clears at midnight, weekly every Monday, monthly on the 1st. Steps are ordered highest-value first, so a review cut short loses the least. Nothing here touches your XP, level or streak.</div>
  </div>`;
}

/* ---------- LIFE BINDER ---------- */
function renderBinderView(){
  const areas = state.state.lifeAreas;
  const openAll = [];
  areas.forEach(a=>(a.open_items||[]).forEach(oi=>openAll.push({area:a.name, text:oi})));

/* ---------- REPORTS ---------- */
function completedItems(){ return items().filter(i=>i.status==='done' && i.completedAt); }

function fmtHistoryDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function inHistoryRange(it){
  const d = it.completedAt.slice(0,10);
  const today = todayISO();
  if(ui.historyRange==='month'){ const first = today.slice(0,8)+'01'; return d>=first && d<=today; }
  if(ui.historyRange==='30d'){ return d>=fmtISO(addDays(new Date(),-30)) && d<=today; }
  if(ui.historyRange==='custom'){
    if(ui.historyCustomFrom && d<ui.historyCustomFrom) return false;
    if(ui.historyCustomTo && d>ui.historyCustomTo) return false;
    return true;
  }
  return true;
}

/* Habits a consistency average should be measured over. A retired habit is one
   you deliberately stopped, so counting its 0% as a failure drags the number down
   and punishes the decision to drop it. The export already excluded retired
   habits while the views did not, so the app disagreed with itself. */
function activeHabits(){ return state.state.habits.filter(h=>h.active!==false); }

/* Consistency across an explicit window. Comparing one month with another needs
   this shape; the familiar "last 30 days" is just the window that ends today.
   A window running past today is clamped to today, so days you have not lived
   yet are never counted as days you missed. Returns null for a window that has
   not started, which reads as "—" rather than a misleading 0%. */
function habitConsistencyBetween(habit, from, to){
  const today = todayISO();
  const end = to > today ? today : to;
  if(end < from) return null;
  const span = Math.round((new Date(end+'T00:00:00') - new Date(from+'T00:00:00'))/86400000) + 1;
  const f = habit.frequency || {type:'daily'};
  if(f.type==='weekly' || f.type==='monthly'){
    const target = f.target||1;
    let done=0, cursor=new Date(end+'T00:00:00');
    for(let i=0;i<span;i++){ if(habit.log[fmtISO(cursor)]) done++; cursor=addDays(cursor,-1); }
    const expected = target * (span / (f.type==='monthly' ? 30.44 : 7));
    return expected>0 ? Math.min(100, Math.round(done/expected*100)) : 0;
  }
  let done=0, required=0, cursor=new Date(end+'T00:00:00');
  for(let i=0;i<span;i++){
    const key=fmtISO(cursor);
    if(isHabitRequiredOn(habit,key)){ required++; if(habit.log[key]) done++; }
    cursor=addDays(cursor,-1);
  }
  return required? Math.round(done/required*100) : 0;
}

function habitConsistency(habit, days){
  days = days||30;
  const pct = habitConsistencyBetween(habit, fmtISO(addDays(new Date(), -(days-1))), todayISO());
  return pct===null ? 0 : pct;
}

/* =========================================================
   Charts (Chart.js) — canvases are rebuilt on every render()
   ========================================================= */
let charts = {};
function destroyCharts(){
  Object.values(charts).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  charts = {};
}
/* =========================================================
   Chart colour and part-to-whole

   Series colours are a fixed order, not a hash: slot 1 is always the same hue,
   so a filter that drops a series never repaints the survivors. The two columns
   are the same eight hues stepped for each surface, and both were checked for
   colour-blind separation rather than eyeballed — worst adjacent pair ΔE 9.1
   light, 8.4 dark, against a floor of 8.

   Light mode's lighter hues fall under 3:1 against the page, which is why every
   doughnut here carries a written legend with its numbers: the colour is never
   the only thing saying which slice is which.
   ========================================================= */
const SERIES_LIGHT = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'];
const SERIES_DARK  = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
const SERIES_REST  = '#94A3B8';
const DONUT_CAP = 6;   // past six slices the eye gives up; the tail folds into one
function seriesColors(){ return themeMode()==='dark' ? SERIES_DARK : SERIES_LIGHT; }

/* Biggest first, with everything past the cap folded into one honest slice. */
function donutSlices(pairs, cap){
  const kept = pairs.filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
  const max = cap || DONUT_CAP;
  if(kept.length <= max) return kept;
  const head = kept.slice(0, max-1);
  const tail = kept.slice(max-1);
  head.push({ label:`Everything else (${tail.length})`, value: tail.reduce((a,x)=>a+x.value,0), rest:true });
  return head;
}

/* A doughnut plus the numbers it is made of.

   Drawn as inline SVG rather than through Chart.js, on purpose. Chart.js comes
   from a CDN, and on a phone on mobile data in Addis that script is the single
   most likely thing in this page to fail — when it did, every pie quietly became
   a list of numbers with no picture, which is exactly how this was reported.
   A ring of arcs needs no library, no network and no canvas, so it is always
   there. Each slice is a dash on one circle: with r = 15.915 the circumference
   is 100, so a percentage is its own dash length.

   The legend is not decoration either. In light mode the lighter slice colours
   fall under 3:1 against the page, so the written numbers beside them are what
   make the chart readable rather than decorative. */
const DONUT_GAP = 0.8;   // a sliver of surface between slices, so they read as separate

function donutCard(id, pairs, opts){
  opts = opts || {};
  const slices = donutSlices(pairs, opts.cap);
  const total = slices.reduce((a,x)=>a+x.value, 0);
  if(!total) return opts.empty ? `<div class="view-sub" style="margin-bottom:16px">${opts.empty}</div>` : '';
  const cols = seriesColors();
  // A slice may carry its own colour (health verdicts have fixed ones). Anything
  // else takes the next series slot — by its place in the sorted list, so the
  // biggest slice is always slot 1 rather than whatever the data order happened to be.
  const colorOf = (x,i) => x.rest ? SERIES_REST : (x.color || cols[i % cols.length]);

  let at = 0;
  const arcs = slices.map((x,i)=>{
    const share = x.value/total*100;
    // One slice is a whole ring: a gap would leave a notch in a circle with no seam.
    const len = slices.length===1 ? 100 : Math.max(0.6, share - DONUT_GAP);
    const dash = `${len} ${100-len}`;
    const offset = 25 - at;           // 25 puts the first slice's edge at twelve o'clock
    at += share;
    return `<circle class="donut-arc" cx="21" cy="21" r="15.915" fill="none"
      stroke="${colorOf(x,i)}" stroke-width="5.5" stroke-dasharray="${dash}" stroke-dashoffset="${offset}">
      <title>${esc(x.label)}: ${esc(String(opts.fmt? opts.fmt(x.value) : x.value))} (${Math.round(share)}%)</title>
    </circle>`;
  }).join('');

  return `
    <div class="card donut-card" style="margin-bottom:18px">
      ${opts.title? `<div style="font-weight:600;font-size:14.5px;margin-bottom:2px">${opts.title}</div>`:''}
      ${opts.sub? `<div class="view-sub" style="margin-bottom:12px">${opts.sub}</div>`:''}
      <div class="donut-wrap">
        <div class="donut-canvas">
          <svg viewBox="0 0 42 42" class="donut-svg" role="img" aria-label="${esc(opts.title||'Breakdown')}">
            <circle cx="21" cy="21" r="15.915" fill="none" stroke="var(--c-surface-alt)" stroke-width="5.5"/>
            ${arcs}
          </svg>
          <div class="donut-middle">
            <div class="donut-total">${opts.fmt? opts.fmt(total) : total}</div>
            <div class="donut-cap">in all</div>
          </div>
        </div>
        <ul class="legend">
          ${slices.map((x,i)=>`<li>
            <i style="background:${colorOf(x,i)}"></i>
            <span class="legend-name">${esc(x.label)}</span>
            <b>${opts.fmt? opts.fmt(x.value) : x.value}<span class="legend-share"> · ${Math.round(x.value/total*100)}%</span></b>
          </li>`).join('')}
        </ul>
      </div>
    </div>`;
}

function chartTextColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--c-text-secondary')||'').trim() || '#475569'; }
function chartGridColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--c-border')||'').trim() || '#E2E8F0'; }
function barChartOptions(horizontal){
  const tc = chartTextColor(), gc = chartGridColor();
  const valueAxis = { min:0, max:100, ticks:{ color:tc }, grid:{ color:gc } };
  const countAxis = { beginAtZero:true, ticks:{ color:tc, precision:0 }, grid:{ color:gc } };
  const labelAxis = { ticks:{ color:tc }, grid:{ display:false } };
  return {
    indexAxis: horizontal? 'y':'x',
    responsive:true, maintainAspectRatio:false,
    scales: horizontal? { x:valueAxis, y:labelAxis } : { y:countAxis, x:labelAxis },
    plugins:{ legend:{ display:false } }
  };
}
function areaTaskPct(a){
  const areaItems = items().filter(i=>i.category===a.name && (i.type==='task'||i.type==='project'));
  const done = areaItems.filter(i=>i.status==='done').length;
  return areaItems.length? Math.round(done/areaItems.length*100) : 0;
}
function projectPct(p){ const st = projectStats(p); return st.pct==null ? 0 : st.pct; }
const HEALTH_BAR_COLOR = { done:'#10B981', ahead:'#10B981', ontrack:'#06B6D4', nodate:'#94A3B8', notstarted:'#94A3B8', risk:'#F59E0B', behind:'#F43F5E', overdue:'#F43F5E', noplan:'#CBD5E1' };
/* Chart.js comes from a CDN — render no card at all rather than an empty box when it is unavailable. */
function chartsAvailable(){ return typeof Chart!=='undefined'; }
/* A graph that cannot be drawn should say so once, not vanish. Chart.js comes
   from a CDN; when that fails every line and bar silently disappeared and the
   page just looked thinner. The doughnuts no longer depend on it at all. */
let chartNoteShown = false;
function chartMissingNote(){
  if(!chartsAvailable() && !chartNoteShown){
    chartNoteShown = true;
    return `<div class="view-sub" style="margin-bottom:14px">The graph library did not load on this device, so the line and bar charts are not drawn. Every figure they would show is in the numbers and tables on this page. It is fetched from the internet — a reload on a better connection usually brings it back.</div>`;
  }
  return '';
}
function chartCard(id, height, extraStyle){
  if(!chartsAvailable()) return chartMissingNote();
  return `<div class="card" style="margin-bottom:18px;height:${height}px${extraStyle?';'+extraStyle:''}"><canvas id="${id}"></canvas></div>`;
}

    charts.dashboardActions = new Chart(dashboardActionsCanvas,{type:'doughnut',data:{labels:counts.map(x=>x.label),datasets:[{data:counts.map(x=>x.count),backgroundColor:['#F43F5E','#0EA5E9','#F59E0B','#94A3B8'],borderColor:getComputedStyle(document.documentElement).getPropertyValue('--c-surface').trim()||'#FFFFFF',borderWidth:3,hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{position:'bottom',labels:{color:getComputedStyle(document.documentElement).getPropertyValue('--c-text-secondary').trim()||'#475569',usePointStyle:true,pointStyle:'circle',padding:14}}}}});
  }
  const areasCanvas = document.getElementById('chart-areas');
  if(areasCanvas){
    const areas = state.state.lifeAreas;
    charts.areas = new Chart(areasCanvas, { type:'bar',
      data:{ labels: areas.map(a=>a.name), datasets:[{ data: areas.map(areaTaskPct), backgroundColor:'#6366F1', borderRadius:4 }] },
      options: barChartOptions(true)
    });

  const projCanvas = document.getElementById('chart-projects');
  if(projCanvas){
    const rows = reportProjectRows().filter(r=>r.st.hasPlan);

      data:{ labels: rows.map(r=>r.p.title), datasets:[
        { label:'Complete', data: rows.map(r=>r.st.pct), backgroundColor: rows.map(r=>HEALTH_BAR_COLOR[r.st.health]||'#06B6D4'), borderRadius:4 },
        { label:'Schedule spent', data: rows.map(r=>r.st.timePct==null?null:Math.round(r.st.timePct)), backgroundColor:'transparent',
          borderColor:'#64748B', borderWidth:{top:0,right:2,bottom:0,left:0}, borderRadius:0, barPercentage:.62, grouped:false }
      ] },
      options: Object.assign(barChartOptions(true), { plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ label:(c)=> c.raw==null ? '' : `${c.dataset.label}: ${c.raw}%` } } } })
    });
  }

  const portCanvas = document.getElementById('chart-portfolio');
  if(portCanvas){

    const measurable = portfolioStats(reportProjectList()).byArea.filter(a=>a.pct!=null);
    charts.portfolio = new Chart(portCanvas, { type:'bar',

      options: barChartOptions(true)
    });

  const timelineCanvas = document.getElementById('chart-timeline');
  if(timelineCanvas){
    const byDay = {};

      data:{ labels: days.map(d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})), datasets:[{ data: days.map(d=>byDay[d]), backgroundColor:'#10B981', borderRadius:4 }] },
      options: barChartOptions(false)
    });
  }
}

function fmtWeekLabel(weekOffset){
  const start = startOfWeek(addDays(new Date(), -7*weekOffset));
  const end = addDays(start,6);
  const opts = {month:'short',day:'numeric'};
  const label = start.toLocaleDateString(undefined,opts)+' – '+end.toLocaleDateString(undefined,opts);
  return weekOffset===0 ? `This week (${label})` : label;
}

/* ---------- RECURRING ---------- */

   live in the Inbox; this tab is the place to see and change the cadence itself. */
function renderRecurringView(){
  const all = recurrences();

             : f==='tasks'  ? all.filter(r=>!r.isChore)

  const chip = (k,label,n)=>`<button class="chip ${f===k?'on':''}" data-action="recurring-filter" data-f="${k}">${label} (${n})</button>`;

  return `<div class="view">

    ${all.length? `<div class="chip-row">
      ${chip('all','All',all.length)}
      ${chip('tasks','Tasks',all.filter(r=>!r.isChore).length)}
      ${chip('chores','Chores',all.filter(r=>r.isChore).length)}

/* =========================================================
   Reports > Compare — two periods, side by side
   One granularity and two offsets, so "this month against last month" and
   "2026 against 2025" are the same screen rather than two features.
   ========================================================= */
function compareDelta(a, b, suffix){
  if(a===null || b===null) return `<td class="num" style="color:var(--c-text-muted)">—</td>`;
  const d = b - a;
  if(!d) return `<td class="num" style="color:var(--c-text-muted)">same</td>`;
  const col = d>0 ? 'var(--c-good)' : 'var(--c-danger)';
  return `<td class="num" style="color:${col};font-weight:700">${d>0?'+':'−'}${Math.abs(d)}${suffix||''}</td>`;
}
function compareRow(label, a, b, suffix){
  const cell = v => v===null ? '—' : v + (suffix||'');
  return `<tr><td>${label}</td><td class="num">${cell(a)}</td><td class="num">${cell(b)}</td>${compareDelta(a,b,suffix)}</tr>`;
}

/* =========================================================
   Reports > Wins — what you finished

   Everything else in Reports is about what is not done yet: what is late, what
   is at risk, what is left. Finished projects fell straight off the end of it —
   closed, and then invisible. This is the other half of the record, and it is
   deliberately written as a win rather than as a row in a log.
   ========================================================= */
function winsData(rangeKey){
  const r = BRAG_RANGES[rangeKey] || BRAG_RANGES.year;
  const from = r.from(), to = todayISO();
  const inRange = d => !!d && d.slice(0,10) >= from && d.slice(0,10) <= to;

  const delivered = reportProjectList()
    .filter(p=>p.status==='done' && inRange(p.completedAt))
    .sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt)))
    .map(p=>{
      const closed = (p.subtasks||[]).filter(sx=>sx.done);
      const effort = closed.reduce((a,sx)=>a+effortWeight(sx), 0)
                   + tasksOf(p.id).filter(t=>t.status==='done').reduce((a,t)=>a+effortWeight(t), 0);
      const startMs = projectStartMs(p);
      const endMs = Date.parse(p.completedAt) || Date.now();
      return { p, steps: closed.length, effort, days: Math.max(1, dayDiff(startMs, endMs)),
               onTime: p.dueDate ? (p.completedAt.slice(0,10) <= p.dueDate) : null,
               underBudget: (p.budget!=null && p.actualCost!=null) ? p.actualCost <= p.budget : null,
               risksClosed: (p.risks||[]).filter(x=>x.status==='closed').length };
    });

  // Milestones closed on projects still running — a quarter with no delivery is
  // not a quarter with nothing to show.
  const advanced = [];
  projects().filter(p=>p.status!=='done' && !isContainerKind(p)).forEach(p=>{
    const closed = (p.subtasks||[]).filter(sx=>sx.done && inRange(sx.doneAt));
    if(closed.length) advanced.push({ p, closed,
      effort: closed.reduce((a,sx)=>a+effortWeight(sx), 0) });
  });
  advanced.sort((a,b)=>b.effort-a.effort);

  const tasksDone = completedItems().filter(i=>i.type==='task' && inRange(i.completedAt));
  const byArea = {};
  delivered.forEach(w=>{ byArea[w.p.category] = (byArea[w.p.category]||0) + 1; });

  return { from, to, label:r.label, delivered, advanced, tasksDone,
    steps: delivered.reduce((a,w)=>a+w.steps,0) + advanced.reduce((a,x)=>a+x.closed.length,0),
    effort: delivered.reduce((a,w)=>a+w.effort,0) + advanced.reduce((a,x)=>a+x.effort,0),
    byArea: Object.keys(byArea).map(k=>({ label:k, value:byArea[k] })) };
}

/* Deliveries per month for the last year: the shape of a run of finished work. */
function winsByMonth(){
  const out = [];
  const now = new Date();
  for(let i=11;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = fmtISO(d).slice(0,7);
    out.push({ key, label: d.toLocaleDateString(undefined,{month:'short'}),
      n: projects().filter(p=>p.status==='done' && (p.completedAt||'').slice(0,7)===key).length });
  }
  return out;
}

  return `

function renderReportsPortfolioView(){
  const all = reportProjectList();
  const leaves = all.filter(p=>!isContainerKind(p) && p.status!=='done');
  const roots = portfolioRoots();
  const count = k => all.filter(p=>(p.kind||'project')===k).length;
  const budget = leaves.reduce((a,p)=>a+(p.budget||0), 0);
  const spent  = leaves.reduce((a,p)=>a+(p.actualCost||0), 0);
  const earned = leaves.reduce((a,p)=>{ const st=projectStats(p); return a+(st.earned||0); }, 0);
  const cpi = (spent>0 && budget>0) ? earned/spent : null;
  const risks = all.reduce((a,p)=>a+liveRisks(p).length, 0);
  const worstRisk = all.reduce((a,p)=>Math.max(a, topRisk(p)), 0);
  const c = currency();

  return `
    <div class="rollup-grid" style="margin-bottom:14px">
      <div class="rollup-tile"><div class="v">${count('portfolio')}</div><div class="k">Portfolios</div></div>
      <div class="rollup-tile"><div class="v">${count('program')}</div><div class="k">Programmes</div></div>
      <div class="rollup-tile"><div class="v">${count('project')}</div><div class="k">Projects</div></div>
      <div class="rollup-tile"><div class="v" style="${worstRisk>=15?'color:var(--c-danger)':worstRisk>=10?'color:var(--c-warn)':''}">${risks}</div><div class="k">Open risks</div></div>
    </div>
    ${budget? `<div class="rollup-grid" style="margin-bottom:14px">
      <div class="rollup-tile"><div class="v">${money(budget)}</div><div class="k">Budget${c?' ('+esc(c)+')':''}</div></div>
      <div class="rollup-tile"><div class="v">${money(spent)}</div><div class="k">Spent</div></div>
      <div class="rollup-tile"><div class="v">${money(Math.round(earned))}</div><div class="k">Value earned</div></div>
      <div class="rollup-tile"><div class="v" style="${cpi!=null&&cpi<0.95?'color:var(--c-danger);font-weight:700':''}">${cpi==null?'—':cpi.toFixed(2)}</div><div class="k">Cost index</div></div>
    </div>` : ''}

    ${donutCard('donut-portfolio-budget', roots.map(p=>({ label:p.title, value: Math.round(projectStats(p).budget||0) })), {
      title:'Where the money is committed',
      sub:'Budget by top-level item, with everything under it included.',
      empty:'No budgets set yet. Edit a project and give it a budget to see this.',
      fmt: n=>withCurrency(n) })}

    <div class="section-label">The tree</div>
    <div class="card" style="margin-bottom:18px;padding:8px 14px 14px">
      ${roots.length ? roots.map(p=>renderTreeRow(p, 0, null)).join('')
        : '<div class="view-sub" style="padding:14px 0">Nothing here yet. Make a portfolio or a programme, then edit a project and set what it sits under.</div>'}
    </div>
    <div class="view-sub">A programme or portfolio has no plan of its own: its completion, effort and budget are whatever sits under it, each by its weight among its siblings. One red project makes the programme above it red — that is the point of looking here.</div>
  `;
}

function renderReportsCompareView(){
  const gran = PERIODS[ui.compareGran] ? ui.compareGran : 'month';
  const doms = compareDomains();
  const domain = doms.indexOf(ui.compareDomain)>=0 ? ui.compareDomain : 'all';
  const base = periodWindow(gran, ui.compareBase);
  const vs   = periodWindow(gran, ui.compareVs);
  const A = periodStats(base.from, base.to, domain);
  const B = periodStats(vs.from, vs.to, domain);
  const hA = periodHabits(base.from, base.to, domain);
  const hB = periodHabits(vs.from, vs.to, domain);
  const avgA = periodHabitAvg(hA), avgB = periodHabitAvg(hB);

  const periodOptions = chosen => {
    let out = '';
    for(let o=0; o > -PERIODS[gran].back; o--){
      const w = periodWindow(gran, o), rel = periodRel(gran, o);
      out += `<option value="${o}" ${Number(chosen)===o?'selected':''}>${esc(w.label)}${rel?` (${rel})`:''}</option>`;
    }
    return out;
  };
  const sel = 'font-size:13px;padding:7px 9px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text)';

  const dp = B.points - A.points;
  const nothing = !A.points && !B.points && !A.projectsDone.length && !B.projectsDone.length
                  && !A.tasksDone.length && !B.tasksDone.length;
  const headline = base.from===vs.from ? 'Same period on both sides — pick two different ones to see a change.'
    : nothing ? `Nothing was closed in ${esc(base.label)} or ${esc(vs.label)}${domain==='all'?'':' for '+esc(domain)}.`
    : dp>0 ? `<b>${esc(vs.label)}</b> is ahead of ${esc(base.label)} by ${dp} effort point${dp===1?'':'s'}.`
    : dp<0 ? `<b>${esc(vs.label)}</b> is behind ${esc(base.label)} by ${-dp} effort point${dp===-1?'':'s'}.`
    : `Both periods closed the same ${B.points} effort point${B.points===1?'':'s'}.`;
  const running = [A.running ? `${esc(base.label)} is still running (${A.daysElapsed} of ${A.daysTotal} days)` : '',
                   B.running ? `${esc(vs.label)} is still running (${B.daysElapsed} of ${B.daysTotal} days)` : '']
                  .filter(Boolean).join(' · ');

  // Life areas that appear on either side, ordered by the later period's effort.
  const areaNames = Array.from(new Set(A.byArea.map(x=>x.area).concat(B.byArea.map(x=>x.area))));
  const pick = (stats, name) => stats.byArea.find(x=>x.area===name) || {projects:0,milestones:0,tasks:0,points:0};
  const areaRows = areaNames.map(n=>({ name:n, a:pick(A,n), b:pick(B,n) }))
                            .sort((x,y)=>(y.b.points-x.b.points) || (y.a.points-x.a.points));

  // Habits tracked in either period, so a habit started midway still shows up.
  const habitIds = Array.from(new Set(hA.map(x=>x.habit.id).concat(hB.map(x=>x.habit.id))));
  const habitRows = habitIds.map(id=>{
    const a = hA.find(x=>x.habit.id===id), b = hB.find(x=>x.habit.id===id);
    return { habit: (b||a).habit, a: a? a.pct : null, b: b? b.pct : null };
  });

  return `
    <div class="card" style="margin-bottom:18px;padding:16px 18px">
      <div style="font-weight:600;font-size:14.5px;margin-bottom:2px">Compare two periods</div>
      <div class="view-sub" style="margin-bottom:12px">Put one week, month or year next to another and see what actually changed.</div>
      <div class="chip-row" style="margin-bottom:10px">
        ${Object.keys(PERIODS).map(k=>`<button class="chip ${gran===k?'on':''}" data-action="compare-gran" data-gran="${k}">${PERIODS[k].label}</button>`).join('')}
      </div>
      <div class="filter-bar cmp-bar" style="margin-bottom:0">
        <span class="view-sub cmp-word" style="margin:0;align-self:center">Compare</span>
        <select data-action-change="compare-base" style="${sel}">${periodOptions(ui.compareBase)}</select>
        <span class="view-sub cmp-word" style="margin:0;align-self:center">with</span>
        <select data-action-change="compare-vs" style="${sel}">${periodOptions(ui.compareVs)}</select>
        <select class="cmp-domain" data-action-change="compare-domain" style="${sel}">
          <option value="all" ${domain==='all'?'selected':''}>All areas</option>
          ${doms.map(n=>`<option value="${esc(n)}" ${domain===n?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="view-sub" style="margin:-4px 0 12px;font-size:14px;color:var(--c-text-secondary)">${headline}</div>
    ${running? `<div class="view-sub" style="margin:-6px 0 12px">${running} — a part-finished period will always look smaller.</div>` : ''}

    <div class="card" style="margin-bottom:20px;padding:14px 16px">
      <div class="mini-table-wrap">
      <table class="mini-table">
        <thead><tr><th>What closed</th><th class="num">${esc(base.label)}</th><th class="num">${esc(vs.label)}</th><th class="num">Change</th></tr></thead>
        <tbody>
          ${compareRow('Projects completed', A.projectsDone.length, B.projectsDone.length)}
          ${compareRow('Projects moved forward', A.advanced.length, B.advanced.length)}
          ${compareRow('Milestones closed', A.milestoneCount, B.milestoneCount)}
          ${compareRow('Tasks closed', A.tasksDone.length, B.tasksDone.length)}
          ${compareRow('— of those, recurring', A.recurring.length, B.recurring.length)}
          ${compareRow('Effort points', A.points, B.points)}
          ${compareRow('Habit consistency', avgA, avgB, '%')}
        </tbody>
      </table>
      </div>
      <div class="view-sub" style="margin:8px 0 0">Effort sizes: S=1, M=2, L=3, XL=5. Habit consistency averages the active habits${domain==='all'?'':' in this area'}, each measured against its own schedule inside the period.</div>
    </div>

    ${donutCard('donut-compare', B.byArea.map(a=>({ label:a.area, value:a.points })), {
      title:`What ${esc(vs.label)} went on`,
      sub:'Effort points closed in the later period, by life area.',
      empty:'Nothing closed in the later period yet.',
      fmt: n=>n+' pts' })}

    ${domain==='all' && areaRows.length? `
      <div class="section-label">By life area</div>
      <div class="card" style="margin-bottom:20px;padding:14px 16px">
        <div class="mini-table-wrap">
        <table class="mini-table">
          <thead><tr><th>Life area</th><th class="num">${esc(base.label)}</th><th class="num">${esc(vs.label)}</th><th class="num">Change</th></tr></thead>
          <tbody>
            ${areaRows.map(r=>`<tr>
              <td><span class="chip" style="${catStyle(r.name)}">${esc(r.name)}</span></td>
              <td class="num">${r.a.points}</td>
              <td class="num">${r.b.points}</td>
              ${compareDelta(r.a.points, r.b.points)}
            </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="view-sub" style="margin:8px 0 0">Effort points closed in each area — where your time actually went.</div>
      </div>` : ''}

    ${habitRows.length? `
      <div class="section-label">Habits</div>
      <div class="card" style="margin-bottom:20px;padding:14px 16px">
        <div class="mini-table-wrap">
        <table class="mini-table">
          <thead><tr><th>Habit</th><th class="num">${esc(base.label)}</th><th class="num">${esc(vs.label)}</th><th class="num">Change</th></tr></thead>
          <tbody>
            ${habitRows.map(r=>`<tr>
              <td>${esc(r.habit.emoji||'')} ${esc(r.habit.name)}</td>
              <td class="num">${r.a===null?'—':r.a+'%'}</td>
              <td class="num">${r.b===null?'—':r.b+'%'}</td>
              ${compareDelta(r.a, r.b, '%')}
            </tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>` : ''}
  `;
}

function renderFollowupsView(){
  const list = followups();
  // People carrying open work who are not being tracked — the gap worth closing.
  const untracked = Array.from(new Set(items()
    .filter(i=>i.assignee && ((i.type==='task' && i.status==='open') || i.type==='project'))
    .map(i=>i.assignee)))
    .filter(n=>!followupFor(n) && worksForPerson(n)>0)
    .sort((a,b)=>a.localeCompare(b));
  return `<div class="view">
    <div class="view-head">
      <div><div class="view-title">Follow-ups</div><div class="view-sub">People to check back in with, and what each of them owes you.</div></div>
      <button class="btn btn-primary" data-action="new-followup">+ Add contact</button>
    </div>
    ${list.length? list.map(renderFollowupRow).join('') : `<div class="empty">No follow-ups tracked yet. Add anyone you have to chase — a site engineer, a counterpart, the family businesses.</div>`}
    ${untracked.length? `
      <div class="section-label" style="margin-top:24px">Assigned work, nobody tracked</div>
      <div class="view-sub" style="margin-bottom:10px">These people own open tasks but have no follow-up, so nothing reminds you to chase them.</div>
      <div class="chip-row">
        ${untracked.map(n=>`<button class="chip" data-action="track-person" data-person="${esc(n)}" title="Start tracking ${esc(n)}">＋ ${esc(n)} (${worksForPerson(n)})</button>`).join('')}
      </div>` : ''}
  </div>`;
}
function renderFollowupRow(it){
  const person = it.contactName || it.title;
  const days = it.lastContactDate ? Math.round((new Date(todayISO())-new Date(it.lastContactDate))/86400000) : null;
  const open = tasksForPerson(person);
  const owned = projectsForPerson(person);
  const overdue = open.filter(t=>isOverdue(t)).length;
  return `<div class="item-row" data-dnd-row>
    <div class="item-main">
      <div class="item-title">${esc(person)}</div>
      <div class="item-meta">
        <span class="chip" style="${catStyle(it.category)}">${esc(it.category)}</span>
        ${days!=null? `<span>Last contact ${days===0?'today':days+'d ago'}</span>` : '<span style="color:var(--c-warn);font-weight:600">No contact logged</span>'}
        ${it.dueDate? `<span style="${isOverdue(it)?'color:var(--c-danger);font-weight:700':''}">Next by ${fmtDue(it.dueDate)}</span>`:''}
        ${open.length
          ? `<button class="parent-chip" data-action="view-person-tasks" data-person="${esc(person)}" title="Show these in the Inbox">📥 ${open.length} open task${open.length===1?'':'s'}${overdue?` · ${overdue} overdue`:''}</button>` : ''}
        ${owned.length
          ? `<button class="parent-chip" data-action="view-person-projects" data-person="${esc(person)}" title="Show these in Projects">📁 ${owned.length} project${owned.length===1?'':'s'}</button>` : ''}
        ${!open.length && !owned.length ? '<span style="color:var(--c-text-muted)">nothing assigned</span>' : ''}
      </div>
    </div>
    <div class="item-actions">
      <button class="btn btn-sm" data-action="add-followup-task" data-id="${it.id}" title="Create a task in the Inbox, assigned to ${esc(person)}">+ Task</button>
      <button class="btn btn-sm" data-action="log-contact" data-id="${it.id}">Log contact today</button>
      <button class="icon-btn btn-sm" data-action="edit-followup" data-id="${it.id}" title="Edit">✎</button>
      <button class="icon-btn btn-sm btn-danger" data-action="delete" data-id="${it.id}">✕</button>
    </div>
  </div>`;
}

    <div class="project-head" data-action="open-project-report" data-id="${r.p.id}">

    <div class="view-sub" style="margin-bottom:14px">${esc(d.blurb(port))}</div>

function newRecurrenceDraft(){
  return { id:null, title:'', type:'weekly', interval:1, days:[dowIndex(new Date())],
    dayOfMonth:new Date().getDate(), month:new Date().getMonth(), anchor:todayISO(),
    category:'Inbox', priority:'medium', effort:DEFAULT_EFFORT, assignee:null, isChore:false };
}
function readRecurrenceForm(){
  const type = qs('#rc-type').value;
  const days = qsa('[data-action="toggle-rc-day"].on').map(b=>+b.getAttribute('data-day'));
  return {
    title: (qs('#rc-title').value||'').trim(),
    category: qs('#rc-cat').value,
    type: RECUR_TYPES[type] ? type : 'weekly',
    interval: Math.max(1, Math.min(60, parseInt(qs('#rc-interval').value,10)||1)),
    days: days.length ? days : [dowIndex(new Date())],
    month: Math.max(0, Math.min(11, parseInt(qs('#rc-month').value,10)||0)),
    dayOfMonth: Math.max(1, Math.min(31, parseInt(qs('#rc-dom').value,10)||1)),
    anchor: qs('#rc-anchor').value || todayISO(),
    assignee: (qs('#rc-assignee').value||'').trim() || null,
    priority: qs('#rc-pri').value,
    effort: qs('#rc-effort').value,
    isChore: !!qs('#rc-chore').checked
  };
}

  return `

      </select>
    </div>
    <div class="field" id="hb-freq-days-wrap" style="${freq.type==='days'?'':'display:none'}">
      <label>Days</label>
      <div class="chip-row" style="margin-bottom:0">
        ${DAY_LABELS.map((lbl,i)=>`<button type="button" class="chip ${days.includes(i)?'on':''}" data-action="toggle-hb-day" data-day="${i}">${lbl}</button>`).join('')}
      </div>
    </div>
    <div class="field" id="hb-freq-target-wrap" style="${freq.type==='weekly'||freq.type==='monthly'?'':'display:none'}">
      <label id="hb-freq-target-label">Times per ${freq.type==='monthly'?'month':'week'}</label>
      <input id="hb-freq-target" type="number" min="1" max="${freq.type==='monthly'?31:7}" value="${target}"/>
    </div>`;
}
function readHabitFrequencyFromForm(){
  const type = qs('#hb-freq-type').value;
  if(type==='days'){
    const days = qsa('[data-action="toggle-hb-day"].on').map(b=>+b.getAttribute('data-day'));
    return {type:'days', days: days.length?days:[0,1,2,3,4,5,6]};
  }
  if(type==='weekly' || type==='monthly'){
    const cap = type==='monthly' ? 31 : 7;
    const target = Math.max(1, Math.min(cap, parseInt(qs('#hb-freq-target').value,10) || (type==='monthly'?1:3)));
    return {type, target};
  }
  return {type:'daily'};
}

          .map(p=>[p.id, p.title, inboxScoped().filter(i=>i.projectId===p.id).length])

  openModal(`

function renameLifeArea(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return false;
  if(state.state.lifeAreas.some(a=>a.name===newName)) return false;
  const a = state.state.lifeAreas.find(x=>x.name===oldName);
  if(!a) return false;
  a.name = newName;
  items().forEach(i=>{ if(i.category===oldName) i.category = newName; });
  state.state.habits.forEach(h=>{ if(h.category===oldName) h.category = newName; });
  if(ui.projectFilter===oldName) ui.projectFilter = newName;
  return true;
}
function mergeLifeArea(fromName, intoName){
  if(!fromName || !intoName || fromName===intoName) return false;
  if(!state.state.lifeAreas.some(a=>a.name===intoName)) return false;
  items().forEach(i=>{ if(i.category===fromName) i.category = intoName; });
  state.state.habits.forEach(h=>{ if(h.category===fromName) h.category = intoName; });
  const idx = state.state.lifeAreas.findIndex(a=>a.name===fromName);
  if(idx>=0) state.state.lifeAreas.splice(idx,1);
  if(ui.projectFilter===fromName) ui.projectFilter = intoName;
  return true;
}

/* What an agile project has instead of a milestone list, plus the two charts a

function agilePanel(p){
  const method = p.method || 'traditional';
  if(method==='traditional') return '';
  const all = backlogOf(p);
  const sprint = activeSprint(p);
  const vel = velocity(p);
  const avg = vel.length ? Math.round(vel.reduce((a,x)=>a+x.done,0)/vel.length) : null;
  const tally = sprint ? sprintTally(p, sprint.id) : null;
  const byState = k => all.filter(b=>b.status===k);
  return `
    <div class="section-label">Backlog</div>
    ${all.length ? `
      <div class="rollup-grid" style="margin-bottom:10px">
        <div class="rollup-tile"><div class="v">${Math.round(backlogProgress(all))}%</div><div class="k">Backlog done</div></div>
        <div class="rollup-tile"><div class="v">${all.reduce((a,b)=>a+storyPoints(b),0)}</div><div class="k">Points in all</div></div>
        <div class="rollup-tile"><div class="v">${byState('doing').length}</div><div class="k">In progress</div></div>
        <div class="rollup-tile"><div class="v">${avg==null?'—':avg}</div><div class="k">Average velocity</div></div>
      </div>
      ${sprint? `<div class="view-sub" style="margin-bottom:12px"><b>${esc(sprint.name)}</b> — ${tally.done} of ${tally.total} points, ${fmtHistoryDate(sprint.start+'T00:00:00')} to ${fmtHistoryDate(sprint.end+'T00:00:00')}.${sprint.goal?` Goal: ${esc(sprint.goal)}.`:''}</div>`:''}
      ${(chartsAvailable() && sprint && sprintTally(p, sprint.id).total) ? `<div class="section-label">Burndown — ${esc(sprint.name)}</div>
        <div style="height:150px;margin-bottom:6px"><canvas id="chart-burndown"></canvas></div>
        <div class="view-sub" style="margin-bottom:14px">Points left each day against the straight line from full to empty. Above the line is behind.</div>`:''}
      ${(chartsAvailable() && vel.length>1) ? `<div class="section-label">Velocity</div>
        <div style="height:130px;margin-bottom:6px"><canvas id="chart-velocity"></canvas></div>
        <div class="view-sub" style="margin-bottom:14px">Points finished per sprint. What you actually get through, which is what the next sprint should be planned against.</div>`:''}
      <ul style="margin:0 0 14px;padding:0;list-style:none">
        ${all.slice().sort((a,b)=>Object.keys(STORY_STATES).indexOf(a.status)-Object.keys(STORY_STATES).indexOf(b.status)).map(b=>`

}

/* Probability against impact, five by five, with the live entries placed on it.
   A table rather than a picture, so it reads the same on a phone. */
function riskHeatMap(list){
  const cells = {};
  list.forEach(r=>{ const k=r.probability+'x'+r.impact; (cells[k]=cells[k]||[]).push(r); });
  const tone = sc => sc>=15 ? 'var(--c-danger)' : sc>=10 ? 'var(--c-warn)' : sc>=5 ? 'var(--c-info)' : 'var(--c-good)';
  let rows = '';
  for(let pr=5; pr>=1; pr--){
    rows += `<tr><th class="heat-axis">${RAID_SCALE[pr]}</th>` + [1,2,3,4,5].map(im=>{
      const here = cells[pr+'x'+im]||[];
      const sc = pr*im;
      return `<td class="heat-cell" style="background:${here.length?tone(sc):'transparent'};opacity:${here.length?1:.25}"
        title="${RAID_SCALE[pr]} chance, ${RAID_SCALE[im]} impact — score ${sc}${here.length?': '+esc(here.map(r=>r.title).join(', ')):''}">${here.length||''}</td>`;
    }).join('') + '</tr>';
  }
  return `<table class="heat"><tbody>${rows}
    <tr><th></th>${[1,2,3,4,5].map(im=>`<td class="heat-axis heat-foot">${RAID_SCALE[im]}</td>`).join('')}</tr>
  </tbody></table>
  <div class="view-sub" style="margin:4px 0 0">Down: how likely. Across: how much it would hurt. Anything scoring 15 or more drags the project's health to off track on its own.</div>`;
}

/* Burndown and velocity live in the project's own panel, so they are destroyed
   and rebuilt with it rather than with the page's charts. */
let agileCharts = [];
function destroyAgileCharts(){ agileCharts.forEach(c=>{ try{ c.destroy(); }catch(e){} }); agileCharts = []; }
function drawAgileCharts(p){
  destroyAgileCharts();
  if(typeof Chart==='undefined') return;
  const tc = chartTextColor(), gc = chartGridColor();
  const sprint = activeSprint(p);
  const burnEl = document.getElementById('chart-burndown');
  if(burnEl && sprint && sprintTally(p, sprint.id).total){
    const b = burndown(p, sprint);
    agileCharts.push(new Chart(burnEl, {
      type:'line',
      data:{ labels: b.points.map(x=>x.label), datasets:[
        { label:'Left', data: b.points.map(x=>x.actual), borderColor:'#2a78d6', backgroundColor:'#2a78d633', fill:true, tension:.25, pointRadius:2, spanGaps:false },
        { label:'Plan', data: b.points.map(x=>x.ideal), borderColor:'#64748B', borderDash:[5,4], fill:false, tension:0, pointRadius:0 }
      ] },
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{ y:{ min:0, ticks:{color:tc}, grid:{color:gc} }, x:{ ticks:{color:tc, maxTicksLimit:7}, grid:{display:false} } },
        plugins:{ legend:{ labels:{ color:tc, boxWidth:12, font:{size:11} } } } }
    }));
  }
  const velEl = document.getElementById('chart-velocity');
  if(velEl){
    const v = velocity(p);
    agileCharts.push(new Chart(velEl, {
      type:'bar',
      data:{ labels: v.map(x=>x.sprint.name), datasets:[{ data: v.map(x=>x.done), backgroundColor:'#1baf7a', borderRadius:4 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        scales:{ y:{ beginAtZero:true, ticks:{color:tc}, grid:{color:gc} }, x:{ ticks:{color:tc}, grid:{display:false} } },
        plugins:{ legend:{ display:false } } }
    }));
  }
}

function modalHabitDetail(h){
  const pct7 = habitConsistency(h,7);
  const pct30 = habitConsistency(h,30);
  const cells = [];
  let cursor = new Date();
  for(let i=0;i<30;i++){ cells.unshift({date:fmtISO(cursor), done: !!h.log[fmtISO(cursor)]}); cursor=addDays(cursor,-1); }
  const weeks = [];
  for(let w=11;w>=0;w--){
    let wDone=0, c2=addDays(new Date(),-7*w);
    for(let i=0;i<7;i++){ if(h.log[fmtISO(c2)]) wDone++; c2=addDays(c2,-1); }
    weeks.push({label: w===0?'This wk':`-${w}w`, pct: Math.round(wDone/7*100)});

  openModal(`

    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" data-action="close-modal">Close</button>
    </div>`);

/* Where an item may sit: a programme under a portfolio, a project under either.
   Everything below the item itself is excluded, or the tree would loop. */
function parentOptions(p){
  const kind = p.kind || 'project';
  if(kind === 'portfolio') return [];
  const banned = new Set([p.id]);
  (function below(x){ childProjects(x).forEach(c=>{ if(!banned.has(c.id)){ banned.add(c.id); below(c); } }); })(p);
  return projects().filter(x=>!banned.has(x.id) && (kind==='program' ? x.kind==='portfolio' : isContainerKind(x)));
}
