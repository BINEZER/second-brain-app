<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Second Brain" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Second Brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root{
        --c-bg:#F8FAFC;--c-surface:#FFFFFF;--c-surface-alt:#F1F5F9;--c-border:#E2E8F0;--c-border-strong:#CBD5E1;
        --c-text:#1E293B;--c-text-secondary:#475569;--c-text-muted:#94A3B8;
        --c-focus:#0F172A;--c-focus-dim:#F1F5F9;--c-onfocus:#FFFFFF;
        --c-warn:#F59E0B;--c-warn-dim:#FEF3C7;
        --c-good:#10B981;--c-good-dim:#D1FAE5;--c-danger:#F43F5E;--c-danger-dim:#FFE4E6;
        --c-info:#0EA5E9;--c-info-dim:#E0F2FE;--c-oninvert:#0F172A;
        --radius-lg:16px;--radius-md:12px;--radius-sm:8px;
        --shadow-1:0 1px 2px rgba(15,23,42,.05);--shadow-2:0 6px 20px rgba(15,23,42,.10);
        color-scheme:light;
      }
      [data-theme="dark"]{
        --c-bg:#0F172A;--c-surface:#1E293B;--c-surface-alt:#334155;--c-border:#334155;--c-border-strong:#475569;
        --c-text:#F1F5F9;--c-text-secondary:#CBD5E1;--c-text-muted:#94A3B8;
        --c-focus:#F1F5F9;--c-focus-dim:#334155;--c-onfocus:#0F172A;
        --c-warn:#F59E0B;--c-warn-dim:#3A2E1A;
        --c-good:#10B981;--c-good-dim:#113328;--c-danger:#F43F5E;--c-danger-dim:#3A1622;
        --c-info:#0EA5E9;--c-info-dim:#0C2C3D;--c-oninvert:#F1F5F9;
        --shadow-1:0 1px 2px rgba(0,0,0,.25);--shadow-2:0 10px 30px rgba(0,0,0,.35);
        color-scheme:dark;
      }
      *{box-sizing:border-box}
      html,body{height:100%}
      body{
        margin:0;background:var(--c-bg);color:var(--c-text);
        font-family:Inter,ui-sans-serif,system-ui,sans-serif;
        -webkit-font-smoothing:antialiased;line-height:1.45;
        /* Safari inflates text in landscape and flashes grey on every tap. */
        -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
      }
      .font-display{font-family:'Space Grotesk',Inter,sans-serif}
      .font-mono{font-family:'JetBrains Mono',monospace}
      button{font:inherit;cursor:pointer}
      input,textarea,select{font:inherit;color:inherit}
      a{color:inherit}
      ::selection{background:var(--c-info-dim)}

      /* ---------- shell ---------- */
      #app{display:flex;min-height:100vh;min-height:100dvh}
      .sidebar{
        width:230px;flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);
        display:flex;flex-direction:column;padding:18px 14px;gap:4px;transition:width .18s ease,padding .18s ease;
        position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
      }
      .sidebar.collapsed{width:72px;padding:18px 10px}
      .sb-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 16px;gap:8px}
      .sb-brand{display:flex;align-items:center;gap:9px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden}
      .sb-brand .dot{width:11px;height:11px;border-radius:4px;background:var(--c-focus);flex-shrink:0}
      .sidebar.collapsed .sb-brand span{display:none}
      .sb-toggle{width:28px;height:28px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
      .sb-toggle:hover{background:var(--c-surface-alt)}
      /* Phone-only nav chrome: the menu button, the drawer's close button and the
         scrim behind it. All three are switched on by the narrow-screen block below. */
      .icon-btn.nav-btn,.sb-close{display:none}
      .nav-scrim{display:none}
      .nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--c-text-secondary);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden}
      .nav-item .ic{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
      .nav-item:hover{background:var(--c-surface-alt);color:var(--c-text)}
      .nav-item.active{background:var(--c-focus);color:var(--c-onfocus);font-weight:600}
      .sidebar.collapsed .nav-item span.label{display:none}
      .sidebar.collapsed .nav-item{justify-content:center}
      .nav-badge{margin-left:auto;background:var(--c-focus);color:var(--c-onfocus);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;min-width:18px;text-align:center}
      .sidebar.collapsed .nav-badge{display:none}
      .nav-divider{height:1px;background:var(--c-border);margin:10px 6px}
      .nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c-text-muted);padding:8px 10px 4px}
      .sidebar.collapsed .nav-group-label{display:none}
      .sb-foot{margin-top:auto;padding-top:10px}

      .main{flex:1;min-width:0;display:flex;flex-direction:column}
      .topbar{
        position:sticky;top:0;z-index:20;background:var(--c-bg);
        display:flex;align-items:center;gap:18px;padding:16px 28px;border-bottom:1px solid var(--c-border);
        flex-wrap:wrap;
      }
      .xp-block{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
      .xp-level{
        width:38px;height:38px;border-radius:11px;background:var(--c-focus);
        color:var(--c-onfocus);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
        box-shadow:var(--shadow-1);
      }
      .xp-mid{flex:1;min-width:120px}
      .xp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--c-text-muted);margin-bottom:4px;font-weight:600}
      .xp-bar{height:7px;border-radius:99px;background:var(--c-surface-alt);overflow:hidden}
      .xp-bar-fill{height:100%;background:var(--c-good);border-radius:99px;transition:width .4s ease}
      .streak-chip{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--c-surface);border:1px solid var(--c-border);padding:6px 12px;border-radius:99px;white-space:nowrap}
      .topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
      .icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-secondary);display:flex;align-items:center;justify-content:center}
      .icon-btn:hover{background:var(--c-surface-alt)}

      .view{padding:24px 28px 80px;max-width:980px;width:100%;margin:0 auto}
      .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
      .view-title{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}
      .today-stamp{text-align:right;line-height:1.35;flex-shrink:0}
      .today-day{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--c-text)}
      .today-date{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--c-text-muted)}
      .view-sub{color:var(--c-text-muted);font-size:13.5px;margin-top:3px}

      /* ---------- buttons ---------- */
      .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text);font-size:13.5px;font-weight:600;white-space:nowrap}
      .btn:hover{border-color:var(--c-border-strong)}
      .btn-primary{background:var(--c-focus);border-color:var(--c-focus);color:var(--c-onfocus)}
      .btn-primary:hover{filter:brightness(1.06)}
      .btn-ghost{background:transparent;border-color:transparent;color:var(--c-text-secondary)}
      .btn-ghost:hover{background:var(--c-surface-alt)}
      .btn-danger{color:var(--c-danger)}
      .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
      .btn:disabled{opacity:.45;cursor:not-allowed}

      /* ---------- cards / misc ---------- */
      .card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-1)}
      .empty{color:var(--c-text-muted);font-size:14px;text-align:center;padding:50px 20px;border:1.5px dashed var(--c-border);border-radius:var(--radius-lg)}
      .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--c-border);background:var(--c-surface-alt);color:var(--c-text-secondary);white-space:nowrap}
      .chip.on{background:var(--c-focus);border-color:var(--c-focus);color:var(--c-onfocus)}
      .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
      .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
      .pri-high{color:var(--c-danger)}.pri-medium{color:var(--c-warn)}.pri-low{color:var(--c-text-muted)}
      .pri-dot.pri-high{background:var(--c-danger)}.pri-dot.pri-medium{background:var(--c-warn)}.pri-dot.pri-low{background:var(--c-text-muted)}

      /* quick capture */
      .capture{display:flex;gap:8px;margin-bottom:18px}
      .capture input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--c-border);background:var(--c-surface);font-size:14px}
      .capture input:focus{outline:2px solid var(--c-info-dim);border-color:var(--c-info)}

      /* inbox item */
      .item-row{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--radius-md);border:1px solid var(--c-border);background:var(--c-surface);margin-bottom:9px}
      .item-row:hover{border-color:var(--c-border-strong)}
      .check{width:20px;height:20px;border-radius:7px;border:2px solid var(--c-border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--c-surface)}
      .check.done{background:var(--c-good);border-color:var(--c-good)}
      .check.done svg{stroke:#fff}
      .item-main{flex:1;min-width:0}
      .item-title{font-size:14.5px;font-weight:500;word-break:break-word}
      .item-title.done{text-decoration:line-through;color:var(--c-text-muted)}
      .item-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--c-text-muted)}
      .item-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}

      /* now / focus */
      .focus-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
      .focus-card{display:flex;align-items:flex-start;gap:14px;padding:18px;border-radius:var(--radius-lg);border:1px solid var(--c-border);border-left:3px solid var(--c-info);background:var(--c-surface);box-shadow:var(--shadow-1)}
      .focus-num{width:26px;height:26px;border-radius:8px;background:var(--c-info-dim);color:var(--c-info);font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
      .focus-title{font-size:16px;font-weight:600}
      .focus-empty-slot{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;border-radius:var(--radius-lg);border:1.5px dashed var(--c-border-strong);color:var(--c-text-muted);font-size:13.5px}
      .pipeline{border-radius:var(--radius-lg);border:1px solid var(--c-border);background:var(--c-surface-alt);padding:14px 16px}
      .pipeline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
      .pipeline-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted)}
      .pipeline-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);background:var(--c-surface)}
      .pipeline-row+.pipeline-row{margin-top:6px}

      /* habits */
      .habit-strip{border-radius:var(--radius-lg);border:1px solid var(--c-border);background:var(--c-surface);padding:16px 18px;margin-bottom:26px}
      .habit-strip-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
      .habit-row{display:flex;align-items:center;gap:12px;padding:8px 0}
      .habit-row+.habit-row{border-top:1px solid var(--c-border)}
      .habit-name{width:180px;flex-shrink:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
      .habit-days{display:flex;gap:6px;flex:1}
      .day-cell{flex:1;text-align:center}
      .day-lbl{font-size:10px;color:var(--c-text-muted);font-weight:700;margin-bottom:4px}
      .day-dot{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--c-border-strong);margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--c-surface)}
      .day-dot.done{background:var(--c-good);border-color:var(--c-good);color:#fff}
      .day-dot.today{box-shadow:0 0 0 2px var(--c-info-dim);border-color:var(--c-info)}
      .day-dot.future{opacity:.35;cursor:not-allowed}
      .day-dot.offsched{opacity:.3}
      .day-dot.offsched.done{opacity:1}
      .habit-streak{width:76px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:700;color:var(--c-warn)}

      /* project cards */
      .project-card{border-radius:var(--radius-lg);border:1px solid var(--c-border);background:var(--c-surface);margin-bottom:14px;overflow:hidden}
      .project-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer}
      .project-title{font-size:15.5px;font-weight:600}
      .project-progress-track{height:6px;border-radius:99px;background:var(--c-surface-alt);margin-top:8px;position:relative;overflow:visible}
      .project-progress-fill{height:100%;background:var(--c-good);border-radius:99px}
      .project-progress-track.risk .project-progress-fill{background:var(--c-warn)}
      .project-progress-track.behind .project-progress-fill{background:var(--c-danger)}
      .sched-marker{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--c-text-secondary);opacity:.8}
      .health-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
      .health-ahead{color:var(--c-good);border-color:var(--c-good);background:var(--c-good-dim)}
      .health-ontrack{color:var(--c-info);border-color:var(--c-info);background:var(--c-info-dim)}
      .health-risk{color:var(--c-warn);border-color:var(--c-warn);background:var(--c-warn-dim)}
      .health-behind{color:var(--c-danger);border-color:var(--c-danger);background:var(--c-danger-dim)}
      .health-overdue{color:var(--c-danger);border-color:var(--c-danger);background:var(--c-danger-dim)}
      .health-noplan{color:var(--c-text-muted);border-color:var(--c-border-strong);background:var(--c-surface-alt)}
      .health-nodate{color:var(--c-text-muted);border-color:var(--c-border-strong);background:var(--c-surface-alt)}
      .health-done{color:var(--c-good);border-color:var(--c-good);background:var(--c-good-dim)}
      .health-stalled{color:var(--c-warn);border-color:var(--c-warn);background:var(--c-warn-dim)}
      .effort-chip{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;line-height:16px;min-width:22px;text-align:center;padding:0 5px;border-radius:5px;border:1px solid var(--c-border-strong);background:var(--c-surface);color:var(--c-text-muted);cursor:pointer;flex-shrink:0}
      .effort-chip:hover{border-color:var(--c-focus);color:var(--c-focus)}
      .rollup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-bottom:14px}
      .rollup-tile{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:12px 14px}
      button.rollup-tile{width:100%;text-align:left;font:inherit;cursor:pointer;display:block;transition:border-color .12s,background .12s}
      button.rollup-tile:hover{border-color:var(--c-border-strong);background:var(--c-surface-alt)}
      button.rollup-tile:focus-visible{outline:2px solid var(--c-focus);outline-offset:2px}
      .rollup-tile .drill{font-size:10px;font-weight:700;color:var(--c-text-muted);margin-top:6px;opacity:.75}
      .rollup-tile .v{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700;color:var(--c-text);line-height:1.1}
      .rollup-tile .k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);margin-top:5px}
      .rollup-tile:nth-child(4n+1){border-top:3px solid #6366F1}
      .rollup-tile:nth-child(4n+2){border-top:3px solid #F43F5E}
      .rollup-tile:nth-child(4n+3){border-top:3px solid #0EA5E9}
      .rollup-tile:nth-child(4n+4){border-top:3px solid #F59E0B}
      /* Drag to reorder. touch-action:none on the handle stops the browser
         scrolling the page instead of letting the pointer drag the row. */
      /* Review-step tools stay out of the way until the row is hovered, so the
         checklist reads as a checklist and not as an editor. */
      .rv-foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px}
      .rv-step .rv-tools{opacity:0;transition:opacity .12s;flex-shrink:0}
      .rv-step:hover .rv-tools,.rv-step .rv-tools:focus-within{opacity:1}
      @media (hover:none){ .rv-step .rv-tools{opacity:1} }
      /* Already in Now reads as greyed out and spent, so a list scans as "these
         are still available, that one is already taken". It stays clickable —
         you must be able to take something out of Now from where you are — and
         hover brings it back to full strength to say so. */
      .pin-btn.pinned{background:var(--c-surface-alt);border-color:var(--c-border);opacity:.4;filter:grayscale(1)}
      .pin-btn.pinned:hover{opacity:1;filter:none;border-color:var(--c-border-strong)}
      .pick-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--c-line,var(--c-border));
        font-size:14px;cursor:pointer;border-radius:6px}
      .pick-row:last-child{border-bottom:none}
      .pick-row:hover{background:var(--c-surface-alt)}
      .pick-row input{width:16px;height:16px;flex-shrink:0;accent-color:var(--c-focus);cursor:pointer}
      .drag-handle{width:26px;height:26px;border-radius:8px;border:1px solid transparent;background:transparent;
        color:var(--c-text-muted);font-size:14px;line-height:1;cursor:grab;touch-action:none;flex-shrink:0}
      .drag-handle:hover{background:var(--c-surface-alt);border-color:var(--c-border);color:var(--c-text-secondary)}
      .drag-handle:active{cursor:grabbing}
      body.dragging-active{cursor:grabbing;user-select:none}
      [data-dnd-row].dragging{opacity:.45}
      [data-dnd-row].drop-before{box-shadow:0 -3px 0 -1px var(--c-focus)}
      [data-dnd-row].drop-after{box-shadow:0 3px 0 -1px var(--c-focus)}
      .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:4px}
      .mini-table th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);padding:0 10px 7px 0;font-weight:700}
      .mini-table td{padding:7px 10px 7px 0;border-top:1px solid var(--c-border);vertical-align:middle}
      .mini-table td.num{font-family:'JetBrains Mono',monospace;text-align:right;padding-right:0;white-space:nowrap}
      /* A numeric header must sit directly over its numbers: same alignment AND
         same right edge, or the column reads as two columns that drifted apart. */
      .mini-table th.num{text-align:right;padding-right:0;white-space:nowrap}
      .mini-table th.num,.mini-table td.num{font-variant-numeric:tabular-nums;padding-left:10px}
      .mini-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
      .mini-table tr.row-link{cursor:pointer}
      .mini-table tr.row-link:hover td{background:var(--c-surface-alt)}
      .mini-table tr.row-link td:first-child{border-top-left-radius:8px;border-bottom-left-radius:8px}
      .project-body{border-top:1px solid var(--c-border);padding:16px 18px;background:var(--c-surface-alt)}
      .sub-list{margin-bottom:12px}
      .sub-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px}
      .sub-title{flex:1;min-width:0;word-break:break-word}
      .sub-add{display:flex;gap:8px;margin-top:8px}
      .sub-add input{flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface);font-size:13px}
      .rv-step{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--c-border)}
      .rv-step:last-child{border-bottom:none}
      .rv-step .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--c-border-strong);background:var(--c-surface);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer}
      .rv-step .box.on{background:var(--c-good);border-color:var(--c-good)}
      .rv-step.done .rv-what{text-decoration:line-through;color:var(--c-text-muted)}
      .rv-body{flex:1;min-width:0;cursor:pointer}
      .rv-what{font-size:14px;font-weight:600}
      .rv-why{font-size:12.5px;color:var(--c-text-muted);margin-top:2px}
      .rv-where{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--c-text-secondary);background:var(--c-surface-alt);border:1px solid var(--c-border);border-radius:5px;padding:1px 6px;margin-top:5px}
      .rv-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 2px;padding-top:12px;border-top:1px solid var(--c-border-strong);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c-text-secondary)}
      .rv-sec:first-of-type{border-top:none;padding-top:6px;margin-top:8px}
      .rv-sec-count{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--c-text-muted);letter-spacing:0}
      .rv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
      .clickable-title{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
      .clickable-title:hover{text-decoration-color:var(--c-border-strong)}
      .parent-chip{font-size:11.5px;color:var(--c-text-muted)}
      .row-tools{display:inline-flex;gap:2px;flex-shrink:0}
      .row-tools .icon-btn{padding:2px 5px;font-size:12px;line-height:1.1}
      .icon-btn[disabled]{opacity:.25;cursor:not-allowed}
      .search-box{flex:1;min-width:180px;padding:8px 12px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);font-size:13.5px;color:var(--c-text)}
      .search-box:focus{outline:2px solid var(--c-info-dim);border-color:var(--c-info)}
      .filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
      .habit-row.inactive{opacity:.5}
      .week-pager{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--c-text-muted)}
      .dom-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--c-border);flex-wrap:wrap}
      .dom-row:last-child{border-bottom:none}
      .dom-row .dom-name{flex:1;min-width:140px;font-size:13.5px;font-weight:600}
      .frow2{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px dotted var(--c-border);font-size:13.5px}
      .frow2:last-child{border-bottom:none}
      .fk2{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--c-text-muted);padding-top:2px}
      .dom-row .dom-count{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--c-text-muted);white-space:nowrap}
      .list-num{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--c-text-muted);font-variant-numeric:tabular-nums;min-width:22px;text-align:right;flex-shrink:0;padding-top:2px}
      .import-box{width:100%;min-height:130px;padding:11px 13px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface-alt);color:var(--c-text);font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.55;resize:vertical}
      .import-box:focus{outline:2px solid var(--c-info-dim);border-color:var(--c-info)}
      .import-plan{border:1px solid var(--c-border);border-radius:10px;padding:12px 14px;background:var(--c-surface-alt);margin-top:12px;font-size:13px}
      .import-plan ul{margin:6px 0 0;padding-left:18px}
      .import-plan li{margin:2px 0}
      .import-err{border-color:var(--c-danger);color:var(--c-danger)}
      .section-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c-text-muted);margin:14px 0 8px}
      .section-label:first-child{margin-top:0}

      /* life binder */
      .area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:18px}
      .area-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:16px;cursor:pointer;transition:border-color .15s;position:relative}
      .area-card:hover{border-color:var(--c-border-strong)}
      .area-card h3{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:5px;padding-right:16px}
      .area-card p{font-size:13px;color:var(--c-text-secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
      .area-card .meta{margin-top:10px;font-size:11.5px;color:var(--c-text-muted)}
      .area-flag{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--c-warn)}
      .area-gp{margin:14px 0;padding:12px 14px;border-left:3px solid var(--c-focus);background:var(--c-surface-alt);border-radius:0 10px 10px 0;font-size:13.5px;font-style:italic}
      .area-routines{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
      .area-routines th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);padding:0 8px 6px 0}
      .area-routines td{padding:7px 8px 7px 0;border-top:1px solid var(--c-border);vertical-align:top}

      /* toasts */
      #toast-stack{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200;align-items:flex-end}
      .toast{background:var(--c-oninvert);color:var(--c-bg);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;animation:toast-in .25s ease;max-width:280px}
      .toast.level{background:var(--c-good);color:#fff}
      @keyframes toast-in{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
      .toast.leaving{animation:toast-out .2s ease forwards}
      @keyframes toast-out{to{opacity:0;transform:translateY(6px) scale(.96)}}

      /* modal */
      .modal-overlay{position:fixed;inset:0;background:rgba(20,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:100}
      .modal{background:var(--c-surface);border-radius:var(--radius-lg);max-width:520px;width:100%;padding:22px 22px 24px;box-shadow:var(--shadow-2)}
      .modal h3{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 14px}
      .field{margin-bottom:12px}
      .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);margin-bottom:5px}
      .field input,.field select,.field textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--c-border);background:var(--c-bg);font-size:13.5px}
      .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

      /* process inbox */
      .triage-wrap{max-width:520px;margin:10px auto 0}
      .triage-card{border-radius:var(--radius-lg);border:1px solid var(--c-border);background:var(--c-surface);padding:26px;text-align:center;box-shadow:var(--shadow-1)}
      .triage-progress{font-size:12px;color:var(--c-text-muted);margin-bottom:14px;font-weight:600}
      .triage-title{font-size:19px;font-weight:600;margin-bottom:18px;word-break:break-word}
      .triage-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
      .triage-actions .btn{justify-content:center;padding:12px}
      .triage-actions .full{grid-column:1/-1}

      /* The board: three columns on a desktop, stacked on a phone. */
      .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
      .board-col{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:10px}
      .board-head{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);
        display:flex;justify-content:space-between;gap:6px;margin-bottom:8px}
      .story{border:1px solid var(--c-border);border-radius:10px;padding:8px 9px;margin-bottom:7px;background:var(--c-bg)}
      .story-top{display:flex;gap:7px;align-items:flex-start}
      .story-title{font-size:13px;min-width:0;word-break:break-word}
      .story-title.done{text-decoration:line-through;color:var(--c-text-muted)}
      .story-foot{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin-top:7px}
      .story-foot .icon-btn{width:26px;height:26px;border-radius:7px;font-size:12px;padding:0}
      .story-foot select{font-size:11px;padding:3px 5px;border-radius:7px;border:1px solid var(--c-border);
        background:var(--c-surface);color:var(--c-text-secondary);max-width:110px}
      .sprint-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
        border:1px solid var(--c-border);border-radius:var(--radius-md);background:var(--c-surface);padding:10px 12px;margin-bottom:12px;font-size:13.5px}
      @media (max-width:820px){ .board{grid-template-columns:minmax(0,1fr)} .story-foot select{max-width:none;flex:1 1 90px} }

      /* Wins: a finished project should look finished, not like another row. */
      .win-hero{display:flex;align-items:center;gap:18px}
      .win-hero-n{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;line-height:1;color:var(--c-good);flex-shrink:0}
      .win-card{padding:14px 16px;border-left:3px solid var(--c-good)}
      .win-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
      .win-mark{flex-shrink:0}
      .win-title{font-size:14.5px;font-weight:600;min-width:0;word-break:break-word}
      /* Twelve months of finishing, as a small bar strip. */
      .spark{display:flex;align-items:flex-end;gap:6px;min-height:86px}
      .spark-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
      .spark-bar{width:100%;max-width:26px;border-radius:4px 4px 0 0;background:var(--c-good)}
      .spark-lbl{font-size:10px;color:var(--c-text-muted);font-weight:700}
      .spark-n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--c-text-secondary);min-height:14px}

      /* The portfolio tree: one row per item, indented by depth. */
      .tree-row{padding-top:10px;padding-bottom:10px;border-top:1px solid var(--c-border)}
      .tree-row:first-child{border-top:none}
      .tree-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
      .tree-mark{color:var(--c-text-muted);font-size:12px;flex-shrink:0}
      .tree-title{font-size:14px;font-weight:600;min-width:0;word-break:break-word}
      .tree-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--c-text-muted);margin-top:3px}
      .tree-bar{height:5px;border-radius:99px;background:var(--c-surface-alt);margin-top:7px;overflow:hidden}
      .tree-bar span{display:block;height:100%;border-radius:99px}

      /* A doughnut and the numbers behind it, side by side on a desktop and
         stacked on a phone — the legend is the readable half on a small screen. */
      .donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
      .donut-canvas{flex:0 0 160px;height:160px;width:160px;position:relative;display:flex;align-items:center;justify-content:center}
      .donut-svg{width:100%;height:100%;transform:rotate(-90deg)}
      .donut-arc{transition:stroke-width .12s}
      .donut-middle{position:absolute;text-align:center;pointer-events:none}
      .donut-total{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;line-height:1.1}
      .donut-cap{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-text-muted);margin-top:2px}
      .legend{list-style:none;margin:0;padding:0;flex:1 1 220px;min-width:0}
      .legend li{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;border-top:1px solid var(--c-border)}
      .legend li:first-child{border-top:none}
      .legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
      .legend-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .legend b{font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap}
      .legend-share{color:var(--c-text-muted);font-weight:500}

      /* Risk heat map: probability down, impact across. */
      .heat{border-collapse:separate;border-spacing:3px;font-size:11px}
      .heat-cell{width:34px;height:30px;border-radius:6px;border:1px solid var(--c-border);text-align:center;
        color:#fff;font-weight:700;font-size:12px;vertical-align:middle}
      .heat-axis{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-text-muted);
        text-align:right;padding-right:4px;white-space:nowrap}
      .heat-foot{text-align:center;padding:2px 0 0}
      .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
      /* =========================================================
         Phones and tablets

         The sidebar used to stay in the layout at every width: on a 414px
         screen it covered more than half the page and swallowed every tap
         underneath it. Below 820px it becomes a drawer — off screen until the
         menu button opens it, over a scrim that closes it, and closing itself
         whenever a destination is chosen, because on a phone the nav is a
         detour rather than a place to be.
         ========================================================= */
      @media (max-width:820px){
        .sidebar,.sidebar.collapsed{
          position:fixed;left:0;top:0;z-index:60;width:min(78vw,264px);padding:18px 14px;
          border-right:1px solid var(--c-border);box-shadow:var(--shadow-2);
          transform:translateX(-100%);transition:transform .22s ease;
        }
        .sidebar.open{transform:translateX(0)}
        /* The desktop icon rail has no meaning in a drawer — show the full labels. */
        .sidebar.collapsed .sb-brand span,.sidebar.collapsed .nav-item span.label{display:inline}
        .sidebar.collapsed .nav-badge{display:inline-block}
        .sidebar.collapsed .nav-group-label{display:block}
        .sidebar.collapsed .nav-item{justify-content:flex-start}
        .sb-toggle{display:none}
        .sb-close{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
          border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text-secondary);font-size:15px;flex-shrink:0}
        .icon-btn.nav-btn{display:flex;flex-shrink:0}
        .nav-scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(15,23,42,.45);
          opacity:0;pointer-events:none;transition:opacity .22s ease}
        /* touch-action:none so a swipe over the scrim dismisses rather than
           scrolling the page hidden behind the drawer. */
        .nav-scrim.on{opacity:1;pointer-events:auto;touch-action:none;overscroll-behavior:contain}
        .nav-item{padding:12px 10px}

        .main{width:100%;min-width:0}
        .view{padding:18px 16px 70px}
        .topbar{padding:10px 14px;gap:10px;flex-wrap:nowrap}
        .xp-block{min-width:0;flex:1 1 auto;gap:8px}
        .xp-mid{min-width:0}
        .xp-level{width:32px;height:32px;border-radius:9px;font-size:13px}
        .topbar-actions{margin-left:0;flex-shrink:0}
        .streak-chip{padding:6px 10px}

        /* iOS zooms the whole page in when a focused field is under 16px. */
        input,select,textarea,.search-box,.capture input,.field input,.field select,
        .field textarea,.sub-add input,.import-box{font-size:16px}

        #toast-stack{left:12px;right:12px;bottom:16px;align-items:stretch}
        .toast{max-width:100%}

        .modal-overlay{padding:14px 10px 28px}
        .modal{padding:18px 16px 20px}
        .modal-actions{flex-wrap:wrap}
        .modal-actions .btn{flex:1 1 auto;justify-content:center}
      }

      /* Notch and home-indicator insets, for the installed-to-home-screen app,
         which draws under both. */
      @supports (padding:max(0px)){
        @media (max-width:820px){
          .topbar{padding-top:max(10px,env(safe-area-inset-top));
                  padding-left:max(14px,env(safe-area-inset-left));
                  padding-right:max(14px,env(safe-area-inset-right))}
          .sidebar,.sidebar.collapsed{padding-top:max(18px,env(safe-area-inset-top));
                  padding-bottom:max(18px,env(safe-area-inset-bottom))}
          .view{padding-left:max(16px,env(safe-area-inset-left));
                padding-right:max(16px,env(safe-area-inset-right));
                padding-bottom:max(70px,env(safe-area-inset-bottom))}
          #toast-stack{bottom:max(16px,env(safe-area-inset-bottom))}
        }
      }

      /* Rows built as one line of title plus a tail of buttons: on a narrow
         screen the buttons won, squeezing the title to one letter per line.
         The buttons drop to their own line instead. */
      @media (max-width:620px){
        .item-row,.rv-step,.project-head,.sub-row{flex-wrap:wrap}
        .item-actions{flex:1 1 100%;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
        .pipeline-row{flex-wrap:wrap}
        .search-box{min-width:0;flex:1 1 100%}
        .view-head{align-items:flex-start}
        .today-stamp{text-align:left}
        .pipeline-head{flex-wrap:wrap;gap:4px 10px}
        .pipeline-head .view-sub{flex:1 1 220px;margin-top:0}
        .habit-strip-head{flex-wrap:wrap;gap:8px}
        .sub-add{flex-wrap:wrap}
        .sub-add input{flex:1 1 100%}
        .frow2{grid-template-columns:minmax(0,1fr);gap:2px}
        /* The two periods sit side by side; the sentence they were joined into
           ("Compare X with Y") does not survive a 414px line, and the table
           headers name both periods anyway. */
        .cmp-bar .cmp-word{display:none}
        .cmp-bar>select{flex:1 1 calc(50% - 4px);min-width:0}
        .cmp-bar>select.cmp-domain{flex:1 1 100%}
      }

      /* The habit grid needs about 730px to keep a name, seven days, a streak and
         six tools on one line — more than a phone has in either orientation, and
         more than a tablet has beside the sidebar. Below that it becomes three
         lines: the name, then the streak and the row's tools, then the seven days,
         each day getting a full-width share instead of twenty squeezed pixels. */
      @media (max-width:1024px){
        .habit-row{flex-wrap:wrap;gap:6px 10px;padding:12px 0}
        .habit-name{width:auto;flex:1 1 100%;min-width:0;white-space:normal}
        .habit-streak{width:auto;flex:0 0 auto;order:2;text-align:left}
        .habit-row .row-tools{order:2;margin-left:auto}
        .habit-row>.icon-btn{order:2}
        /* Capped so the week does not sprawl across a tablet-width card. */
        .habit-days{flex:1 1 100%;order:3;gap:4px;max-width:520px}
        .day-dot{width:34px;height:34px}
      }

      /* Touch: a 26px target is a miss waiting to happen. */
      @media (pointer:coarse){
        .story-foot .icon-btn{width:32px;height:32px}
        .btn{padding:10px 16px}
        .btn-sm{padding:8px 12px}
        .icon-btn{width:38px;height:38px}
        .row-tools .icon-btn{width:34px;height:34px;padding:0}
        .check{width:24px;height:24px}
        .rv-step .box{width:24px;height:24px}
        .drag-handle{width:34px;height:34px}
        .chip{padding:7px 12px}
        .nav-item{padding:12px 10px}
        .modal-actions .btn,.triage-actions .btn{min-height:44px}
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-stack"></div>
    <div id="modal-root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="/firebase-init.js"></script>
    <script src="/binder-data.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <script>
'use strict';

/* =========================================================
   Constants
   ========================================================= */
const STATE_KEY = "adhd-second-brain-v1";
const INACTIVE_KEY = "sb-project-inactive-v1";
const DAY_LABELS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const AREA_MIGRATION_MAP = {
  'Personal': 'Personal / Self',
  'Health': 'Inbox',
  'Finance': 'Financial (Household)',
  'Career': 'Work — IntelMotion / Intel Group',
  'Family': 'Family & Marriage',
  'Home': 'Home & Living Space'
};
const XP_TASK = 10, XP_MILESTONE = 25, XP_HABITS = 15;

/* Review checklists. Deliberately outside the XP system — ticking these awards
   nothing, so a review is never something you do for points.

   Each list is split into sections so the Second Brain pass and the finance
   pass read as separate blocks rather than one long run of checkboxes.
   Steps are ordered highest-value first: if a review gets cut short, the
   part that was skipped is the part that mattered least. */
const REVIEW_LISTS = {
  daily: {
    label: 'Daily pass',
    blurb: 'Twenty minutes, same order every day. Work top to bottom and stop when you run out of time — the order is the point.',
    resets: 'clears at midnight',
    sections: [
      { name: 'Second Brain', steps: [

/* A tick is stored against the step's text, not its position. Positional keys
   (s0i0) silently re-point every tick the moment a step is inserted above them —
   yesterday's Finance tick reappearing on a new IntelMotion step. Hashing the
   section plus the step means the list can be edited and reordered forever and a
   tick always belongs to the step it was made on. */
function reviewKey(secName, stepTitle){
  const str = secName + '\u0000' + stepTitle;
  let h = 5381;
  for(let i=0;i<str.length;i++) h = ((h*33) ^ str.charCodeAt(i)) >>> 0;
  return 'k' + h.toString(36);
}
const REVIEW_MINE = 'Your own steps';   // the section holding steps the owner wrote
function reviewCustom(kind){ return state.state.reviewCustom[kind]; }
function reviewHidden(kind){ return state.state.reviewHidden[kind]; }
function isReviewHidden(kind, key){ return reviewHidden(kind).indexOf(key)>=0; }

/* The sections actually shown for a cadence: the built-ins minus anything hidden,
   plus the owner's own steps as a final section. A hidden built-in is only hidden —
   un-hide it and its wording comes back from the code, never from saved state. */
function reviewSections(kind){
  const out = (REVIEW_LISTS[kind].sections||[]).map(sec=>({
    name: sec.name, builtin: true,
    steps: sec.steps.filter(st=>!isReviewHidden(kind, reviewKey(sec.name, st[0])))
  })).filter(sec=>sec.steps.length);
  const mine = reviewCustom(kind);
  if(mine.length) out.push({ name: REVIEW_MINE, builtin:false, steps: mine.map(c=>[c.what, c.why, c.where]) });
  return out;
}
function reviewSteps(kind){
  const out = [];
  reviewSections(kind).forEach((sec,si)=>sec.steps.forEach((st,i)=>
    out.push({ sec:sec.name, si, i, builtin:sec.builtin, key:reviewKey(sec.name, st[0]), st,
               customId: sec.builtin ? null : (reviewCustom(kind)[i]||{}).id })));
  return out;
}
/* Built-in steps currently hidden, for the "restore" list. */
function reviewHiddenSteps(kind){
  const out = [];
  (REVIEW_LISTS[kind].sections||[]).forEach(sec=>sec.steps.forEach(st=>{
    const key = reviewKey(sec.name, st[0]);
    if(isReviewHidden(kind, key)) out.push({ sec:sec.name, key, st });
  }));
  return out;
}

/* =========================================================
   Portfolio → programme → project

   A project is still a project: one of these levels, with a plan of milestones.
   A programme or a portfolio holds other items instead of its own milestones,
   and everything — completion, effort, budget, health, risk — rolls up the tree
   by each child's weight among its siblings. Nothing existing changes shape: an
   item with no kind is a project, with no parent, weighing one.
   ========================================================= */
const PROJECT_KINDS = {
  project:   { label:'Project',   mark:'▪', sub:'Has its own milestones and tasks' },
  program:   { label:'Programme', mark:'▣', sub:'Holds projects that share an outcome' },
  portfolio: { label:'Portfolio', mark:'▦', sub:'Holds programmes and projects' }
};
const TREE_DEPTH_CAP = 8;   // a parent chain longer than this is a loop, not a plan

/* The log every project office keeps: risks, assumptions, issues, dependencies.
   A risk is scored probability × impact on 1–5, so 1–25, and the live ones feed
   the project's health — being on schedule means little beside a live 20. */
const RAID_TYPES = {
  risk:       { label:'Risk',       sub:'Might happen, and would hurt' },
  issue:      { label:'Issue',      sub:'Already happening' },
  assumption: { label:'Assumption', sub:'Taken as true, unverified' },
  dependency: { label:'Dependency', sub:'Someone else has to move first' }
};
const RAID_STATES = { open:'Open', mitigating:'Being handled', closed:'Closed' };
const RAID_SCALE = ['—','Very low','Low','Medium','High','Very high'];   // index 1–5

/* =========================================================
   How a project is run

   Traditional is what this app has always done: a plan of milestones, each
   sized S/M/L/XL. Agile replaces that plan with a backlog of items carrying
   story points, worked through in sprints. Hybrid keeps the milestones and lets
   any one of them be driven by the backlog items assigned to it — a build phase
   tracked as phases, with the software inside it tracked as stories.

   A project that never picks is traditional, and nothing about it changes.
   ========================================================= */
const METHODS = {
  traditional: { label:'Traditional', sub:'A plan of milestones, each sized S/M/L/XL' },
  agile:       { label:'Agile',       sub:'A backlog of items with points, worked in sprints' },
  hybrid:      { label:'Hybrid',      sub:'Milestones, where one can be driven by its backlog' }
};
const STORY_STATES = { todo:'To do', doing:'Doing', done:'Done' };
const STORY_POINTS = [1,2,3,5,8,13];        // the usual ladder; click a chip to step it
const SPRINT_DAYS = 14;

/* =========================================================
   Small utilities
   ========================================================= */
function uid(){
  if(window.crypto && crypto.randomUUID){ try{ return crypto.randomUUID(); }catch(e){} }
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return n<10?'0'+n:''+n; }
function fmtISO(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return fmtISO(new Date()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; return addDays(x,-day); } // Monday start
function fmtDue(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return '';
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  if(diff<0) return Math.abs(diff)+'d overdue';
  if(diff<7) return 'in '+diff+'d';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
/* "when did that happen" in the fewest words that are still exact enough. */
function fmtWhen(iso){
  if(!iso) return 'never';
  const d = new Date(iso);
  if(isNaN(d)) return 'never';
  const mins = Math.round((Date.now()-d)/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+' min ago';
  if(mins < 60*24 && d.toDateString()===new Date().toDateString())
    return 'today at ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})
       + ' at ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function isOverdue(item){
  if(!item.dueDate || item.status==='done') return false;
  return item.dueDate < todayISO();
}
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
const CAT_PALETTE = ['#F59E0B','#6366F1','#06B6D4','#EC4899','#14B8A6','#8B5CF6','#F97316','#84CC16','#0EA5E9','#F43F5E','#22C55E','#64748B'];
function colorFor(str){
  let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0;
  return CAT_PALETTE[h%CAT_PALETTE.length];
}
function catStyle(cat){
  const hex = colorFor(cat||'General');
  return `background:${hex}22;color:${hex};border-color:${hex}55`;
}

/* =========================================================
   State: load / migrate / save / cloud sync
   ========================================================= */
let state = null;      // {version, state:{items, settings, lifeAreas, habits, gamification}}
let inactiveProjects = []; // array of project ids marked archived

function defaultRoot(){
  return {
    version: 1,
    state: {
      items: [],
      settings: { nowPins: [], inactiveProjects: [], currency: '', themeMode: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light' },
      lifeAreas: [],
      habits: [],
      recurring: [],
      reviews: { daily:{}, weekly:{}, monthly:{} },
      // These must exist here too: resetApp() assigns defaultRoot() straight to
      // `state` without going through loadRoot(), so anything only created by the
      // migration is undefined after a reset and the Review tab throws on render.
      reviewCustom: { daily:[], weekly:[], monthly:[] },
      reviewHidden: { daily:[], weekly:[], monthly:[] },
      gamification: { xp:0, habitBonusDates:[] }
    }
  };
}

function loadRoot(){
  let raw=null;
  try{ raw = JSON.parse(localStorage.getItem(STATE_KEY)); }catch(e){}
  if(!raw || typeof raw!=='object') raw = defaultRoot();
  if(!raw.state) raw.state = {};
  const st = raw.state;
  st.items = Array.isArray(st.items) ? st.items : [];
  st.items.forEach(it=>{
    if(!it.id) it.id = uid();
    if(!Array.isArray(it.subtasks)) it.subtasks = [];
    it.subtasks.forEach(s=>{
      if(!s.id) s.id=uid();
      if(s.xpAwarded==null) s.xpAwarded=!!s.done;
      if(!EFFORT[s.effort]) s.effort = DEFAULT_EFFORT;
      if(s.doneAt===undefined) s.doneAt = null;   // legacy done milestones have no date; treated as pre-history
      if(!s.done) s.doneAt = null;
      // Part-done. A milestone is still a tick by default; a long one (a build
      // phase, a licence application) can report how far through it is instead.
      s.pct = (typeof s.pct==='number' && s.pct>0 && s.pct<100) ? Math.round(s.pct) : null;
      if(s.done) s.pct = null;
      // Hybrid: 'backlog' means this milestone's progress is whatever the backlog
      // items assigned to it add up to, rather than a tick or a typed figure.
      if(s.source!=='backlog') s.source = 'manual';
    });
    if(it.isStarred==null) it.isStarred=false;
    if(it.xpAwarded==null) it.xpAwarded = (it.status==='done'); // don't retro-award xp for legacy completed items
    if(!it.priority) it.priority='medium';
    if(!it.category) it.category='Inbox';
    if(!it.type) it.type='task';
    if(!it.status) it.status='open';
    if(!EFFORT[it.effort]) it.effort = DEFAULT_EFFORT;
    if(it.startDate===undefined) it.startDate = null;   // schedule window start; falls back to createdAt
    if(it.type==='project'){
      // Everything below is optional depth: a project that never uses it is
      // exactly the project it was before these existed.
      if(!PROJECT_KINDS[it.kind]) it.kind = 'project';
      if(it.parentId===undefined) it.parentId = null;
      if(!(it.weight>0)) it.weight = 1;                   // relative share among its siblings
      it.budget = (typeof it.budget==='number' && it.budget>=0) ? it.budget : null;
      it.actualCost = (typeof it.actualCost==='number' && it.actualCost>=0) ? it.actualCost : null;
      if(typeof it.ref!=='string') it.ref = '';
      if(!HEALTH_META[it.healthOverride]) it.healthOverride = null;
      if(!Array.isArray(it.fields)) it.fields = [];
      it.fields.forEach(f=>{ if(!f.id) f.id=uid(); if(typeof f.label!=='string') f.label=''; if(typeof f.value!=='string') f.value=''; });
      if(!Array.isArray(it.risks)) it.risks = [];
      it.risks.forEach(r=>{
        if(!r.id) r.id=uid();
        if(!RAID_TYPES[r.type]) r.type='risk';
        if(!RAID_STATES[r.status]) r.status='open';
        r.probability = Math.min(5, Math.max(1, Math.round(r.probability)||3));
        r.impact = Math.min(5, Math.max(1, Math.round(r.impact)||3));
        if(typeof r.title!=='string') r.title='';
        if(typeof r.owner!=='string') r.owner='';
        if(typeof r.response!=='string') r.response='';
      });
      if(!METHODS[it.method]) it.method = 'traditional';
      if(!Array.isArray(it.backlog)) it.backlog = [];
      it.backlog.forEach(b=>{
        if(!b.id) b.id=uid();
        if(typeof b.title!=='string') b.title='';
        b.points = (typeof b.points==='number' && b.points>=0) ? b.points : 1;
        if(!STORY_STATES[b.status]) b.status='todo';
        if(b.sprintId===undefined) b.sprintId = null;
        if(b.stageId===undefined) b.stageId = null;
        if(b.doneAt===undefined) b.doneAt = null;
        if(b.status!=='done') b.doneAt = null;
      });
      if(!Array.isArray(it.sprints)) it.sprints = [];
      it.sprints.forEach(sp=>{
        if(!sp.id) sp.id=uid();
        if(typeof sp.name!=='string' || !sp.name) sp.name='Sprint';
        if(typeof sp.goal!=='string') sp.goal='';
        if(!/^\d{4}-\d{2}-\d{2}$/.test(sp.start||'')) sp.start = todayISO();
        if(!/^\d{4}-\d{2}-\d{2}$/.test(sp.end||'')) sp.end = fmtISO(addDays(new Date(sp.start+'T00:00:00'), SPRINT_DAYS-1));
      });
      if(!Array.isArray(it.log)) it.log = [];
      it.log.forEach(l=>{ if(!l.id) l.id=uid(); if(typeof l.text!=='string') l.text=''; if(!l.at) l.at=it.createdAt||new Date().toISOString(); });
    }
  });
  st.settings = st.settings || {};
  if(!Array.isArray(st.settings.nowPins)) st.settings.nowPins=[];
  /* No cap. Now once had three slots and this line still enforced them, so a
     fourth pin survived until the next load and then vanished — which on two
     devices reads as "my phone's Now list is wrong": the one that reloaded
     showed three, the one still open showed four. The view says three is what
     usually survives a real day; it is advice, not a limit. */
  if(!st.settings.themeMode) st.settings.themeMode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  if(typeof st.settings.numberLists!=='boolean') st.settings.numberLists = false;
  // Shown beside money. Display only — the app never converts between currencies.
  if(typeof st.settings.currency!=='string') st.settings.currency = '';
  if(!Array.isArray(st.lifeAreas)) st.lifeAreas = [];
  st.lifeAreas.forEach(a=>{
    if(!Array.isArray(a.framework)) a.framework=[];
    if(!Array.isArray(a.routines)) a.routines=[];
    if(!Array.isArray(a.open_items)) a.open_items=[];
    if(!a.purpose) a.purpose='';
    if(!a.guiding_principle) a.guiding_principle='';
  });
  st.habits = Array.isArray(st.habits) ? st.habits : [];
  st.habits.forEach(h=>{
    if(!h.id) h.id=uid(); if(!h.log) h.log={}; if(!h.emoji) h.emoji='✅'; if(h.category===undefined) h.category=null;
    if(typeof h.active!=='boolean') h.active = true;   // retired habits stay for their history
    if(!h.frequency || !h.frequency.type) h.frequency={type:'daily'};
    if(h.frequency.type==='days' && !Array.isArray(h.frequency.days)) h.frequency.days=[0,1,2,3,4,5,6];
    if(h.frequency.type==='weekly' && !h.frequency.target) h.frequency.target=3;
    if(h.frequency.type==='monthly' && !h.frequency.target) h.frequency.target=1;
  });
  // Recurring task series. The templates live here; their instances are plain items.
  st.recurring = Array.isArray(st.recurring) ? st.recurring : [];
  st.recurring.forEach(r=>{
    if(!r.id) r.id=uid();
    if(!RECUR_TYPES[r.type]) r.type='weekly';
    if(!(r.interval>=1)) r.interval=1;
    if(!Array.isArray(r.days) || !r.days.length) r.days=[0];    if(!(r.dayOfMonth>=1 && r.dayOfMonth<=31)) r.dayOfMonth=1;
    if(!(r.month>=0 && r.month<=11)) r.month=0;
    if(!r.anchor) r.anchor = (r.createdAt||'').slice(0,10) || todayISO();
    if(typeof r.paused!=='boolean') r.paused=false;
    if(typeof r.isChore!=='boolean') r.isChore=false;
    if(!EFFORT[r.effort]) r.effort=DEFAULT_EFFORT;
  });
  // Review steps the owner added themselves, and built-in steps they have hidden.
  st.reviewCustom = st.reviewCustom || {};
  st.reviewHidden = st.reviewHidden || {};
  ['daily','weekly','monthly'].forEach(k=>{
    if(!Array.isArray(st.reviewCustom[k])) st.reviewCustom[k]=[];
    st.reviewCustom[k].forEach(x=>{ if(!x.id) x.id=uid(); });
    if(!Array.isArray(st.reviewHidden[k])) st.reviewHidden[k]=[];
  });
  // Review ticks live outside gamification on purpose: they never award XP.
  st.reviews = st.reviews || {};
  ['daily','weekly','monthly'].forEach(k=>{ if(typeof st.reviews[k]!=='object' || !st.reviews[k]) st.reviews[k] = {}; });
  st.gamification = st.gamification || {};
  if(typeof st.gamification.xp!=='number') st.gamification.xp=0;
  if(!Array.isArray(st.gamification.habitBonusDates)) st.gamification.habitBonusDates=[];
  raw.state = st;
  if(!raw.version) raw.version=1;
  return raw;
}

function migrateAreasIfNeeded(){
  if(state.areasMigratedV2) return Promise.resolve();
  if(typeof window.SB_LB==='undefined') return Promise.resolve();
  return window.SB_LB.load().then(()=>{
    const binderAreas = window.SB_LB.areas();
    if(Array.isArray(binderAreas) && binderAreas.length){
      state.state.lifeAreas = JSON.parse(JSON.stringify(binderAreas));
    }
    // Only rename the six legacy categories this map knows about. Anything else is
    // already a current domain name and must be left alone — the old `|| 'Inbox'`
    // fallback swept every modern category into the Inbox the first time this ran.
    items().forEach(it=>{
      if(it.category && AREA_MIGRATION_MAP[it.category]){
        it.category = AREA_MIGRATION_MAP[it.category];
      }
    });
    state.areasMigratedV2 = true;
    persist();
  }).catch(()=>{});
}

/* =========================================================
   Cross-device sync

   The old rule was: pull the cloud copy only on a device's very first visit,
   and on every visit after that push whatever is in this browser's storage.
   A phone opened once in August therefore showed August forever — and worse,
   uploaded August over the laptop's September. Whichever device was opened
   last owned the data.

   Now every device reads the cloud on every boot and the newer copy wins, in
   both directions, with a live listener so a change made on the phone shows up
   on the laptop without a reload.
   ========================================================= */
const DEVICE_KEY = 'sb-device-v1';
const BACKUP_KEY = STATE_KEY + '-backup';
const THEME_KEY = 'sb-theme-v1';

/* Appearance belongs to the screen you are looking at, not to the account:
   dark on the phone at night and light on the laptop by day is one person with
   two preferences, not a conflict to resolve. The synced value is used once, as
   the seed for a device that has never chosen, so nobody's current theme flips
   the first time they open this version. */
function themeMode(){
  let t=null; try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  if(t==='dark' || t==='light') return t;
  const inherited = state && state.state && state.state.settings && state.state.settings.themeMode;
  if(inherited==='dark' || inherited==='light') return inherited;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function setThemeMode(mode){ try{ localStorage.setItem(THEME_KEY, mode); }catch(e){} }

function deviceName(){
  const ua = (typeof navigator!=='undefined' && navigator.userAgent) || '';
  if(/iPad/i.test(ua)) return 'iPad';
  if(/iPhone/i.test(ua)) return 'iPhone';
  if(/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'Android phone' : 'Android tablet';
  if(/Macintosh|Mac OS X/i.test(ua)) return 'Mac';
  if(/Windows/i.test(ua)) return 'Windows PC';
  return 'This device';
}
const DEVICE_NAME = deviceName();
const DEVICE_ID = (function(){
  let id=null; try{ id = localStorage.getItem(DEVICE_KEY); }catch(e){}
  if(!id){ id = DEVICE_NAME.replace(/\s+/g,'-') + '-' + uid().slice(0,6);
    try{ localStorage.setItem(DEVICE_KEY, id); }catch(e){} }
  return id;
})();

/* The last moment real work happened inside a snapshot. This is the honest
   answer to "which of these two copies is further along", and the only answer
   available for data saved before this version started stamping its saves. */
function lastActivityAt(root){
  const st = root && root.state;
  if(!st) return '';
  let max = '';
  const bump = v => { if(typeof v==='string' && v>max) max = v; };
  (st.items||[]).forEach(it=>{
    bump(it.createdAt); bump(it.completedAt);
    (it.subtasks||[]).forEach(sx=>bump(sx.doneAt));
  });
  (st.habits||[]).forEach(h=>Object.keys(h.log||{}).forEach(bump));
  (st.recurring||[]).forEach(r=>bump(r.createdAt));
  return max;
}

function freshness(root){
  const m = root && root.meta;
  return { savedAt: (m && m.savedAt) || '', activity: lastActivityAt(root) };
}

/* Stamped saves are compared directly. A copy written before this version has
   no stamp, so it is judged by its own newest activity instead. On a true tie
   nothing is adopted: what is in front of you stays. */
function cloudIsNewer(localRoot, cloudRoot){
  const mine = freshness(localRoot), theirs = freshness(cloudRoot);
  if(mine.savedAt && theirs.savedAt) return theirs.savedAt > mine.savedAt;
  return theirs.activity > mine.activity;
}

/* Timestamps alone are not enough. A phone that has not synced since August can
   be opened today and tick one thing, which makes it the most recently touched
   copy while still being months behind — and a rule that only read the clock
   would let it roll the laptop back.

   XP is the one number in this app that only ever goes up: it is granted on
   completion and never taken away, and the only thing that zeroes it is a reset,
   which clears the cloud copy too. So less XP means strictly further behind,
   whatever the clock says. */
function knowsLess(candidate, against){
  const a = ((candidate && candidate.state) || {}).gamification || {};
  const b = ((against && against.state) || {}).gamification || {};
  return (a.xp||0) < (b.xp||0);
}

function pickCloud(localRoot, cloudRoot){
  if(knowsLess(cloudRoot, localRoot)) return false;   // the cloud is behind — keep ours
  if(knowsLess(localRoot, cloudRoot)) return true;    // we are behind — take theirs
  return cloudIsNewer(localRoot, cloudRoot);          // level pegging: newer wins
}

function adoptCloud(cloudRoot, note){
  // Keep the copy being replaced. Nothing in the app reads it, but it means a
  // bad merge is recoverable rather than gone.
  try{ localStorage.setItem(BACKUP_KEY, localStorage.getItem(STATE_KEY)||''); }catch(e){}
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(cloudRoot)); }catch(e){}
  state = loadRoot();
  // Materialising recurring tasks re-stamps the save as ours, so when it creates
  // anything the cloud needs it too; when it creates nothing the adopted stamp is
  // left alone and this device does not look newer than what it just accepted.
  const made = catchUpRecurring();
  if(made && made.created) cloudPushDebounced();
  if(Array.isArray(state.state.settings.inactiveProjects)) inactiveProjects = state.state.settings.inactiveProjects;
  sync.lastPull = new Date().toISOString();
  sync.from = (cloudRoot.meta && cloudRoot.meta.name) || 'another device';
  render();
  pushToast(note || `↻ Updated from your ${sync.from}`);
}

// What the Settings panel reports, so "is this thing actually syncing?" has an answer.
const sync = { lastPull:null, lastPush:null, from:null, error:null, watching:false };

const persistLocal = ()=>{
  // Every save carries who saved it and when, which is what lets two devices
  // agree on which copy is newer without guessing.
  state.meta = { savedAt: new Date().toISOString(), device: DEVICE_ID, name: DEVICE_NAME };
  try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){}
};
const cloudPushDebounced = debounce(()=>{
  if(typeof db==='undefined'){ sync.error='offline'; pushToast('⚠️ Could not reach cloud — using local data'); return; }
  try{
    db.collection('snapshots').doc('primary').set({
      data: state, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{ sync.lastPush = new Date().toISOString(); sync.error = null; })
      .catch(()=>{ sync.error='push'; pushToast('⚠️ Sync failed — changes saved locally only'); });
  }catch(e){}
}, 1200);

function persist(){ persistLocal(); cloudPushDebounced(); render(); }

/* Life domains also have a dedicated shared Life Binder document. Save both
   cloud records whenever domains change, so the binder watcher cannot restore
   an older list over a newly edited domain. */
function persistLifeAreas(){
  if(window.SB_LB && typeof window.SB_LB.save === 'function'){
    window.SB_LB.save(JSON.parse(JSON.stringify(state.state.lifeAreas)));
  }
  persist();
}

/* Which projects are archived used to live in its own cloud document, reconciled
   by its own rule ("whatever is in the cloud wins at boot"). Two documents meant
   two chances to disagree, and the Now pipeline reads this list — so a device
   whose archive list was behind showed a different Up next than the one beside
   it even when everything else matched. It now rides the one snapshot that is
   already reconciled properly. */
function loadInactive(){
  let ids; try{ ids=JSON.parse(localStorage.getItem(INACTIVE_KEY)||'[]'); }catch(e){ ids=[]; }
  return Array.isArray(ids)?ids:[];
}
function saveInactive(){
  state.state.settings.inactiveProjects = inactiveProjects;
  persist();
}
function toggleInactive(projectId){
  const i=inactiveProjects.indexOf(projectId);
  if(i>=0) inactiveProjects.splice(i,1); else inactiveProjects.push(projectId);
  saveInactive();
}

/* Read the archive list out of the snapshot, migrating it in the first time from
   wherever it used to live. */
function settleArchived(){
  const st = state.state.settings;
  if(Array.isArray(st.inactiveProjects)){ inactiveProjects = st.inactiveProjects; render(); return Promise.resolve(); }
  const local = loadInactive();
  const take = list => { inactiveProjects = list; st.inactiveProjects = list; persist(); };
  if(typeof db==='undefined'){ take(local); return Promise.resolve(); }
  return db.collection('snapshots').doc('project-flags').get()
    .then(snap=>{
      const cloud = snap.exists && snap.data().data && snap.data().data.inactive;
      take(Array.isArray(cloud) ? cloud : local);
    })
    .catch(()=>take(local));
}

function resetApp(){
  if(typeof db==='undefined'){ pushToast('⚠️ Could not reach cloud — using local data'); return; }
  Promise.all([
    db.collection('snapshots').doc('primary').delete(),
    db.collection('snapshots').doc('project-flags').delete(),
    window.SB_LB.clear()
  ]).catch(()=>{ pushToast('⚠️ Cloud wipe failed — old data may still exist in the cloud'); })
  .finally(()=>{
    try{ localStorage.removeItem(STATE_KEY); }catch(e){}
    try{ localStorage.removeItem(INACTIVE_KEY); }catch(e){}
    state = defaultRoot();
    // Put the Life Binder back straight away. SB_LB.clear() above only drops the
    // stored copy; areas() falls through to LB_SEED, which is the binder's baseline
    // content. Without this the Binder tab sits empty until some later boot happens
    // to run the area migration — which reads as "the reset deleted my binder".
    try{
      if(typeof window.SB_LB!=='undefined'){
        const seed = window.SB_LB.areas();
        if(Array.isArray(seed) && seed.length) state.state.lifeAreas = JSON.parse(JSON.stringify(seed));
      }
    }catch(e){}
    inactiveProjects = [];
    ui.view = 'now'; ui.processInbox = false;
    closeModal();
    render();
    pushToast('App reset — all local data cleared');
  });
}

/* =========================================================
   Gamification: XP / Level / Streak
   ========================================================= */
function levelInfo(xp){
  let level=1, into=xp, need=100;
  while(into>=need){ into-=need; level++; need=100+(level-1)*40; }
  return {level, into, need};
}
function grantXP(amount, label){
  const g = state.state.gamification;
  const before = levelInfo(g.xp);
  g.xp += amount;
  const after = levelInfo(g.xp);
  pushToast(`+${amount} XP · ${label}`);
  if(after.level>before.level) pushToast(`🎉 Level up! You're now Level ${after.level}`, true);
}
function activeDateSet(){
  const set = new Set();
  state.state.items.forEach(it=>{ if(it.status==='done' && it.completedAt){ set.add(it.completedAt.slice(0,10)); } });
  state.state.habits.forEach(h=>{ Object.keys(h.log).forEach(d=>{ if(h.log[d]) set.add(d); }); });
  return set;
}
function dayStreak(){
  const set = activeDateSet();
  let cursor = new Date(); let streak=0; let first=true;
  while(true){
    const key = fmtISO(cursor);
    if(set.has(key)) streak++;
    else if(!first) break;
    first=false;
    cursor = addDays(cursor,-1);
    if(streak>3650) break;
  }
  return streak;
}

/* =========================================================
   Toasts
   ========================================================= */
function pushToast(msg, big){
  const stack = qs('#toast-stack');
  const el = document.createElement('div');
  el.className = 'toast'+(big?' level':'');
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(),220); }, big?3200:2200);
}
