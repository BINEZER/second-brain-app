}

/* ---------- INBOX ---------- */
/* Every open task, wherever it lives — the Inbox is the one place to see them all.
   "Unfiled" is the classic inbox and is what Process Inbox works through. */
function allOpenTasks(){ return items().filter(i=>i.type==='task' && i.status==='open'); }
/* Scopes are filters, not a partition — Unfiled is deliberately a subset of
   Standalone. "Standalone" means exactly what the chip on each row means: not
   part of a project. It used to also require a domain, so a freshly captured
   task was chipped "standalone" on its own row and then missing from the
   Standalone scope, which is the one thing a filter must never do. */
function inboxScoped(){
  const t = allOpenTasks();
  // 'unfiled' is kept as an alias so an old saved view still resolves.
  if(ui.inboxScope==='project')     return t.filter(i=>i.projectId);
  if(ui.inboxScope==='standalone' || ui.inboxScope==='unfiled') return t.filter(i=>!i.projectId);
  if(ui.inboxScope==='recurring')   return t.filter(i=>i.seriesId);
  return t;
}

/* Exactly the rows the Inbox is showing, scope + filters + search applied.
   Rendering and reordering both call this, so row 3 on screen is row 3 here. */
/* Everything the Inbox is showing except the date filter. Kept separate so the
   date chips can count what each one would actually reveal, rather than counting
   against a list the date filter has already narrowed. */
function inboxBaseList(){
  let list = inboxScoped();
  if(ui.inboxAssigneeFilter!=='all') list = list.filter(i=>i.assignee===ui.inboxAssigneeFilter);
  if(ui.inboxProject!=='all') list = list.filter(i=>i.projectId===ui.inboxProject);
  if(ui.inboxCategory!=='all') list = list.filter(i=>i.category===ui.inboxCategory);
  if(ui.inboxSearch) list = list.filter(i=>matchesSearch(i.title, ui.inboxSearch)
    || matchesSearch(i.assignee, ui.inboxSearch)
    || matchesSearch(i.category, ui.inboxSearch)
    || (i.projectId && matchesSearch((byId(i.projectId)||{}).title, ui.inboxSearch)));
  return list;
}

/* Due-date buckets. "Next 7 days" includes today, so Today is a subset of it —
   they answer different questions and overlapping is the honest behaviour. */
const INBOX_DATES = {
  all:      { label:'Any date',    match: () => true },
  overdue:  { label:'Overdue',     match: it => !!it.dueDate && it.dueDate < todayISO() },
  today:    { label:'Today',       match: it => it.dueDate === todayISO() },
  week:     { label:'Next 7 days', match: it => !!it.dueDate && it.dueDate >= todayISO() && it.dueDate <= fmtISO(addDays(new Date(),7)) },
  nodate:   { label:'No date',     match: it => !it.dueDate }
};
function inboxDateKey(){ return INBOX_DATES[ui.inboxDate] ? ui.inboxDate : 'all'; }

function inboxViewList(){
  let list = inboxBaseList();
  const key = inboxDateKey();
  if(key!=='all') list = list.filter(INBOX_DATES[key].match);
  // Anything without a domain sorts first — that is the work the Inbox is for.
  // A stable partition, so manual ordering inside each half is preserved.
  const needsDomain = list.filter(i=>i.category==='Inbox');
  return needsDomain.length ? needsDomain.concat(list.filter(i=>i.category!=='Inbox')) : list;
}

  const unfiled = inboxItems();

  // Only domains that actually hold something in this scope, with their counts —

  inboxScoped().forEach(i=>{ domCounts[i.category] = (domCounts[i.category]||0)+1; });
  if(ui.inboxCategory!=='all' && !domCounts[ui.inboxCategory]) domCounts[ui.inboxCategory] = 0;
  const inboxDomains = Object.keys(domCounts).sort((a,b)=>a==='Inbox'?-1:b==='Inbox'?1:a.localeCompare(b)).map(k=>[k,domCounts[k]]);
  const projList = projects();
  const assignees = Array.from(new Set(allOpenTasks().filter(i=>i.assignee).map(i=>i.assignee))).sort();
  const list = inboxViewList();
  return `<div class="view">

        ].map(([k,label,n,tip])=>`<button class="chip ${ui.inboxScope===k?'on':''}" data-action="inbox-scope" data-scope="${k}" title="${esc(tip)}">${label} (${n})</button>`).join('')}

    <div class="filter-bar">

      ${inboxDomains.length? `<select data-action-change="inbox-category" style="font-size:13px;padding:7px 9px;border-radius:10px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text)">

        ? `<button class="btn btn-sm btn-ghost" data-action="clear-inbox-filters">Clear filters</button>` : ''}
    </div>
    <div class="chip-row">
      ${Object.keys(INBOX_DATES).map(k=>{
        const n = k==='all' ? dateBase.length : dateBase.filter(INBOX_DATES[k].match).length;

/* ---------- PROCESS INBOX ---------- */
/* What is still to be decided in this pass. Skipping sets an item aside rather
   than stepping past it: the old skip advanced an index modulo the list length,
   so with one item left it landed back on the same card and looked broken, and
   with several it cycled forever and never finished. */
function triageQueue(){
  const set = new Set(ui.triageSkipped);
  return inboxItems().filter(i=>!set.has(i.id));
}
function triageCurrent(){
  const q = triageQueue();
  if(!q.length) return null;
  if(ui.triageIndex >= q.length) ui.triageIndex = 0;
  return q[ui.triageIndex];
}

function renderProcessInbox(){
  const list = triageQueue();
  if(!list.length){
    const left = ui.triageSkipped.length;
    return `<div class="view"><div class="triage-wrap"><div class="triage-card">
      <div class="triage-title">${left? 'Done for now' : 'Inbox zero 🎉'}</div>
      <div class="view-sub" style="margin-bottom:16px">${left
        ? `${left} item${left===1?'':'s'} left unfiled — ${left===1?'it stays in your Inbox as a standalone task':'they stay in your Inbox as standalone tasks'}.`
        : 'Nothing left to process.'}</div>
      <button class="btn btn-primary" data-action="exit-triage">Done</button>
    </div></div></div>`;
  }
  if(ui.triageIndex>=list.length) ui.triageIndex=0;
  const it = list[ui.triageIndex];
  const areas = state.state.lifeAreas;
  // Remember the last domain filed to — consecutive items usually belong together.
  const lastCat = areas.some(a=>a.name===ui.triageLastCat) ? ui.triageLastCat : (areas[0]&&areas[0].name);
  return `<div class="view"><div class="triage-wrap">
    <div class="triage-progress">Processing ${ui.triageIndex+1} of ${list.length}${ui.triageSkipped.length? ` · ${ui.triageSkipped.length} skipped` : ''}</div>
    <div class="triage-card">
      <div class="triage-title">${esc(it.title)}</div>
      ${areas.length? `<div class="field" style="margin:14px 0 4px;text-align:left">
        <label>Domain for this task</label>
        <select id="triage-cat" data-action-change="triage-cat-changed">${areas.map(a=>`<option value="${esc(a.name)}" ${a.name===lastCat?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
      </div>` : `<div class="view-sub" style="margin:12px 0">No life areas yet — add one under Manage domains on the Projects tab, then filing will work.</div>`}
      <div class="field" style="margin:0 0 6px;text-align:left">
        <label>Due date (optional)</label>
        <input id="triage-due" type="date" value="${esc(it.dueDate||'')}" data-action-change="triage-due-changed"/>
        <div class="view-sub" style="margin:4px 0 0">Saved as you set it. Nothing moves on until you press Keep or Skip.</div>
      </div>
      <div class="triage-actions">
        <button class="btn" data-action="triage-keep-task" ${areas.length?'':'disabled'} title="Keep this task and file it in ${esc(lastCat||'the chosen domain')}">✅ Keep</button>
        <button class="btn" data-action="triage-to-project" ${areas.length?'':'disabled'}>📁 Turn into a project</button>
        <button class="btn btn-danger" data-action="triage-delete">🗑 Delete</button>
        <button class="btn btn-ghost full" data-action="triage-skip" title="Leaves it unfiled in your Inbox as a standalone task">Skip — leave it standalone →</button>
        <button class="btn btn-ghost full" data-action="exit-triage">Exit processing</button>
      </div>
    </div>
  </div></div>`;
}

  bits.push(`<b>${port.weightedPct==null?'—':port.weightedPct+'%'}</b> complete across ${port.plannedCount} measurable project${port.plannedCount===1?'':'s'}`);

/* ---------- REVIEW ---------- */
function reviewPeriodKey(kind){
  if(kind==='daily')   return todayISO();
  if(kind==='monthly') return todayISO().slice(0,7);      // YYYY-MM
  return fmtISO(startOfWeek(new Date()));                  // Monday of this week
}
function reviewTicks(kind){
  const store = state.state.reviews[kind] || (state.state.reviews[kind] = {});
  const key = reviewPeriodKey(kind);
  // Only the current period is kept — a new day or week starts clean.
  if(store.key !== key){ store.key = key; store.done = {}; }
  if(!store.done) store.done = {};
  return store;
}
function renderReviewList(kind){
  const list = REVIEW_LISTS[kind];
  const store = reviewTicks(kind);
  const sections = reviewSections(kind);
  const hidden = reviewHiddenSteps(kind);
  const all = reviewSteps(kind);
  const doneCount = all.filter(x=>store.done[x.key]).length;
  const pct = all.length? Math.round(doneCount/all.length*100) : 0;
  return `<div class="card" style="margin-bottom:20px">
    <div class="rv-head">
      <div>
        <div style="font-weight:600;font-size:15px">${esc(list.label)}</div>
        <div class="view-sub" style="margin-top:2px">${esc(list.blurb)} ${esc(list.resets.charAt(0).toUpperCase()+list.resets.slice(1))}.</div>

/* ---------- REPORTS ---------- */
function completedItems(){ return items().filter(i=>i.status==='done' && i.completedAt); }

function fmtHistoryDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function inHistoryRange(it){
  const d = it.completedAt.slice(0,10);
  const today = todayISO();
  if(ui.historyRange==='month'){ const first = today.slice(0,8)+'01'; return d>=first && d<=today; }
  if(ui.historyRange==='30d'){ return d>=fmtISO(addDays(new Date(),-30)) && d<=today; }
  if(ui.historyRange==='custom'){
    if(ui.historyCustomFrom && d<ui.historyCustomFrom) return false;
    if(ui.historyCustomTo && d>ui.historyCustomTo) return false;
    return true;
  }
  return true;
}

function habitConsistency(habit, days){
  days = days||30;
  const f = habit.frequency || {type:'daily'};
  if(f.type==='weekly' || f.type==='monthly'){
    const target = f.target||1;
    let done=0, cursor=new Date();
    for(let i=0;i<days;i++){ if(habit.log[fmtISO(cursor)]) done++; cursor=addDays(cursor,-1); }
    const expected = target * (days / (f.type==='monthly' ? 30.44 : 7));
    return expected>0 ? Math.min(100, Math.round(done/expected*100)) : 0;
  }
  let done=0, required=0, cursor=new Date();
  for(let i=0;i<days;i++){
    const key=fmtISO(cursor);
    if(isHabitRequiredOn(habit,key)){ required++; if(habit.log[key]) done++; }
    cursor=addDays(cursor,-1);
  }
  return required? Math.round(done/required*100) : 0;
}

/* =========================================================

let charts = {};
function destroyCharts(){
  Object.values(charts).forEach(c=>{ try{ c.destroy(); }catch(e){} });
  charts = {};
}
function chartTextColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--c-text-secondary')||'').trim() || '#475569'; }
function chartGridColor(){ return (getComputedStyle(document.documentElement).getPropertyValue('--c-border')||'').trim() || '#E2E8F0'; }
function barChartOptions(horizontal){
  const tc = chartTextColor(), gc = chartGridColor();
  const valueAxis = { min:0, max:100, ticks:{ color:tc }, grid:{ color:gc } };
  const countAxis = { beginAtZero:true, ticks:{ color:tc, precision:0 }, grid:{ color:gc } };
  const labelAxis = { ticks:{ color:tc }, grid:{ display:false } };
  return {
    indexAxis: horizontal? 'y':'x',
    responsive:true, maintainAspectRatio:false,
    scales: horizontal? { x:valueAxis, y:labelAxis } : { y:countAxis, x:labelAxis },
    plugins:{ legend:{ display:false } }
  };
}
function areaTaskPct(a){
  const areaItems = items().filter(i=>i.category===a.name && (i.type==='task'||i.type==='project'));
  const done = areaItems.filter(i=>i.status==='done').length;
  return areaItems.length? Math.round(done/areaItems.length*100) : 0;
}
function projectPct(p){ const st = projectStats(p); return st.pct==null ? 0 : st.pct; }
const HEALTH_BAR_COLOR = { done:'#10B981', ahead:'#10B981', ontrack:'#06B6D4', nodate:'#94A3B8', notstarted:'#94A3B8', risk:'#F59E0B', behind:'#F43F5E', overdue:'#F43F5E', noplan:'#CBD5E1' };
/* Chart.js comes from a CDN — render no card at all rather than an empty box when it is unavailable. */
function chartsAvailable(){ return typeof Chart!=='undefined'; }
function chartCard(id, height, extraStyle){

  return `<div class="card" style="margin-bottom:18px;height:${height}px${extraStyle?';'+extraStyle:''}"><canvas id="${id}"></canvas></div>`;

  return weekOffset===0 ? `This week (${label})` : label;
}

function openModal(html){
  qs('#modal-root').innerHTML = `<div class="modal-overlay" data-action="close-modal"><div class="modal">${html}</div></div>`;
}
let habitTrendChart = null;
let projectTrendChart = null;
function closeModal(){
  if(habitTrendChart){ try{ habitTrendChart.destroy(); }catch(e){} habitTrendChart=null; }
  if(projectTrendChart){ try{ projectTrendChart.destroy(); }catch(e){} projectTrendChart=null; }
  qs('#modal-root').innerHTML='';
}

/* The list behind a roll-up number. `area` narrows it to one domain, which is
   what a click on a By-domain row does. */
function modalRollupDrill(key, area){
  const d = ROLLUP_DRILLS[key] || ROLLUP_DRILLS.all;
  const scoped = reportProjectList().filter(p=>!area || (p.category||'Uncategorised')===area);
  const port = portfolioStats(scoped);
  const list = d.pick(port.rows).slice().sort(d.sort);

  const row = r => `<div class="project-card" style="margin-bottom:8px">
    <div class="project-head" data-action="open-project-report" data-id="${r.p.id}">
      <div class="item-main">
        <div class="project-title">${esc(r.p.title)}</div>
        <div class="item-meta">
          <span class="chip" style="${catStyle(r.p.category)}">${esc(r.p.category)}</span>
          ${healthChip(r.st)}
          ${stalledChip(r.st)}
          <span>${esc(d.note(r.st, r.p))}</span>
          ${r.p.dueDate && !d.hideDue? `<span>${fmtDue(r.p.dueDate)}</span>`:''}
        </div>
        ${progressBar(r.st)}
      </div>
    </div>
  </div>`;

  openModal(`
    <h3>${esc(d.label)}${area? ' — '+esc(area):''} <span style="font-family:'JetBrains Mono',monospace">(${list.length})</span></h3>
    <div class="view-sub" style="margin-bottom:14px">${esc(d.blurb(port))}</div>
    ${list.length ? list.map(row).join('') : `<div class="empty">${esc(d.empty)}</div>`}
    <div class="view-sub" style="margin-top:12px">Click any project for its full report.</div>
    <div class="modal-actions">
      ${key!=='all' || area ? `<button class="btn" data-action="rollup-drill" data-key="all">All projects</button>` : ''}
      <button class="btn btn-primary" data-action="close-modal">Close</button>
    </div>`);
}

function readHabitFrequencyFromForm(){
  const type = qs('#hb-freq-type').value;
  if(type==='days'){
    const days = qsa('[data-action="toggle-hb-day"].on').map(b=>+b.getAttribute('data-day'));
    return {type:'days', days: days.length?days:[0,1,2,3,4,5,6]};
  }
  if(type==='weekly' || type==='monthly'){
    const cap = type==='monthly' ? 31 : 7;
    const target = Math.max(1, Math.min(cap, parseInt(qs('#hb-freq-target').value,10) || (type==='monthly'?1:3)));
    return {type, target};
  }
  return {type:'daily'};
}

function renameLifeArea(oldName, newName){
  newName = (newName||'').trim();
  if(!newName || newName===oldName) return false;
  if(state.state.lifeAreas.some(a=>a.name===newName)) return false;
  const a = state.state.lifeAreas.find(x=>x.name===oldName);
  if(!a) return false;
  a.name = newName;
  items().forEach(i=>{ if(i.category===oldName) i.category = newName; });
  state.state.habits.forEach(h=>{ if(h.category===oldName) h.category = newName; });
  if(ui.projectFilter===oldName) ui.projectFilter = newName;
  return true;
}
function mergeLifeArea(fromName, intoName){
  if(!fromName || !intoName || fromName===intoName) return false;
  if(!state.state.lifeAreas.some(a=>a.name===intoName)) return false;
  items().forEach(i=>{ if(i.category===fromName) i.category = intoName; });
  state.state.habits.forEach(h=>{ if(h.category===fromName) h.category = intoName; });
  const idx = state.state.lifeAreas.findIndex(a=>a.name===fromName);
  if(idx>=0) state.state.lifeAreas.splice(idx,1);
  if(ui.projectFilter===fromName) ui.projectFilter = intoName;
  return true;
}

/* =========================================================
   Bulk import — paste a JSON block to create projects, their
   milestones and tasks, habits and any life areas they need.

   Purely additive: nothing is ever deleted or overwritten. A project
   whose title already exists is skipped and reported, so re-importing
   the same block twice is safe.
   ========================================================= */
const IMPORT_PRIORITIES = ['low','medium','high'];

function planImport(text){
  let raw;
  try{ raw = JSON.parse(text); }
  catch(e){ return {error:'That is not valid JSON — copy the whole block including the outer { and }.'}; }
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) return {error:'Expected a JSON object with "projects" and/or "habits".'};

  const plan = {areas:[], projects:[], habits:[], skippedProjects:[], skippedHabits:[], warnings:[]};
  const haveArea = new Set(state.state.lifeAreas.map(a=>a.name));
  const wantArea = n=>{
    n = String(n||'').trim();
    if(!n || n==='Inbox') return 'Inbox';
    if(!haveArea.has(n) && plan.areas.indexOf(n)<0) plan.areas.push(n);
    return n;
  };
  (Array.isArray(raw.lifeAreas) ? raw.lifeAreas : []).forEach(wantArea);

  const effortOf = v => EFFORT[v] ? v : DEFAULT_EFFORT;
  const dateOf = v => (typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : null;
  const priorityOf = v => IMPORT_PRIORITIES.indexOf(v)>=0 ? v : 'medium';

  const takenProject = new Set(projects().map(p=>p.title.trim().toLowerCase()));
  (Array.isArray(raw.projects) ? raw.projects : []).forEach(p=>{
    if(!p || typeof p!=='object') return;
    const title = String(p.title||'').trim();
    if(!title){ plan.warnings.push('A project with no title was skipped.'); return; }
    if(takenProject.has(title.toLowerCase())){ plan.skippedProjects.push(title); return; }
    takenProject.add(title.toLowerCase());
    const category = wantArea(p.category);
    const start = dateOf(p.startDate), due = dateOf(p.dueDate);
    if(start && due && start > due){
      plan.warnings.push(`"${title}": start date is after the due date — both dropped.`);
    }
    plan.projects.push({
      title, category,
      priority: priorityOf(p.priority),
      startDate: (start && due && start > due) ? null : start,
      dueDate: (start && due && start > due) ? null : due,
      assignee: (typeof p.assignee==='string' && p.assignee.trim()) ? p.assignee.trim() : null,
      starred: !!p.starred,
      archived: !!p.archived,
      milestones: (Array.isArray(p.milestones)?p.milestones:[]).map(m=>({
        title: String((m&&m.title)||'').trim(), effort: effortOf(m&&m.effort)
      })).filter(m=>m.title),
      tasks: (Array.isArray(p.tasks)?p.tasks:[]).map(t=>({
        title: String((t&&t.title)||'').trim(), effort: effortOf(t&&t.effort),
        dueDate: dateOf(t&&t.dueDate), priority: priorityOf(t&&t.priority),
        assignee: (t && typeof t.assignee==='string' && t.assignee.trim()) ? t.assignee.trim() : null
      })).filter(t=>t.title)
    });
  });

  const takenHabit = new Set(state.state.habits.map(h=>h.name.trim().toLowerCase()));
  (Array.isArray(raw.habits) ? raw.habits : []).forEach(h=>{
    if(!h || typeof h!=='object') return;
    const name = String(h.name||'').trim();
    if(!name){ plan.warnings.push('A habit with no name was skipped.'); return; }
    if(takenHabit.has(name.toLowerCase())){ plan.skippedHabits.push(name); return; }
    takenHabit.add(name.toLowerCase());
    let f = h.frequency;
    if(!f || typeof f!=='object') f = {type:'daily'};
    if(f.type==='days'){ f = {type:'days', days: Array.isArray(f.days)? f.days.filter(d=>d>=0&&d<=6) : [0,1,2,3,4,5,6]}; }
    else if(f.type==='weekly'){ f = {type:'weekly', target: Math.max(1, Math.min(7, parseInt(f.target,10)||3))}; }
    else f = {type:'daily'};
    plan.habits.push({
      name, emoji: String(h.emoji||'✅').slice(0,4),
      category: h.category ? wantArea(h.category) : null,
      frequency: f
    });
  });

  const total = plan.areas.length + plan.projects.length + plan.habits.length;
  if(!total && !plan.skippedProjects.length && !plan.skippedHabits.length){
    return {error:'Nothing to import — the block contained no projects, habits or life areas.'};
  }
  return plan;
}

function applyImport(plan){
  plan.areas.forEach(addLifeArea);
  let steps = 0, archivedAny = false;
  plan.projects.forEach(p=>{
    const proj = newItem({
      type:'project', title:p.title, category:p.category, priority:p.priority,
      startDate:p.startDate, dueDate:p.dueDate, assignee:p.assignee, isStarred:p.starred,
      subtasks: p.milestones.map(m=>({id:uid(), title:m.title, done:false, xpAwarded:false, effort:m.effort, doneAt:null}))
    });
    steps += p.milestones.length;
    p.tasks.forEach(t=>{
      newItem({ type:'task', title:t.title, projectId:proj.id, category:p.category,
        priority:t.priority, dueDate:t.dueDate, assignee:t.assignee, effort:t.effort });
      steps++;
    });
    if(p.archived && inactiveProjects.indexOf(proj.id)<0){ inactiveProjects.push(proj.id); archivedAny = true; }
  });
  plan.habits.forEach(h=>{
    state.state.habits.push({ id:uid(), name:h.name, emoji:h.emoji, category:h.category, log:{}, frequency:h.frequency, active:true });
  });
  if(archivedAny) saveInactive();
  persist();
  return {projects:plan.projects.length, steps, habits:plan.habits.length, areas:plan.areas.length};
}

function renderImportPlan(){
  const plan = ui.importPlan;
  if(!plan) return '';
  if(plan.error) return `<div class="import-plan import-err"><b>Could not read that.</b><br>${esc(plan.error)}</div>`;
  const li = [];
  if(plan.areas.length) li.push(`<li><b>${plan.areas.length}</b> new life area${plan.areas.length===1?'':'s'}: ${plan.areas.map(esc).join(', ')}</li>`);
  if(plan.projects.length){
    const steps = plan.projects.reduce((a,p)=>a+p.milestones.length+p.tasks.length, 0);
    const pts = plan.projects.reduce((a,p)=>a
      + p.milestones.reduce((b,m)=>b+EFFORT[m.effort].weight, 0)
      + p.tasks.reduce((b,t)=>b+EFFORT[t.effort].weight, 0), 0);
    li.push(`<li><b>${plan.projects.length}</b> project${plan.projects.length===1?'':'s'} with <b>${steps}</b> steps (${pts} effort points)</li>`);
  }
  if(plan.habits.length) li.push(`<li><b>${plan.habits.length}</b> habit${plan.habits.length===1?'':'s'}</li>`);
  if(plan.skippedProjects.length) li.push(`<li style="color:var(--c-warn)"><b>${plan.skippedProjects.length}</b> project${plan.skippedProjects.length===1?'':'s'} already exist and will be skipped: ${plan.skippedProjects.map(esc).join(', ')}</li>`);
  if(plan.skippedHabits.length) li.push(`<li style="color:var(--c-warn)"><b>${plan.skippedHabits.length}</b> habit${plan.skippedHabits.length===1?'':'s'} already exist and will be skipped</li>`);
  plan.warnings.forEach(w=>li.push(`<li style="color:var(--c-warn)">${esc(w)}</li>`));
  const nothing = !plan.areas.length && !plan.projects.length && !plan.habits.length;
  return `<div class="import-plan">
    <b>${nothing? 'Nothing new to add — it is all already here.' : 'Ready to import:'}</b>
    <ul>${li.join('')}</ul>
    ${nothing? '' : `<button class="btn btn-primary btn-sm" data-action="import-apply" style="margin-top:12px">Import ${plan.projects.length+plan.habits.length} item${plan.projects.length+plan.habits.length===1?'':'s'}</button>`}
  </div>`;
}

/* =========================================================
   Real .docx writer — no external library

   The exports below this build HTML with a Word MIME type and a .doc extension.
   Word opens those, but they are not OOXML, and a file you hand an employer
   should be the real thing. A .docx is a ZIP of XML parts, and a ZIP written
   with no compression ("stored") needs only a CRC32 and two header records per
   entry — small enough to do here rather than take on a dependency.
   ========================================================= */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/* Entries are {name, text}. Everything is stored, never deflated: a brag file is
   a few kilobytes, and skipping compression removes the only part of the format
   that would need a real implementation. */
function zipStore(entries){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const u16 = n => [n & 0xFF, (n>>>8) & 0xFF];
  const u32 = n => [n & 0xFF, (n>>>8) & 0xFF, (n>>>16) & 0xFF, (n>>>24) & 0xFF];

  entries.forEach(e=>{
    const name = enc.encode(e.name);
    const data = enc.encode(e.text);
    const crc = crc32(data);
    const local = [].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0)
    );
    chunks.push(new Uint8Array(local), name, data);
    central.push([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
    ), name);
    offset += local.length + name.length + data.length;
  });

  const dirStart = offset;
  let dirSize = 0;
  const dirChunks = [];
  for(let i=0;i<central.length;i+=2){
    const head = new Uint8Array(central[i]), name = central[i+1];
    dirChunks.push(head, name);
    dirSize += head.length + name.length;
  }
  const end = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(entries.length), u16(entries.length),
    u32(dirSize), u32(dirStart), u16(0)
  ));
  return new Blob(chunks.concat(dirChunks, [end]), {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

function xmlEsc(v){
  return String(v==null?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
/* Paragraph builders. Each returns one <w:p>; runs carry their own formatting so
   a line can mix bold and plain without a style for every combination. */
const DX = {
  para(runs, opts){
    opts = opts || {};
    const pPr = `<w:pPr>${opts.style?`<w:pStyle w:val="${opts.style}"/>`:''}${opts.bullet?'<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>':''}${opts.spaceAfter!=null?`<w:spacing w:after="${opts.spaceAfter}"/>`:''}</w:pPr>`;
    const body = (Array.isArray(runs)?runs:[runs]).map(r=>{
      const t = typeof r==='string' ? {text:r} : r;
      const rPr = `<w:rPr>${t.b?'<w:b/>':''}${t.i?'<w:i/>':''}${t.color?`<w:color w:val="${t.color}"/>`:''}${t.size?`<w:sz w:val="${t.size*2}"/>`:''}</w:rPr>`;
      return `<w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(t.text)}</w:t></w:r>`;
    }).join('');
    return `<w:p>${pPr}${body}</w:p>`;
  },
  h1(text){ return DX.para([{text, b:true, size:20, color:'1E293B'}], {spaceAfter:80}); },
  h2(text){ return DX.para([{text:text.toUpperCase(), b:true, size:11, color:'475569'}], {spaceAfter:60}); },
  muted(text){ return DX.para([{text, color:'94A3B8', size:9}], {spaceAfter:120}); },
  bullet(runs){ return DX.para(runs, {bullet:true}); },
  spacer(){ return DX.para([{text:''}]); },
  table(rows){
    const cell = (v,b)=>`<w:tc><w:tcPr><w:tcW w:w="4680" w:type="dxa"/></w:tcPr>${DX.para([{text:String(v), b:!!b}])}</w:tc>`;
    return `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="0" w:type="auto"/>
      <w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="E2E8F0"/>`).join('')}</w:tblBorders>
      </w:tblPr>${rows.map(r=>`<w:tr>${cell(r[0], r[2]!==false)}${cell(r[1])}</w:tr>`).join('')}</w:tbl>` + DX.spacer();
  }
};

/* =========================================================
   Brag file

   A brag document is not a task list. Asked "what did you do this quarter", the
   answer is what shipped and what moved — grouped by the thing it belonged to,
   led by outcomes, with the numbers behind it. So closed milestones are rolled
   up under their project and reported with where that project now stands,
   rather than listed as forty separate rows nobody reads.
   ========================================================= */
const BRAG_RANGES = {
  week:    { label:'This week',     from: () => fmtISO(startOfWeek(new Date())) },
  month:   { label:'This month',    from: () => todayISO().slice(0,8)+'01' },
  quarter: { label:'Last 90 days',  from: () => fmtISO(addDays(new Date(),-90)) },
  year:    { label:'This year',     from: () => todayISO().slice(0,4)+'-01-01' },
  all:     { label:'All time',      from: () => '0000-01-01' }
};

/* Everything closed in the window, for one domain or all of them. Milestones are
   not items, so they are gathered off their projects by the date they closed. */
function bragData(rangeKey, domain){
  const r = BRAG_RANGES[rangeKey] || BRAG_RANGES.month;
  const from = r.from(), to = todayISO();
  const inRange = d => !!d && d.slice(0,10) >= from && d.slice(0,10) <= to;
  const inDomain = c => domain==='all' || c===domain;

  const doneItems = completedItems().filter(i=>inRange(i.completedAt) && inDomain(i.category));
  const projectsDone = doneItems.filter(i=>i.type==='project');
  const tasksDone    = doneItems.filter(i=>i.type==='task');

  /* Milestones closed in the window, grouped under the project they belong to.
     A project reported as delivered is left out here — it is already the stronger
     claim, and listing it again under "moved forward" reads as padding. */
  const deliveredIds = new Set(projectsDone.map(p=>p.id));
  const advanced = [];
  projects().filter(p=>inDomain(p.category) && !deliveredIds.has(p.id)).forEach(p=>{
    const closed = (p.subtasks||[]).filter(sx=>sx.done && inRange(sx.doneAt));
    if(closed.length) advanced.push({ project:p, closed, st:projectStats(p) });
  });
  advanced.sort((a,b)=>b.closed.length-a.closed.length);

  const weight = u => (EFFORT[u.effort]||EFFORT[DEFAULT_EFFORT]).weight;
  // Steps inside a delivered project still count — they were done, they just are
  // not listed separately because the delivery already covers them.
  const deliveredSteps = projectsDone.reduce((a,p)=>
    a + (p.subtasks||[]).filter(sx=>sx.done && inRange(sx.doneAt)).length, 0);
  const deliveredPoints = projectsDone.reduce((a,p)=>
    a + (p.subtasks||[]).filter(sx=>sx.done && inRange(sx.doneAt)).reduce((n,c)=>n+weight(c),0), 0);
  const points = advanced.reduce((a,x)=>a + x.closed.reduce((n,c)=>n+weight(c),0), 0)
               + tasksDone.reduce((a,t)=>a+weight(t),0) + deliveredPoints;

  const recurring = tasksDone.filter(t=>t.seriesId);
  const standalone = tasksDone.filter(t=>!t.seriesId && !t.projectId);
  const projectTasks = tasksDone.filter(t=>!t.seriesId && t.projectId);
  const people = Array.from(new Set(doneItems.map(i=>i.assignee).filter(Boolean)));

  return { from, to, label:r.label, domain, projectsDone, tasksDone, advanced,
           recurring, standalone, projectTasks, points, people,
           milestoneCount: advanced.reduce((a,x)=>a+x.closed.length,0) + deliveredSteps };
}

function exportBragFile(rangeKey, domain){
  const d = bragData(rangeKey, domain);
  const scope = domain==='all' ? 'All areas' : domain;
  const pretty = iso => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  const body = [];

  body.push(DX.h1('What I delivered'));
  body.push(DX.muted(`${scope}  ·  ${d.label}${rangeKey==='all'?'':`  ·  ${pretty(d.from)} to ${pretty(d.to)}`}`));

  // The headline sentence, so the first line answers the question on its own.
  const head = [];
  if(d.projectsDone.length) head.push(`${d.projectsDone.length} project${d.projectsDone.length===1?'':'s'} completed`);
  if(d.milestoneCount) head.push(`${d.milestoneCount} milestone${d.milestoneCount===1?'':'s'} closed`);
  if(d.tasksDone.length) head.push(`${d.tasksDone.length} task${d.tasksDone.length===1?'':'s'} closed`);
  body.push(DX.para([{text: head.length? head.join(', ') + '.' : 'Nothing was closed in this period.', b:true}], {spaceAfter:200}));

  if(d.projectsDone.length){
    body.push(DX.h2('Delivered end to end'));
    d.projectsDone.forEach(p=>{
      const st = projectStats(p);
      const detail = st.hasPlan ? ` — ${st.total} steps, ${st.weightTotal} effort points` : '';
      body.push(DX.bullet([{text:p.title, b:true}, {text:`${detail}. Closed ${pretty(p.completedAt.slice(0,10))}.`}]));
    });
    body.push(DX.spacer());
  }

  if(d.advanced.length){
    body.push(DX.h2('Moved forward'));
    d.advanced.forEach(x=>{
      const at = x.st.hasPlan ? `now ${x.st.pct}% complete` : 'in progress';
      body.push(DX.para([{text:x.project.title, b:true}, {text:`  —  ${x.closed.length} step${x.closed.length===1?'':'s'} closed, ${at}`}], {spaceAfter:40}));
      x.closed.forEach(c=>body.push(DX.bullet([{text:c.title}])));
    });
    body.push(DX.spacer());
  }

  if(d.standalone.length || d.projectTasks.length){
    body.push(DX.h2('Also closed'));
    d.projectTasks.forEach(t=>{
      const proj = byId(t.projectId);
      body.push(DX.bullet([{text:t.title}, {text: proj? `  (${proj.title})`:'', color:'94A3B8'}]));
    });
    d.standalone.forEach(t=>body.push(DX.bullet([{text:t.title}])));
    body.push(DX.spacer());
  }

  if(d.recurring.length){
    body.push(DX.h2('Commitments kept'));
    const byTitle = {};
    d.recurring.forEach(t=>{ byTitle[t.title] = (byTitle[t.title]||0)+1; });
    Object.keys(byTitle).sort().forEach(t=>
      body.push(DX.bullet([{text:t}, {text:`  —  ${byTitle[t]}×`, color:'94A3B8'}])));
    body.push(DX.spacer());
  }

  body.push(DX.h2('By the numbers'));
  body.push(DX.table([
    ['Projects completed', d.projectsDone.length],
    ['Projects advanced', d.advanced.length],
    ['Milestones closed', d.milestoneCount],
    ['Tasks closed', d.tasksDone.length],
    ['Effort points delivered', d.points],
    ['Recurring commitments met', d.recurring.length]
  ]));
  if(d.people.length) body.push(DX.para([{text:'Worked with: ', b:true},{text:d.people.join(', ')}]));

  body.push(DX.muted(`Generated ${new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})} from Second Brain.`));

  const slug = (domain==='all'?'all':domain).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  downloadDocx(`brag-${slug}-${rangeKey}-${todayISO()}.docx`, body.join(''));
  pushToast(`Brag file downloaded — ${d.label.toLowerCase()}`);
}

<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:numFmt w:val="bullet"/><w:lvlText w:val="&#8226;"/>
<w:pPr><w:ind w:left="360" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum>

<w:style w:type="table" w:styleId="TableGrid"><w:name w:val="Table Grid"/></w:style></w:styles>`;
  const blob = zipStore([
    { name:'[Content_Types].xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>

</Types>` },

<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>

/* =========================================================
   Lightweight DOCX-compatible export (no external library)
   ========================================================= */
function downloadWordDoc(filename, title, bodyHtml){
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
  <head><meta charset="utf-8"><title>${esc(title)}</title>
  <style>body{font-family:Calibri,Arial,sans-serif;font-size:12pt;color:#1E293B}h1{font-size:20pt;margin-bottom:4pt}h2{font-size:13pt;color:#475569;text-transform:uppercase;letter-spacing:.5pt;margin-top:18pt;border-bottom:1pt solid #E2E8F0;padding-bottom:4pt}
  p{margin:4pt 0}ul{margin:4pt 0}li{margin:2pt 0}.muted{color:#94A3B8}</style></head>
  <body>${bodyHtml}</body></html>`;
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportProjectReport(p){
  const st = projectStats(p);
  const eff = k=>(EFFORT[k]||EFFORT[DEFAULT_EFFORT]).label;
  const line = u=>`<li>${u.done?'☑':'☐'} [${eff(u.effort)}] ${esc(u.title)}${u.dueDate?` <span class="muted">(due ${esc(u.dueDate)})</span>`:''}${u.done&&u.doneAt?` <span class="muted">— closed ${esc(u.doneAt.slice(0,10))}</span>`:''}</li>`;
  const milestones = st.units.filter(u=>u.kind==='milestone');
  const tasks = st.units.filter(u=>u.kind==='task');
  const summary = st.hasPlan ? `
    <h2>At a glance</h2>
    <table cellpadding="6" cellspacing="0" border="1" style="border-collapse:collapse;border-color:#E2E8F0">
      <tr><td><b>Complete (effort-weighted)</b></td><td>${st.pct}%</td></tr>
      <tr><td>Unweighted step count</td><td>${st.countPct}% (${st.done} of ${st.total} steps)</td></tr>
      <tr><td>Effort closed</td><td>${st.weightDone} of ${st.weightTotal} points</td></tr>
      <tr><td>Schedule window</td><td>${new Date(st.startMs).toLocaleDateString()}${st.startedFromDate?' (start date)':' (project created)'}${p.dueDate?' → '+p.dueDate:' → no due date'}</td></tr>
      <tr><td>Schedule spent</td><td>${st.timePct==null?'No due date set':Math.round(st.timePct)+'% of the window'}</td></tr>
      <tr><td>Schedule variance</td><td>${st.variance==null?'—':(st.variance>0?'+':'')+st.variance+' pts (' + HEALTH_META[st.health].label + ')'}</td></tr>
      <tr><td>Time remaining</td><td>${st.daysLeft==null?'—':st.daysLeft<0?Math.abs(st.daysLeft)+' days overdue':st.daysLeft+' days left'}</td></tr>
      <tr><td>Last step closed</td><td>${st.lastActivityMs? st.daysSinceActivity+' days ago'+(st.stalled?' — STALLED':'') : 'No step closed yet'}</td></tr>
    </table>`
  : `<h2>At a glance</h2><p><b>No measurable completion.</b> This project has no milestones and no tasks, so it has no percentage — it is unmeasured rather than 0% done, and it is excluded from portfolio roll-ups.</p>`;
  const html = `<h1>${esc(p.title)}</h1>
    <p class="muted">Domain: ${esc(p.category)} &nbsp;·&nbsp; Priority: ${esc(p.priority)} &nbsp;·&nbsp; Status: ${esc(p.status)}${p.assignee?` &nbsp;·&nbsp; Owner: ${esc(p.assignee)}`:''}${p.startDate?` &nbsp;·&nbsp; Start ${esc(p.startDate)}`:''}${p.dueDate?` &nbsp;·&nbsp; Due ${esc(p.dueDate)}`:''}</p>
    <p class="muted">Generated ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p>
    ${summary}
    <h2>Milestones</h2><ul>${milestones.map(line).join('') || '<li class="muted">None</li>'}</ul>
    <h2>Tasks</h2><ul>${tasks.map(line).join('') || '<li class="muted">None</li>'}</ul>
    <p class="muted">Effort sizes: S=1, M=2, L=3, XL=5. Weighted completion is closed effort points over total effort points.</p>`;
  downloadWordDoc(`${p.title.replace(/[^a-z0-9]+/gi,'-')}-report.doc`, p.title, html);
  pushToast('Report downloaded');
}

/* =========================================================
   Event wiring (delegated)
   ========================================================= */
function wireGlobal(){
  document.body.onkeydown = (e)=>{
    if((e.key==='Enter' || e.keyCode===13) && e.target && e.target.getAttribute('data-action-enter')){
      e.preventDefault();
      handleAction(e.target.getAttribute('data-action-enter'), e.target);
    }
  };
}

/* ---------- drag to reorder ----------
   Pointer events, not HTML5 drag-and-drop: HTML5 drag never fires on a touch
   screen, and this app gets used on a phone. A drag can only start from the ⠿
   handle, so clicking a row still opens it and dragging the page still scrolls.

   The handle carries which list it belongs to (data-dnd-action) and its own
   index (data-dnd-i); sibling rows are found by matching both the action and the
   owner, which keeps two expanded projects' milestone lists apart. */
let drag = null;
const DRAG_SLOP = 6;   // px of movement before a press counts as a drag, not a tap

function dragSiblings(action, owner){
  const sel = `[data-dnd-handle][data-dnd-action="${cssEscape(action)}"]`
            + (owner!=null ? `[data-owner="${cssEscape(owner)}"]` : ':not([data-owner])');
  return Array.from(document.querySelectorAll(sel))
    .map(h=>({ handle:h, row:h.closest('[data-dnd-row]'), i:+h.getAttribute('data-dnd-i') }))
    .filter(r=>r.row)
    .sort((a,b)=>a.i-b.i);
}

/* Which gap the pointer is sitting in: 0..n, where n means "past the last row". */
function dragSlotAt(rows, y){
  for(let k=0;k<rows.length;k++){
    const r = rows[k].row.getBoundingClientRect();
    if(y < r.top + r.height/2) return k;
  }
  return rows.length;
}

function dragPaint(slot){
  drag.rows.forEach(r=>r.row.classList.remove('drop-before','drop-after'));
  if(slot==null) return;
  if(slot < drag.rows.length) drag.rows[slot].row.classList.add('drop-before');
  else if(drag.rows.length) drag.rows[drag.rows.length-1].row.classList.add('drop-after');
}

function dragClear(){
  if(!drag) return;
  drag.rows.forEach(r=>r.row.classList.remove('drop-before','drop-after','dragging'));
  document.body.classList.remove('dragging-active');
  try{ drag.handle.releasePointerCapture(drag.pointerId); }catch(e){}
  drag = null;
}

document.addEventListener('pointerdown', (e)=>{
  const handle = e.target.closest('[data-dnd-handle]');
  if(!handle || e.button>0) return;
  const action = handle.getAttribute('data-dnd-action');
  const owner = handle.getAttribute('data-owner');
  const rows = dragSiblings(action, owner);
  const from = rows.findIndex(r=>r.handle===handle);
  if(from<0 || rows.length<2) return;
  drag = { handle, action, owner, rows, from, startY:e.clientY, active:false, slot:null, pointerId:e.pointerId };
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});

document.addEventListener('pointermove', (e)=>{
  if(!drag) return;
  if(!drag.active){
    if(Math.abs(e.clientY-drag.startY) < DRAG_SLOP) return;
    drag.active = true;
    drag.rows[drag.from].row.classList.add('dragging');
    document.body.classList.add('dragging-active');
  }
  drag.slot = dragSlotAt(drag.rows, e.clientY);
  dragPaint(drag.slot);
  e.preventDefault();
});

document.addEventListener('pointerup', (e)=>{
  if(!drag) return;
  const { action, owner, from, slot, active } = drag;
  dragClear();
  if(!active || slot==null) return;
  // A slot is a gap; removing the dragged row first shifts every later gap down one.
  const to = from < slot ? slot-1 : slot;
  if(applyReorder(action, from, to, owner)) persist();
});
document.addEventListener('pointercancel', dragClear);

document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  if(t.classList.contains('modal-overlay') && e.target!==t) return;
  handleAction(t.getAttribute('data-action'), t);
});

document.addEventListener('change', (e)=>{
  const t = e.target.closest('[data-action-change]');
  if(!t) return;
  handleAction(t.getAttribute('data-action-change'), t);
});

document.addEventListener('input', (e)=>{
  const t = e.target.closest('[data-action-input]');
  if(!t) return;
  handleAction(t.getAttribute('data-action-input'), t);
});

function handleAction(action, el){
  const id = el.getAttribute && el.getAttribute('data-id');
  const item = id ? byId(id) : null;

  switch(action){
    case 'nav': ui.view = el.getAttribute('data-view'); ui.processInbox=false; render(); break;
    case 'toggle-sidebar': ui.sidebarCollapsed = !ui.sidebarCollapsed; render(); break;
    case 'toggle-numbering': state.state.settings.numberLists = !numbersOn(); persist(); break;
    case 'toggle-theme':
      state.state.settings.themeMode = state.state.settings.themeMode==='dark' ? 'light':'dark';
      persist(); break;

    case 'process-inbox': ui.processInbox = true; ui.triageIndex = 0; ui.triageSkipped = []; render(); break;
    case 'exit-triage': ui.processInbox = false; render(); break;

    case 'capture-add': {
      const input = qs('#capture-input');
      const val = input && input.value.trim();
      if(val){ newItem({title:val, category:'Inbox', status:'open'}); persist(); }
      break;
    }

    case 'complete': if(item) { completeItem(item); persist(); } break;
    case 'delete': if(item){ deleteItem(item.id); persist(); } break;
    case 'toggle-star': if(item){ toggleStar(item); persist(); } break;
    // data-id is a focus reference: an item id, or a milestone's "ms:…" reference.
    case 'toggle-pin': togglePin(id); persist(); break;
    case 'toggle-archive': toggleInactive(id); break;
    case 'toggle-archived': ui.showArchived=!ui.showArchived; render(); break;
    case 'toggle-expand': {
      if(ui.expandedProjects.has(id)) ui.expandedProjects.delete(id); else ui.expandedProjects.add(id);
      render(); break;
    }
    case 'filter-project': ui.projectFilter = el.getAttribute('data-cat'); render(); break;
    case 'filter-assignee': ui.inboxAssigneeFilter = el.getAttribute('data-assignee'); render(); break;
    case 'reports-tab': ui.reportsTab = el.getAttribute('data-tab'); render(); break;
    case 'review-tab': ui.reviewTab = el.getAttribute('data-tab'); render(); break;
    case 'review-tick': {
      // No grantXP call here, by design.
      const kind = el.getAttribute('data-kind'), key = el.getAttribute('data-key');
      const store = reviewTicks(kind);
      if(store.done[key]) delete store.done[key]; else store.done[key] = true;
      persist();
      break;
    }
    case 'review-reset': {
      const store = reviewTicks(el.getAttribute('data-kind'));
      store.done = {};
      persist();
      break;
    }
    case 'project-health-filter': ui.projectHealthFilter = el.getAttribute('data-health'); render(); break;
    case 'export-portfolio': exportPortfolioReport(); break;
    case 'brag-range': ui.bragRange = el.value; render(); break;
    case 'brag-domain': ui.bragDomain = el.value; render(); break;
    case 'export-brag': {
      const doms = Array.from(new Set(completedItems().map(i=>i.category)))
        .concat(projects().filter(p=>(p.subtasks||[]).some(sx=>sx.done)).map(p=>p.category))
        .filter((v,i,a)=>a.indexOf(v)===i);
      const dom = doms.indexOf(ui.bragDomain)>=0 ? ui.bragDomain
        : (doms.find(n=>/intelmotion|intel group/i.test(n)) || 'all');
      exportBragFile(ui.bragRange, dom);
      break;
    }
    case 'export-report': {
      const t = ui.reportsTab;
      if(t==='areas') exportAreasReport();
      else if(t==='habits') exportHabitsReport();
      else if(t==='timeline') exportTimelineReport();
      else exportPortfolioReport();
      break;
    }
    case 'import-preview': {
      const box = qs('#import-input');
      ui.importText = box ? box.value : '';
      ui.importPlan = ui.importText.trim() ? planImport(ui.importText) : {error:'Paste the import block first.'};
      render();
      break;
    }
    case 'import-clear': ui.importText=''; ui.importPlan=null; render(); break;
    case 'import-apply': {
      if(!ui.importPlan || ui.importPlan.error) break;
      const r = applyImport(ui.importPlan);
      ui.importText=''; ui.importPlan=null;
      pushToast(`Imported ${r.projects} project${r.projects===1?'':'s'}, ${r.steps} steps and ${r.habits} habit${r.habits===1?'':'s'}`, true);
      ui.view='projects'; render();
      break;
    }
    case 'open-portfolio-report': ui.view='reports'; ui.reportsTab='projects'; ui.projectHealthFilter='all'; render(); break;
    case 'open-item': if(item) modalItemDetail(item); break;
    case 'goto-project': {
      closeModal();
      const proj = byId(id);
      if(proj){
        ui.view='projects'; ui.projectFilter='all'; ui.projectSearch=''; ui.showArchived=true;
        ui.expandedProjects.add(proj.id);
      }
      render();
      // Bring the project into view rather than leaving them to hunt for it.
      setTimeout(()=>{ const el=qs(`.project-card [data-id="${cssEscape(id)}"]`); if(el&&el.scrollIntoView) el.scrollIntoView({block:'center'}); },50);
      break;
    }
    case 'goto-inbox': {
      closeModal();
      const it2 = byId(id);
      ui.view='inbox'; ui.inboxSearch=''; ui.inboxAssigneeFilter='all';
      ui.inboxScope = (it2 && it2.category==='Inbox') ? 'unfiled' : 'all';
      render();
      break;
    }
    case 'manage-domains': modalManageDomains(); break;
    case 'add-domain': {
      const input = qs('#new-domain');
      const val = input && input.value.trim();
      if(val){ if(addLifeArea(val)){ persist(); modalManageDomains(); } else pushToast('That domain already exists'); }
      break;
    }
    case 'rename-domain': {
      const oldName = el.getAttribute('data-area');
      const next = window.prompt('Rename domain — everything filed under it moves with the name.', oldName);
      if(next===null) break;
      if(renameLifeArea(oldName, next)){ persist(); modalManageDomains(); }
      else pushToast('Pick a new name that is not already in use');
      break;
    }
    case 'merge-domain': {
      const from = el.getAttribute('data-area');
      const sel = qs(`[data-role="merge-target"][data-area="${cssEscape(from)}"]`);
      const into = sel && sel.value;
      if(!into){ pushToast('Choose a domain to merge into first'); break; }
      const u = areaUsage(from);
      if(!window.confirm(`Move ${u.projects} project(s), ${u.items} item(s) and ${u.habits} habit(s) from "${from}" into "${into}", then remove "${from}"?`)) break;
      if(mergeLifeArea(from, into)){ persist(); modalManageDomains(); pushToast(`Merged into ${into}`); }
      break;
    }
    case 'delete-domain': {
      const name = el.getAttribute('data-area');
      const u = areaUsage(name);
      if(!window.confirm(`Delete "${name}"? ${u.items} item(s) return to the Inbox and ${u.habits} habit(s) become unassigned. Merge instead if you want to keep them grouped.`)) break;
      deleteLifeArea(name);
      if(ui.projectFilter===name) ui.projectFilter='all';
      persist(); modalManageDomains();
      break;
    }
    case 'rename-subtask': {
      const proj = byId(id), sub = proj && (proj.subtasks||[]).find(x=>x.id===el.getAttribute('data-sub'));
      if(sub) modalRenameSubtask(proj, sub);
      break;
    }
    case 'confirm-rename-subtask': {
      const proj = byId(id), sub = proj && (proj.subtasks||[]).find(x=>x.id===el.getAttribute('data-sub'));
      const val = qs('#ms-title') && qs('#ms-title').value.trim();
      if(sub && val){ sub.title = val; closeModal(); persist(); }
      break;
    }
    case 'delete-subtask': {
      const proj = byId(id);
      if(!proj) break;
      const idx = (proj.subtasks||[]).findIndex(x=>x.id===el.getAttribute('data-sub'));
      if(idx<0) break;
      const sub = proj.subtasks[idx];
      if(!window.confirm(`Delete the milestone "${sub.title}"? This cannot be undone.`)) break;
      proj.subtasks.splice(idx,1);
      persist();
      break;
    }
    case 'project-search-changed': ui.projectSearch = el.value; render(); break;
    case 'reports-search-changed': ui.reportsSearch = el.value; render(); break;
    case 'clear-reports-search': ui.reportsSearch=''; render(); break;
    case 'clear-project-search': ui.projectSearch=''; render(); break;
    case 'inbox-search-changed': ui.inboxSearch = el.value; render(); break;
    case 'clear-inbox-search': ui.inboxSearch=''; render(); break;
    case 'inbox-scope': ui.inboxScope = el.getAttribute('data-scope'); render(); break;
    case 'inbox-date': ui.inboxDate = el.getAttribute('data-date'); render(); break;
    case 'inbox-category': ui.inboxCategory = el.value; render(); break;
    case 'clear-inbox-filters':
      ui.inboxCategory='all'; ui.inboxProject='all'; ui.inboxDate='all'; ui.inboxAssigneeFilter='all';
      render(); break;
    case 'inbox-project': ui.inboxProject = el.value; render(); break;
    case 'move-now': case 'move-inbox': case 'move-project': case 'move-subtask':
    case 'move-child': case 'move-habit': case 'move-recurrence': case 'move-review': {
      const from = +el.getAttribute('data-i');
      if(applyReorder(action, from, from + (+el.getAttribute('data-dir')), el.getAttribute('data-owner'))) persist();
      break;
    }
    case 'cycle-effort': {
      const sid = el.getAttribute('data-sub');
      const owner = byId(id);
      if(!owner) break;
      if(sid){
        const sub = (owner.subtasks||[]).find(x=>x.id===sid);
        if(sub){ sub.effort = cycleEffort(sub.effort); persist(); }
      } else {
        owner.effort = cycleEffort(owner.effort); persist();
      }
      break;
    }

    case 'history-range': ui.historyRange = el.getAttribute('data-range'); render(); break;
    case 'history-custom-from': ui.historyCustomFrom = el.value || null; render(); break;
    case 'history-custom-to': ui.historyCustomTo = el.value || null; render(); break;
    case 'history-week': {
      const dir = el.getAttribute('data-dir');
      if(dir==='back') ui.historyWeekOffset++;
      else ui.historyWeekOffset = Math.max(0, ui.historyWeekOffset-1);
      render(); break;
    }

    case 'convert-project': if(item) modalConvertToProject(item); break;
    case 'confirm-convert': {
      const cat = qs('#conv-cat').value;
      if(item){ convertToProject(item, cat); closeModal(); persist(); pushToast('Converted to project'); }
      break;
    }
    case 'open-editor': if(item) modalEditItem(item); break;
    case 'confirm-edit': {
      if(item){
        const edStart = qs('#ed-start') ? (qs('#ed-start').value || null) : item.startDate;
        const edDue = qs('#ed-due').value || null;
        if(edStart && edDue && edStart > edDue){ pushToast('Start date must be on or before the due date'); break; }
        item.title = qs('#ed-title').value.trim()||item.title;
        item.category = qs('#ed-cat').value;
        if(qs('#ed-project')) item.projectId = qs('#ed-project').value || null;
        item.priority = qs('#ed-pri').value;
        if(qs('#ed-start')) item.startDate = edStart;
        item.dueDate = edDue;
        item.assignee = qs('#ed-assignee').value.trim() || null;
        closeModal(); persist();
      }
      break;
    }
    case 'close-modal': closeModal(); break;

    case 'reset-app': modalConfirmReset(); break;
    case 'confirm-reset': resetApp(); break;

    case 'open-area': { const a = state.state.lifeAreas.find(x=>x.name===el.getAttribute('data-area')); if(a) modalAreaDetail(a); break; }
    case 'open-project-report': { const p = byId(id); if(p) modalProjectDetail(p); break; }
    case 'rollup-drill': modalRollupDrill(el.getAttribute('data-key'), el.getAttribute('data-area')); break;

    case 'add-review-step': modalReviewStep(el.getAttribute('data-kind'), null); break;
    case 'edit-review-step': {
      const k = el.getAttribute('data-kind');
      const c = reviewCustom(k).find(x=>x.id===id);
      if(c) modalReviewStep(k, c);
      break;
    }
    case 'save-review-step': {
      const k = el.getAttribute('data-kind');
      const what = (qs('#rv-what').value||'').trim();
      if(!what){ pushToast('Give the step a name first'); break; }
      const why = (qs('#rv-why').value||'').trim();
      const where = (qs('#rv-where').value||'').trim() || '—';
      const c = id ? reviewCustom(k).find(x=>x.id===id) : null;
      if(c){
        // The tick is keyed off the step's text, so a rename would strand it.
        // Carry it across: renaming a step is not un-doing it.
        if(c.what !== what){
          const ticks = reviewTicks(k);
          const oldKey = reviewKey(REVIEW_MINE, c.what), newKey = reviewKey(REVIEW_MINE, what);
          if(ticks.done && ticks.done[oldKey]){ ticks.done[newKey] = true; delete ticks.done[oldKey]; }
        }
        Object.assign(c, {what, why, where});
      }
      else reviewCustom(k).push({ id:uid(), what, why, where });
      closeModal(); persist();
      break;
    }
    case 'delete-review-step': {
      const k = el.getAttribute('data-kind');
      const arr = reviewCustom(k);
      const i = arr.findIndex(x=>x.id===id);
      if(i>=0 && confirm(`Delete "${arr[i].what}" from the ${k} list?`)){
        // Drop the step's tick with it, or the period store keeps a key nothing owns.
        const key = reviewKey(REVIEW_MINE, arr[i].what);
        arr.splice(i,1);
        const ticks = reviewTicks(k);
        if(ticks.done) delete ticks.done[key];
        persist();
      }
      break;
    }
    case 'hide-review-step': {
      const k = el.getAttribute('data-kind'), key = el.getAttribute('data-key');
      if(!isReviewHidden(k, key)) reviewHidden(k).push(key);
      persist();
      pushToast('Hidden — restore it from the bottom of the list');
      break;
    }
    case 'restore-review-steps': modalRestoreReviewSteps(el.getAttribute('data-kind')); break;
    case 'restore-review-step': {
      const k = el.getAttribute('data-kind'), key = el.getAttribute('data-key');
      const arr = reviewHidden(k);
      if(key==='*') arr.length = 0;
      else { const i = arr.indexOf(key); if(i>=0) arr.splice(i,1); }
      closeModal(); persist();
      break;
    }

    case 'new-recurrence': modalRecurrence(null); break;
    case 'edit-recurrence': { const r = seriesById(id); if(r) modalRecurrence(r); break; }
    case 'rc-type-changed': {
      const v = el.value;
      const show = (sel, on)=>{ const n = qs(sel); if(n) n.style.display = on ? '' : 'none'; };
      show('#rc-days-wrap',  v==='weekly');
      show('#rc-month-wrap', v==='yearly');
      show('#rc-dom-wrap',   v==='monthly' || v==='yearly');
      break;
    }
    case 'toggle-rc-day': el.classList.toggle('on'); break;
    case 'save-recurrence': {
      const form = readRecurrenceForm();
      if(!form.title){ pushToast('Give it a name first'); break; }
      const existing = id ? seriesById(id) : null;
      if(existing){
        Object.assign(existing, form);
        // Editing an unpaused cadence means the owner wants it running again.
        if(existing.paused && seriesOutstanding(existing.id).length < RECUR_CAP){ existing.paused=false; existing.pausedReason=null; }
      } else {
        newRecurrence(form);
      }
      closeModal();
      const made = materialiseRecurring();
      persist();
      pushToast(made.created? `Saved — ${made.created} already due, added to your Inbox` : 'Saved');
      break;
    }
    case 'toggle-recurrence-pause': {
      const r = seriesById(id);
      if(r){
        r.paused = !r.paused;
        r.pausedReason = null;
        if(!r.paused){
          // Resuming catches up on everything missed while it was off, up to the cap.
          const made = materialiseRecurring();
          if(made.created) pushToast(`Resumed — ${made.created} caught up`);
        }
        persist();
      }
      break;
    }
    case 'delete-recurrence': {
      const r = seriesById(id);
      if(!r) break;
      const open = seriesOutstanding(r.id).length;
      if(!confirm(`Delete "${r.title}"?\n\nThe cadence stops. ${open? `The ${open} task${open===1?'':'s'} it already created stay in your Inbox.` : 'No open tasks were created by it.'}`)) break;
      const i = recurrences().indexOf(r);
      if(i>=0) recurrences().splice(i,1);
      persist();
      break;
    }
    case 'recurring-filter': ui.recurringFilter = el.getAttribute('data-f'); render(); break;
    case 'open-series': { const r = seriesById(el.getAttribute('data-series')); if(r) modalRecurrence(r); break; }
    case 'open-habit-report': { const h = state.state.habits.find(x=>x.id===id); if(h) modalHabitDetail(h); break; }
    case 'edit-area': { const a = state.state.lifeAreas.find(x=>x.name===el.getAttribute('data-area')); if(a) modalEditArea(a); break; }
    case 'confirm-edit-area': {
      const oldName = el.getAttribute('data-area');
      const a = state.state.lifeAreas.find(x=>x.name===oldName);
      if(a){
        const lines = sel=>qs(sel).value.split('\n').map(x=>x.trim()).filter(Boolean);
        const newName = qs('#ea-name').value.trim() || a.name;
        if(newName!==a.name && !state.state.lifeAreas.some(x=>x!==a && x.name===newName)){
          items().forEach(it=>{ if(it.category===a.name) it.category=newName; });
          state.state.habits.forEach(h=>{ if(h.category===a.name) h.category=newName; });
          a.name = newName;
        }
        a.purpose = qs('#ea-purpose').value.trim();
        a.guiding_principle = qs('#ea-gp').value.trim();
        a.framework = lines('#ea-fw');
        a.routines = lines('#ea-rt').map(l=>{ const parts=l.split('|').map(x=>x.trim()); return {cadence:parts[0]||'',action:parts[1]||'',anchor:parts[2]||''}; });

    case 'new-area': modalNewArea(); break;
    case 'confirm-new-area': {
      const name = qs('#na-name').value.trim();

      break;
    }
    case 'delete-area': { const a = state.state.lifeAreas.find(x=>x.name===el.getAttribute('data-area')); if(a) modalConfirmDeleteArea(a); break; }
    case 'confirm-delete-area': {
      const name = el.getAttribute('data-area');
      deleteLifeArea(name); closeModal(); persist(); pushToast('Area deleted');
      break;
    }

    case 'new-project': modalNewProject(); break;
    case 'confirm-new-project': {
      const title = qs('#np-title').value.trim();
      const npStart = qs('#np-start').value || null, npDue = qs('#np-due').value || null;
      if(npStart && npDue && npStart > npDue){ pushToast('Start date must be on or before the due date'); break; }
      if(title){
        const milestones = qs('#np-milestones').value.split('\n').map(x=>x.trim()).filter(Boolean)
          .map(t=>({id:uid(), title:t, done:false, xpAwarded:false, effort:DEFAULT_EFFORT, doneAt:null}));
        newItem({
          title, type:'project', category:qs('#np-cat').value, priority:qs('#np-pri').value,
          startDate: npStart,
          dueDate: npDue,
          assignee: qs('#np-assignee').value.trim() || null,
          subtasks: milestones
        });
        closeModal(); persist();
      }
      break;
    }
    case 'add-subtask': {
      const input = qs(`[data-role="new-sub"][data-id="${id}"]`);
      const val = input && input.value.trim();
      if(val && item){ item.subtasks.push({id:uid(), title:val, done:false, xpAwarded:false, effort:DEFAULT_EFFORT, doneAt:null}); persist(); }
      break;
    }
    case 'toggle-subtask': {
      const pid = id, sid = el.getAttribute('data-sub');
      const p = byId(pid);
      if(p) { toggleSubtask(p, sid); persist(); }
      break;
    }
    case 'add-child-task': {
      const input = qs(`[data-role="new-child"][data-id="${id}"]`);
      const val = input && input.value.trim();
      const proj = byId(id);
      if(val && proj){ newItem({title:val, type:'task', category:proj.category, projectId:proj.id, priority:proj.priority}); persist(); }
      break;
    }
    case 'export-project': if(item) exportProjectReport(item); break;

    case 'add-habit': modalAddHabit(); break;
    case 'confirm-add-habit': {
      const name = qs('#habit-name').value.trim();
      const emoji = qs('#habit-emoji').value.trim()||'✅';
      const category = qs('#habit-cat').value || null;
      const frequency = readHabitFrequencyFromForm();
      if(name){ state.state.habits.push({id:uid(), name, emoji, category, frequency, active:true, createdAt:new Date().toISOString(), log:{}}); closeModal(); persist(); }
      break;
    }
    case 'edit-habit': { const h = state.state.habits.find(x=>x.id===id); if(h) modalEditHabit(h); break; }
    case 'confirm-edit-habit': {
      const h = state.state.habits.find(x=>x.id===id);
      if(h){
        h.name = qs('#habit-name').value.trim()||h.name;
        h.emoji = qs('#habit-emoji').value.trim()||h.emoji;
        h.category = qs('#habit-cat').value || null;
        h.frequency = readHabitFrequencyFromForm();
        closeModal(); persist();
      }
      break;
    }
    case 'hb-freq-type-changed': {
      const v = el.value;
      const daysWrap = qs('#hb-freq-days-wrap');
      const targetWrap = qs('#hb-freq-target-wrap');
      if(daysWrap) daysWrap.style.display = v==='days' ? '' : 'none';
      if(targetWrap) targetWrap.style.display = (v==='weekly'||v==='monthly') ? '' : 'none';
      const lbl = qs('#hb-freq-target-label'), num = qs('#hb-freq-target');
      if(lbl) lbl.textContent = 'Times per ' + (v==='monthly' ? 'month' : 'week');
      if(num){ num.max = v==='monthly' ? 31 : 7; if(+num.value > +num.max) num.value = num.max; }
      break;
    }
    case 'toggle-hb-day': el.classList.toggle('on'); break;
    case 'habit-week': ui.habitWeekOffset = Math.max(0, ui.habitWeekOffset + (+el.getAttribute('data-dir'))); render(); break;
    case 'toggle-inactive-habits': ui.showInactiveHabits = !ui.showInactiveHabits; render(); break;
    case 'toggle-habit-active': {
      const h = state.state.habits.find(x=>x.id===id);
      if(h){ h.active = h.active===false; pushToast(h.active? `"${h.name}" is active again` : `"${h.name}" retired — its history is kept`); persist(); }
      break;
    }
    case 'delete-habit': {
      const hs = state.state.habits; const i = hs.findIndex(h=>h.id===id);
      if(i>=0) hs.splice(i,1); persist(); break;
    }
    case 'toggle-habit': {
      const h = state.state.habits.find(x=>x.id===id);
      if(h){ toggleHabit(h, el.getAttribute('data-date')); persist(); }
      break;
    }

    case 'new-followup': modalNewFollowup(); break;
    case 'edit-followup': if(item) modalFollowup(item); break;
    case 'track-person': modalNewFollowup(el.getAttribute('data-person')); break;
    case 'confirm-new-followup': {
      const name = qs('#fu-name').value.trim();
      if(!name){ pushToast('Give the person a name first'); break; }
      const cat = qs('#fu-cat').value;
      const due = qs('#fu-due').value || null;
      const last = qs('#fu-last').value || null;
      const dup = followupFor(name);
      if(item){
        Object.assign(item, {title:name, contactName:name, category:cat, dueDate:due, lastContactDate:last});
      } else if(dup){
        pushToast(`${dup.contactName||dup.title} is already tracked`);
        closeModal(); break;
      } else {
        // The domain comes from the picker; it used to be hardcoded to a life area
        // that may not exist, which left the follow-up filed nowhere.
        newItem({title:name, type:'followup', contactName:name, category:cat, dueDate:due, lastContactDate:last});
        const owed = tasksForPerson(name).length;
        if(owed) pushToast(`Tracking ${name} — ${owed} open task${owed===1?'':'s'} already assigned to them`);
      }
      closeModal(); persist();
      break;
    }
    case 'log-contact': if(item){ item.lastContactDate = todayISO(); persist(); } break;
    case 'add-followup-task': if(item) modalFollowupTask(item); break;
    case 'confirm-followup-task': {
      const f = byId(id);
      const title = (qs('#ft-title').value||'').trim();
      if(!f || !title){ pushToast('Give the task a name first'); break; }
      const person = f.contactName || f.title;
      newItem({ type:'task', title, assignee:person, category:f.category || 'Inbox',
                dueDate: qs('#ft-due').value || null, effort: qs('#ft-effort').value, followupId:f.id });
      closeModal(); persist();
      pushToast(`Added to Inbox for ${person}`);
      break;
    }
    /* Jump between a person and their work in both directions. */
    case 'view-person-tasks': {
      ui.view='inbox'; ui.processInbox=false; ui.inboxScope='all';
      ui.inboxAssigneeFilter = el.getAttribute('data-person');
      ui.inboxSearch=''; ui.inboxProject='all';
      render();
      break;
    }
    case 'view-person-projects': {
      ui.view='projects'; ui.processInbox=false; ui.projectFilter='all';
      ui.projectSearch = el.getAttribute('data-person');
      render();
      break;
    }
    case 'goto-followup': {
      const person = el.getAttribute('data-person');
      const f = followupFor(person);
      ui.view='followups'; ui.processInbox=false;
      render();
      if(!f) modalNewFollowup(person);
      break;
    }

    // Changing the domain re-renders so the button label keeps naming what it will do.
    case 'triage-cat-changed': ui.triageLastCat = el.value; render(); break;
    case 'triage-keep-task': {
      const it = triageCurrent();
      const sel = qs('#triage-cat');
      const cat = sel && sel.value;
      if(!it) break;
      if(!cat){ pushToast('Add a life area first — Projects → Manage domains'); break; }
      // Read the date straight off the field too: a value typed but not yet
      // committed by a change event would otherwise be lost on filing.
      const dueEl = qs('#triage-due');
      if(dueEl) it.dueDate = dueEl.value || null;
      it.category = cat;
      ui.triageLastCat = cat;
      pushToast(`"${it.title}" filed under ${cat}${it.dueDate? `, due ${fmtDue(it.dueDate)}`:''}`);
      persist(); break;
    }
    case 'triage-to-project': {
      const it = triageCurrent();
      if(it) modalConvertToProject(it);
      break;
    }
    case 'triage-due-changed': {
      const it = triageCurrent();
      if(!it) break;
      it.dueDate = el.value || null;
      // Stay on this card. Setting a date is not a decision about where the item
      // belongs, so the owner may still want to pick a domain before moving on.
      pushToast(it.dueDate? `Due ${fmtDue(it.dueDate)} — still on this card` : 'Due date cleared');
      persist();
      break;
    }
    case 'triage-delete': {
      const it = triageCurrent();
      if(it){ pushToast(`"${it.title}" deleted`); deleteItem(it.id); }
      persist(); break;
    }
    case 'triage-skip': {
      const it = triageCurrent();
      if(it){
        // Set it aside for this pass. It stays in the Inbox, unfiled and
        // standalone, and the queue shrinks so the next card is always new.
        ui.triageSkipped.push(it.id);
        pushToast(`"${it.title}" left standalone in your Inbox`);
      }
      ui.triageIndex = 0;
      render(); break;
    }
    default: break;
  }
}

/* =========================================================
   Boot
   ========================================================= */
function boot(){
  const hadLocal = !!localStorage.getItem(STATE_KEY);
  state = loadRoot();
  inactiveProjects = loadInactive();
  catchUpRecurring();
  render();
  scheduleMidnightRollover();

  if(typeof db==='undefined'){ pushToast('⚠️ Could not reach cloud — using local data'); migrateAreasIfNeeded(); return; }

  let primaryPull;
  if(!hadLocal){
    primaryPull = db.collection('snapshots').doc('primary').get()
      .then(snap=>{
        const cloud = snap.exists && snap.data().data;
        if(cloud && cloud.state){ localStorage.setItem(STATE_KEY, JSON.stringify(cloud)); state = loadRoot(); catchUpRecurring(); render(); }
      }).catch(()=>{ pushToast('⚠️ Could not reach cloud — using local data'); });
  } else {
    cloudPushDebounced();
    primaryPull = Promise.resolve();
  }
  primaryPull.then(migrateAreasIfNeeded);

  db.collection('snapshots').doc('project-flags').get()
    .then(snap=>{
      const cloud = snap.exists && snap.data().data && snap.data().data.inactive;
      if(Array.isArray(cloud)){ inactiveProjects = cloud; try{localStorage.setItem(INACTIVE_KEY, JSON.stringify(cloud));}catch(e){} render(); }
      else if(inactiveProjects.length){ saveInactive(); }
    }).catch(()=>{ pushToast('⚠️ Could not reach cloud — using local data'); });
}
boot();
    </script>
  </body>
</html>
