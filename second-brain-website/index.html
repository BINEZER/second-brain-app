/* =========================================================
   Derived data helpers
   ========================================================= */
function items(){ return state.state.items; }
function byId(id){ return items().find(i=>i.id===id); }
/* What the Inbox badge and Process Inbox count. It must match what the Inbox
   actually lists — tasks — or a project left in the Inbox domain shows up as a
   number against an empty list with no way to reach it. Such a project is still
   visible and fixable, under the Inbox domain in the Projects tab. */
function inboxItems(){ return items().filter(i=>i.type==='task' && i.category==='Inbox' && i.status==='open'); }
function openTasks(){ return items().filter(i=>i.type==='task' && i.status==='open'); }
function projects(){ return items().filter(i=>i.type==='project'); }
function tasksOf(projectId){ return items().filter(i=>i.projectId===projectId); }
function followups(){ return items().filter(i=>i.type==='followup'); }
/* A follow-up and a task's assignee are the same person, so they are matched by
   name, case-insensitively. Follow-ups used to be an island: no way to see what
   that person owes you, and no way to turn "chase them" into an actual task. */
function normPerson(n){ return String(n||'').trim().toLowerCase(); }
function followupFor(name){
  const k = normPerson(name);
  return k ? followups().find(f=>normPerson(f.contactName||f.title)===k) || null : null;
}
function tasksForPerson(name){
  const k = normPerson(name);
  return k ? items().filter(i=>i.type==='task' && i.status==='open' && normPerson(i.assignee)===k) : [];
}
/* A person can own a whole project as well as loose tasks — both are work you
   would chase them about, so both count toward tracking them. */
function projectsForPerson(name){
  const k = normPerson(name);
  return k ? projects().filter(p=>p.status!=='done' && inactiveProjects.indexOf(p.id)===-1
                                 && normPerson(p.assignee)===k) : [];
}
function worksForPerson(name){ return tasksForPerson(name).length + projectsForPerson(name).length; }
/* Everyone the app knows about: task owners and tracked contacts, merged. */
function riskOwners(){
  const out = [];
  projects().forEach(p=>(p.risks||[]).forEach(r=>{ if(r.status!=='closed' && r.owner) out.push(r.owner); }));
  return out;
}
function knownPeople(){
  const seen = new Map();
  const add = n => { const k = normPerson(n); if(k && !seen.has(k)) seen.set(k, String(n).trim()); };
  items().forEach(i=>{
    add(i.assignee);
    if(i.type==='followup') add(i.contactName||i.title);
  });
  // Whoever owns a live risk is someone you are waiting on, same as an assignee.
  riskOwners().forEach(add);
  return Array.from(seen.values()).sort((a,b)=>a.localeCompare(b));
}
function nowPins(){ return state.state.settings.nowPins; }
/* Optional 1., 2., 3. prefixes so a list can be talked about by position. */
function numbersOn(){ return !!state.state.settings.numberLists; }
function numLabel(i){ return numbersOn() ? `<span class="list-num">${i+1}.</span>` : ''; }

/* Up/down controls. Buttons rather than drag: they work identically on a
   phone and a desktop, and never fight the list's own scrolling. */
/* A row's reorder controls: a drag handle plus the two arrows. The arrows stay
   because a drag needs a pointer — the handle is the fast way, the arrows are
   the reachable way (keyboard, and a cramped phone screen). `owner` scopes the
   list when several of the same kind are on screen at once, e.g. the milestone
   lists of two expanded projects. */
function moveTools(action, id, i, len, extra, owner){
  const own = owner!=null ? ` data-owner="${esc(owner)}"` : '';
  return `<span class="row-tools">
    <button class="drag-handle" data-dnd-handle data-dnd-action="${action}" data-dnd-i="${i}"${own} title="Drag to reorder" aria-label="Drag to reorder">⠿</button>
    <button class="icon-btn btn-sm" data-action="${action}" data-dir="-1" data-i="${i}"${own} ${extra||''} title="Move up" ${i===0?'disabled':''}>↑</button>
    <button class="icon-btn btn-sm" data-action="${action}" data-dir="1" data-i="${i}"${own} ${extra||''} title="Move down" ${i>=len-1?'disabled':''}>↓</button>
  </span>`;
}

/* Move an element to an absolute index: remove, then insert. A swap would do for
   neighbours but not for a drag that crosses several rows. */
/* Add or remove a value from a filter list, in place. */
function toggleIn(arr, val){
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  return arr;
}

function moveInArrayTo(arr, from, to){
  if(from===to || from<0 || from>=arr.length || to<0 || to>=arr.length) return false;
  const [x] = arr.splice(from,1);
  arr.splice(to,0,x);
  return true;
}
function moveInArray(arr, from, dir){ return moveInArrayTo(arr, from, from+dir); }

/* Reorder a filtered slice inside the shared items array. The positions the slice
   occupies stay exactly where they are; only which member sits in each is rewritten,
   so items filtered out of view never shift. */
function reorderItemsTo(view, from, to){
  if(from===to || from<0 || from>=view.length || to<0 || to>=view.length) return false;
  const next = view.slice();
  const [x] = next.splice(from,1);
  next.splice(to,0,x);
  const all = items();
  const slots = view.map(v=>all.indexOf(v));
  if(slots.some(n=>n<0)) return false;
  slots.sort((a,b)=>a-b).forEach((slot,i)=>{ all[slot] = next[i]; });
  return true;
}
function reorderItemsBy(view, from, dir){ return reorderItemsTo(view, from, from+dir); }

/* The one place that knows what each reorder action actually reorders. The ↑↓
   buttons and the drag handle both come through here, so a drag can never move
   a different list from the one the arrows move. `owner` is the project id for
   the two per-project lists. */
const REORDER_LISTS = {
  'move-now':     { list: () => nowPins(),                     apply: (f,t) => moveInArrayTo(nowPins(), f, t) },
  'move-inbox':   { list: () => inboxViewList(),               apply: (f,t) => reorderItemsTo(inboxViewList(), f, t) },
  'move-project': { list: () => projectViewList(),             apply: (f,t) => reorderItemsTo(projectViewList(), f, t) },
  'move-subtask': { list: o => ((byId(o)||{}).subtasks) || [], apply: (f,t,o) => { const p = byId(o); return !!p && moveInArrayTo(p.subtasks, f, t); } },
  'move-child':   { list: o => tasksOf(o),                     apply: (f,t,o) => reorderItemsTo(tasksOf(o), f, t) },
  'move-habit':   { list: () => state.state.habits,            apply: (f,t) => moveInArrayTo(state.state.habits, f, t) },
  'move-recurrence': { list: () => recurrences(),              apply: (f,t) => moveInArrayTo(recurrences(), f, t) },
  'move-review':  { list: k => reviewCustom(k),                apply: (f,t,k) => moveInArrayTo(reviewCustom(k), f, t) }
};
function applyReorder(action, from, to, owner){
  const spec = REORDER_LISTS[action];
  if(!spec || isNaN(from) || isNaN(to)) return false;
  const len = spec.list(owner).length;
  if(from<0 || from>=len || to<0 || to>=len) return false;
  return spec.apply(from, to, owner);
}
/* Escape a value for use inside a [attr="..."] selector. */
function cssEscape(v){ return String(v==null?'':v).replace(/["\\]/g, '\\$&'); }
function matchesSearch(text, q){
  if(!q) return true;
  return String(text||'').toLowerCase().indexOf(q.toLowerCase()) >= 0;
}
function searchBox(id, value, placeholder){
  return `<input class="search-box" id="${id}" type="search" value="${esc(value||'')}" placeholder="${esc(placeholder)}" data-action-input="${id}-changed" />`;
}

/* =========================================================
   Project analytics — one source of truth for every % in the app.

   Completion is EFFORT-WEIGHTED: each milestone / child task carries an
   S·M·L·XL size (1/2/3/5), so closing a three-week survey moves the bar
   further than closing a phone call. Schedule progress is measured against
   the project's own createdAt -> dueDate window, and the gap between the two
   is what tells you whether a project is actually healthy.
   ========================================================= */
function effortWeight(x){ return (EFFORT[x && x.effort] || EFFORT[DEFAULT_EFFORT]).weight; }
/* A project's schedule window opens on its start date if it has one, else on creation. */
function explicitStartMs(p){
  const t = p.startDate ? Date.parse(p.startDate+'T00:00:00') : NaN;
  return isNaN(t) ? null : t;
}
function projectStartMs(p){
  const t = explicitStartMs(p);
  return t!=null ? t : (Date.parse(p.createdAt) || Date.now());
}
function cycleEffort(key){
  const i = EFFORT_ORDER.indexOf(EFFORT[key] ? key : DEFAULT_EFFORT);
  return EFFORT_ORDER[(i+1) % EFFORT_ORDER.length];
}
function dayDiff(fromMs, toMs){ return Math.round((toMs-fromMs)/86400000); }

/* =========================================================
   Recurring tasks and chores

   A recurring thing is a *series*: a template plus a cadence. The template is
   not a task and never appears in a list. Instead, every due date that has
   arrived is materialised into an ordinary task item carrying `seriesId`, so a
   recurring chore flows through the Inbox, Now, reports and the archive exactly
   like anything else — no second set of rules to maintain.

   Missed cycles stack, by design: three missed VAT filings are three real debts
   and should look like three. The cap below is the safety valve — a weekly chore
   forgotten for a year would otherwise silently create 52 rows.
   ========================================================= */
const RECUR_CAP = 24;            // most outstanding open instances one series may have
const RECUR_LOOKBACK_DAYS = 400; // never materialise history older than this on first run

const RECUR_TYPES = {
  daily:   { label:'Every day' },
  weekly:  { label:'Weekly, on set days' },
  monthly: { label:'Monthly, on a date' },
  yearly:  { label:'Yearly, on a date' }
};

function recurrences(){ return state.state.recurring; }
function seriesById(id){ return recurrences().find(r=>r.id===id) || null; }

/* Every occurrence date of a series in [fromISO, toISO], oldest first. */
function recurrenceDates(r, fromISO, toISO){
  const out = [];
  const from = new Date(fromISO+'T00:00:00'), to = new Date(toISO+'T00:00:00');
  if(isNaN(from) || isNaN(to) || from>to) return out;
  const every = Math.max(1, r.interval||1);

  if(r.type==='daily'){
    const anchor = new Date((r.anchor||fromISO)+'T00:00:00');
    let d = new Date(from);
    // Step forward to the first on-cadence day at or after `from`.
    const off = Math.round((d-anchor)/86400000);
    if(off % every !== 0) d = addDays(d, every - ((off % every)+every)%every);
    for(; d<=to; d=addDays(d,every)) out.push(fmtISO(d));
    return out;
  }
  if(r.type==='weekly'){
    const days = (r.days||[]).length ? r.days : [dowIndex(new Date((r.anchor||fromISO)+'T00:00:00'))];
    const anchorWeek = startOfWeek(new Date((r.anchor||fromISO)+'T00:00:00'));
    for(let d=new Date(from); d<=to; d=addDays(d,1)){
      if(!days.includes(dowIndex(d))) continue;
      // "every N weeks" counts whole weeks from the anchor's week.
      const weeks = Math.round((startOfWeek(d)-anchorWeek)/604800000);
      if(((weeks % every)+every)%every === 0) out.push(fmtISO(d));
    }
    return out;
  }
  if(r.type==='monthly' || r.type==='yearly'){
    const anchor = new Date((r.anchor||fromISO)+'T00:00:00');
    const dom = Math.min(31, Math.max(1, r.dayOfMonth || anchor.getDate()));
    const mon = r.type==='yearly' ? (r.month!=null ? r.month : anchor.getMonth()) : null;
    const stepMonths = r.type==='yearly' ? 12*every : every;
    // Walk months from the anchor's month, and clamp the day into short months
    // so "the 31st" lands on the 30th in April rather than skipping to May.
    let cursor = new Date(anchor.getFullYear(), r.type==='yearly'? mon : anchor.getMonth(), 1);
    while(cursor <= to){
      const last = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
      const d = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(dom, last));
      if(d>=from && d<=to) out.push(fmtISO(d));
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+stepMonths, 1);
      if(out.length>2000) break;
    }
    return out;
  }
  return out;
}

function seriesInstances(seriesId){ return items().filter(i=>i.seriesId===seriesId); }
function seriesOutstanding(seriesId){ return seriesInstances(seriesId).filter(i=>i.status==='open'); }

/* Create a task for every occurrence that has come due and does not exist yet.
   Runs on load and on every persist; doing nothing is the common case. */
function materialiseRecurring(){
  const today = todayISO();
  let created = 0, capped = [];
  recurrences().forEach(r=>{
    if(r.paused) return;
    const already = new Set(seriesInstances(r.id).map(i=>i.occursOn));
    const floor = fmtISO(addDays(new Date(), -RECUR_LOOKBACK_DAYS));
    let from = r.lastGeneratedOn ? fmtISO(addDays(new Date(r.lastGeneratedOn+'T00:00:00'),1))
                                : (r.anchor && r.anchor>floor ? r.anchor : floor);
    const dates = recurrenceDates(r, from, today);
    for(const d of dates){
      if(already.has(d)) continue;
      if(seriesOutstanding(r.id).length >= RECUR_CAP){
        // Stop rather than flood. The series says so on its face; it is not silent.
        r.paused = true;
        r.pausedReason = `${RECUR_CAP} outstanding — clear some and un-pause`;
        capped.push(r.title);
        break;
      }
      newItem({
        title: r.title, category: r.category || 'Inbox', priority: r.priority || 'medium',
        effort: r.effort || DEFAULT_EFFORT, assignee: r.assignee || null,
        dueDate: d, seriesId: r.id, occursOn: d
      });
      created++;
      r.lastGeneratedOn = d;
    }
    if(!r.paused && dates.length) r.lastGeneratedOn = dates[dates.length-1];
  });
  return { created, capped };
}

/* Generate anything that came due while the app was closed, and say so rather
   than silently growing the Inbox. Never calls persist(): boot renders once on
   its own, and a toast during boot is enough. */
function catchUpRecurring(){
  const made = materialiseRecurring();
  if(made.created){
    persistLocal();
    pushToast(`${made.created} recurring task${made.created===1?'':'s'} came due`);
  }
  made.capped.forEach(t=>pushToast(`"${t}" paused — ${RECUR_CAP} outstanding`));
  return made;
}

function newRecurrence(partial){
  const r = Object.assign({
    id: uid(), title:'', type:'weekly', interval:1, days:[dowIndex(new Date())],
    dayOfMonth: new Date().getDate(), month: new Date().getMonth(),
    anchor: todayISO(), category:'Inbox', priority:'medium', effort:DEFAULT_EFFORT,
    assignee:null, isChore:false, paused:false, pausedReason:null,
    lastGeneratedOn:null, createdAt:new Date().toISOString()
  }, partial);
  recurrences().push(r);
  return r;
}

/* Plain-English cadence, for the row and the editor summary. */
function recurrenceLabel(r){
  const n = Math.max(1, r.interval||1);
  const ord = d => d + (d%10===1&&d!==11?'st':d%10===2&&d!==12?'nd':d%10===3&&d!==13?'rd':'th');
  if(r.type==='daily')   return n===1 ? 'Every day' : `Every ${n} days`;
  if(r.type==='weekly'){
    const names = (r.days||[]).slice().sort((a,b)=>a-b).map(i=>DAY_LABELS[i]).join(', ') || '—';
    return n===1 ? `Every week on ${names}` : `Every ${n} weeks on ${names}`;
  }
  if(r.type==='monthly') return n===1 ? `Monthly on the ${ord(r.dayOfMonth)}` : `Every ${n} months on the ${ord(r.dayOfMonth)}`;
  if(r.type==='yearly'){
    const m = new Date(2000, r.month||0, 1).toLocaleDateString(undefined,{month:'long'});
    return n===1 ? `Every year on ${m} ${ord(r.dayOfMonth)}` : `Every ${n} years on ${m} ${ord(r.dayOfMonth)}`;
  }
  return '—';
}
function nextOccurrence(r){
  const today = todayISO();
  const ahead = recurrenceDates(r, today, fmtISO(addDays(new Date(), 800)));
  return ahead.length ? ahead[0] : null;
}
function endOfDayMs(dateISO){ const t = Date.parse(dateISO+'T23:59:59'); return isNaN(t)?null:t; }
function clampPct(n){ return Math.max(0, Math.min(100, n)); }

/* Every countable unit of a project: its milestones plus its child tasks. */
/* =========================================================
   Agile: backlog, sprints, burndown, velocity
   ========================================================= */
function backlogOf(p){ return p.backlog || []; }
function sprintsOf(p){ return (p.sprints||[]).slice().sort((a,b)=>a.start.localeCompare(b.start)); }
function storyPoints(b){ return Math.max(0, b.points||0); }

/* Share of the work done, 0–100. By points when anything is estimated, by head
   count when nothing is — an unestimated backlog still deserves a number. */
function backlogProgress(list){
  if(!list.length) return 0;
  const total = list.reduce((a,b)=>a+storyPoints(b), 0);
  if(!total) return list.filter(b=>b.status==='done').length / list.length * 100;
  return list.filter(b=>b.status==='done').reduce((a,b)=>a+storyPoints(b), 0) / total * 100;
}
function stageBacklog(p, stageId){ return backlogOf(p).filter(b=>b.stageId===stageId); }

/* The sprint you are in, else the last one that started, else the first planned. */
function activeSprint(p){
  const list = sprintsOf(p);
  if(!list.length) return null;
  const t = todayISO();
  return list.find(sp=>sp.start<=t && t<=sp.end)
      || list.slice().reverse().find(sp=>sp.start<=t)
      || list[0];
}
function sprintTally(p, sprintId){
  const list = backlogOf(p).filter(b=>b.sprintId===sprintId);
  return {
    items: list.length,
    total: list.reduce((a,b)=>a+storyPoints(b), 0),
    done: list.filter(b=>b.status==='done').reduce((a,b)=>a+storyPoints(b), 0)
  };
}
/* Points finished in each sprint that has started — the velocity bar chart. */
function velocity(p){
  return sprintsOf(p).filter(sp=>sp.start<=todayISO())
    .map(sp=>({ sprint: sp, done: sprintTally(p, sp.id).done }));
}
/* Points left day by day against the straight line from full to empty. Days that
   have not happened yet have no actual, so the line stops at today. */
function burndown(p, sprint){
  const list = backlogOf(p).filter(b=>b.sprintId===sprint.id);
  const total = list.reduce((a,b)=>a+storyPoints(b), 0);
  const startMs = Date.parse(sprint.start+'T00:00:00');
  const endMs = Date.parse(sprint.end+'T00:00:00');
  const n = Math.max(1, Math.round((endMs-startMs)/86400000));
  const today = Date.now();
  const out = [];
  for(let i=0;i<=n;i++){
    const dayEnd = startMs + (i+1)*86400000 - 1;
    const started = startMs + i*86400000 <= today;
    const burnt = list.filter(b=>b.status==='done' && b.doneAt && Date.parse(b.doneAt)<=dayEnd)
                      .reduce((a,b)=>a+storyPoints(b), 0);
    out.push({ day:i, label: fmtISO(new Date(startMs + i*86400000)).slice(5),
               ideal: Math.round((total*(1-i/n))*10)/10,
               actual: started ? total-burnt : null });
  }
  return { points: out, total };
}

function projectUnits(p){
  const units = [];
  // Agile: the backlog IS the plan, and a story's points are its weight — which
  // is how an agile project still rolls up beside an S/M/L/XL one.
  if((p.method||'traditional')==='agile'){
    backlogOf(p).forEach(b=>units.push({
      kind:'story', id:b.id, title:b.title, done:b.status==='done',
      share: b.status==='done' ? 1 : 0,
      weight: Math.max(1, storyPoints(b)), effort:null,
      doneAt: b.doneAt||null, dueDate:null, pct:null
    }));
    return units;
  }
  (p.subtasks||[]).forEach(s=>units.push({
    kind:'milestone', id:s.id, title:s.title, done:!!s.done,
    /* How much of this unit counts as closed: a tick, a part-done figure, or —
       on a hybrid project — whatever the backlog items under it add up to. */
    share: s.done ? 1
         : s.source==='backlog' ? backlogProgress(stageBacklog(p, s.id))/100
         : (s.pct ? Math.min(1, s.pct/100) : 0),
    weight:effortWeight(s), effort:(EFFORT[s.effort]?s.effort:DEFAULT_EFFORT),
    doneAt:s.doneAt||null, dueDate:null, pct:s.pct||null
  }));
  tasksOf(p.id).forEach(c=>units.push({
    kind:'task', id:c.id, title:c.title, done:c.status==='done',
    share: c.status==='done' ? 1 : 0,
    weight:effortWeight(c), effort:(EFFORT[c.effort]?c.effort:DEFAULT_EFFORT),
    doneAt:c.completedAt||null, dueDate:c.dueDate||null, pct:null
  }));
  return units;
}

/* =========================================================
   Levels, money and risk

   projectStats stays the one source of truth for every percentage, and now
   answers for three shapes: a project (its own milestones), and a programme or
   portfolio (its children, by weight). Callers never need to know which.
   ========================================================= */
function isContainerKind(p){ return p && (p.kind==='program' || p.kind==='portfolio'); }
function childProjects(p){ return projects().filter(c=>c.parentId===p.id); }
function parentOf(p){ return p && p.parentId ? byId(p.parentId) : null; }
/* The chain from the top down to this item, for a breadcrumb. Depth-capped: a
   parent loop would otherwise hang the render rather than show a bad tree. */
function ancestry(p){
  const out = []; let cur = parentOf(p), n = 0;
  while(cur && n++ < TREE_DEPTH_CAP){ out.unshift(cur); cur = parentOf(cur); }
  return out;
}
function liveRisks(p){ return (p.risks||[]).filter(r=>r.status!=='closed' && (r.type==='risk'||r.type==='issue')); }
function riskScore(r){ return (r.probability||0) * (r.impact||0); }
function topRisk(p){ return liveRisks(p).reduce((a,r)=>Math.max(a, riskScore(r)), 0); }
const money = n => (n==null ? '—' : Math.round(n).toLocaleString());
/* Effort points are whole numbers until a milestone reports itself part done,
   which can put a fraction on the board. One decimal, and only when there is one. */
const pts = n => (n==null ? '—' : String(Math.round(n*10)/10));
function currency(){ return (state.state.settings.currency||'').trim(); }
function withCurrency(n){ const c = currency(); return money(n) + (c && n!=null ? ' '+c : ''); }

/* Cost and risk can only make the verdict worse, never better: a project dead on
   schedule while burning twice its budget is not "on track". */
function tempered(health, m){
  if(health==='done' || health==='noplan' || health==='notstarted') return health;
  const bad  = (m.cpi!=null && m.cpi<0.8) || m.riskScore>=15;
  const warn = (m.cpi!=null && m.cpi<0.95) || m.riskScore>=10;
  if(bad  && HEALTH_ORDER.indexOf('behind') < HEALTH_ORDER.indexOf(health)) return 'behind';
  if(warn && HEALTH_ORDER.indexOf('risk')   < HEALTH_ORDER.indexOf(health)) return 'risk';
  return health;
}

function projectStats(p, depth){
  depth = depth||0;
  if(isContainerKind(p) && depth < TREE_DEPTH_CAP) return containerStats(p, depth);
  return leafStats(p);
}

/* A programme or portfolio has no milestones of its own: it is what its children
   add up to, each weighted by its share among its siblings. */
function containerStats(p, depth){
  const kids = childProjects(p);
  const kid = kids.map(c=>({ c, st: projectStats(c, depth+1) }));
  const w = c => Math.max(0.0001, c.weight||1);
  const measurable = kid.filter(x=>x.st.pct!=null);
  const wTotal = measurable.reduce((a,x)=>a+w(x.c), 0);
  const isDone = p.status==='done';
  const pct = wTotal ? Math.round(measurable.reduce((a,x)=>a+w(x.c)*x.st.pct, 0)/wTotal) : (isDone?100:null);
  const timeParts = kid.filter(x=>x.st.timePct!=null);
  const timeW = timeParts.reduce((a,x)=>a+w(x.c), 0);

  const nowMs = Date.now();
  const startMs = projectStartMs(p);
  const dueMs = p.dueDate ? endOfDayMs(p.dueDate) : null;
  const ownTimePct = dueMs ? clampPct((nowMs-startMs)/Math.max(1,(dueMs-startMs))*100) : null;
  const timePct = ownTimePct!=null ? ownTimePct
                : (timeW ? Math.round(timeParts.reduce((a,x)=>a+w(x.c)*x.st.timePct, 0)/timeW) : null);

  const weightTotal = kid.reduce((a,x)=>a+x.st.weightTotal, 0);
  const weightDone  = kid.reduce((a,x)=>a+x.st.weightDone, 0);
  const budget = kid.reduce((a,x)=>a+(x.st.budget||0), 0) + (p.budget||0);
  const spent  = kid.reduce((a,x)=>a+(x.st.spent||0), 0)  + (p.actualCost||0);
  const earned = kid.reduce((a,x)=>a+(x.st.earned||0), 0) + (p.budget? p.budget*((pct||0)/100) : 0);
  const riskScoreTop = Math.max(topRisk(p), ...kid.map(x=>x.st.riskScore), 0);
  const openRisks = liveRisks(p).length + kid.reduce((a,x)=>a+x.st.openRisks, 0);

  const variance = (pct!=null && timePct!=null) ? Math.round(pct-timePct) : null;
  const overdue = !!(dueMs && !isDone && nowMs > dueMs);
  // The worst child is the honest headline: one red project makes the programme red.
  const kidHealth = kid.filter(x=>x.c.status!=='done').map(x=>x.st.health)
    .filter(h=>h!=='noplan' && h!=='notstarted');
  let health = isDone ? 'done'
    : !kids.length ? 'noplan'
    : overdue ? 'overdue'
    : kidHealth.length ? kidHealth.slice().sort((a,b)=>HEALTH_ORDER.indexOf(a)-HEALTH_ORDER.indexOf(b))[0]
    : 'nodate';
  const cpi = spent>0 && budget>0 ? earned/spent : null;
  health = tempered(health, { cpi, riskScore:riskScoreTop });
  if(p.healthOverride && p.status!=='done') health = p.healthOverride;

  const lastStamps = kid.map(x=>x.st.lastActivityMs).filter(n=>n!=null);
  const lastActivityMs = lastStamps.length ? Math.max.apply(null, lastStamps) : null;

  return {
    units: [], hasPlan: kids.length>0, done: kid.filter(x=>x.c.status==='done').length, total: kids.length,
    weightDone, weightTotal, pct, countPct: pct, timePct, variance, overdue, health,
    daysTotal: dueMs ? Math.max(1, dayDiff(startMs, dueMs)) : null,
    daysLeft: dueMs ? dayDiff(nowMs, dueMs) : null,
    daysElapsed: dayDiff(startMs, nowMs),
    lastActivityMs, daysSinceActivity: dayDiff(lastActivityMs!=null?lastActivityMs:startMs, nowMs),
    stalled: false, startMs, startedFromDate: explicitStartMs(p)!=null, notStarted: startMs>nowMs,
    container: true, children: kid,
    budget: budget||null, spent: spent||null, earned: budget?earned:null,
    spi: (pct!=null && timePct>0) ? pct/timePct : null, cpi,
    forecast: (cpi && budget) ? budget/cpi : null,
    riskScore: riskScoreTop, openRisks
  };
}

function leafStats(p){
  const units = projectUnits(p);
  const total = units.length;
  const done = units.filter(u=>u.done).length;
  const weightTotal = units.reduce((a,u)=>a+u.weight, 0);
  const weightDone  = units.reduce((a,u)=>a+u.weight*u.share, 0);
  const hasPlan = total > 0;
  const isDone = p.status==='done';

  // Effort-weighted completion. A project with no steps has NO percentage —
  // it is unmeasured, which is a different thing from 0% done.
  const pct = hasPlan ? Math.round(weightDone/weightTotal*100) : (isDone?100:null);
  const countPct = hasPlan ? Math.round(done/total*100) : (isDone?100:null);

  // Schedule: how much of the project's own window has been spent. The window opens on
  // startDate when one is set, so a project that sat in the list before work began is not
  // punished for the wait; otherwise it falls back to when the project was created.
  const nowMs = Date.now();
  const startMs = projectStartMs(p);
  const startedFromDate = explicitStartMs(p)!=null;
  const notStarted = startMs > nowMs;
  const dueMs = p.dueDate ? endOfDayMs(p.dueDate) : null;
  let timePct = null, daysTotal = null, daysLeft = null, daysElapsed = null;
  if(dueMs){
    daysTotal = Math.max(1, dayDiff(startMs, dueMs));
    daysElapsed = dayDiff(startMs, nowMs);
    daysLeft = dayDiff(nowMs, dueMs);
    timePct = clampPct((nowMs-startMs)/Math.max(1,(dueMs-startMs))*100);
  }
  const overdue = !!(dueMs && !isDone && nowMs > dueMs);
  // Schedule variance in percentage points: positive = ahead of the calendar.
  const variance = (pct!=null && timePct!=null) ? Math.round(pct - timePct) : null;

  // Last time any step in this project actually closed.
  const stamps = units.filter(u=>u.done && u.doneAt).map(u=>Date.parse(u.doneAt)).filter(n=>!isNaN(n));
  const lastActivityMs = stamps.length ? Math.max.apply(null, stamps) : null;
  const daysSinceActivity = dayDiff(lastActivityMs!=null?lastActivityMs:startMs, nowMs);
  const stalled = hasPlan && !isDone && !notStarted && pct<100 && daysSinceActivity>=STALL_DAYS;

  let health;
  if(isDone || pct===100) health='done';
  else if(!hasPlan) health='noplan';
  else if(overdue) health='overdue';
  else if(notStarted) health='notstarted';
  else if(timePct==null) health='nodate';
  else if(variance>=HEALTH_AHEAD_MIN) health='ahead';
  else if(variance>=HEALTH_TRACK_MIN) health='ontrack';
  else if(variance>=HEALTH_RISK_MIN) health='risk';
  else health='behind';

  /* Earned value: what the plan says this much completion is worth, against what
     has actually been spent. Budget is optional — without it these are all null
     and the project reports exactly what it did before. */
  const budget = p.budget!=null ? p.budget : null;
  const spent  = p.actualCost!=null ? p.actualCost : null;
  const earned = (budget!=null && pct!=null) ? budget*(pct/100) : null;
  const cpi = (earned!=null && spent>0) ? earned/spent : null;
  const spi = (pct!=null && timePct>0) ? pct/timePct : null;
  const riskScoreTop = topRisk(p);
  health = tempered(health, { cpi, riskScore: riskScoreTop });
  // The owner's own read beats the arithmetic: they know what the numbers cannot.
  if(p.healthOverride && !isDone) health = p.healthOverride;

  return {
    units, hasPlan, done, total, weightDone, weightTotal,
    pct, countPct, timePct, variance, overdue, health,
    daysTotal, daysLeft, daysElapsed, lastActivityMs, daysSinceActivity, stalled,
    startMs, startedFromDate, notStarted,
    container:false, children:[],
    budget, spent, earned, spi, cpi,
    forecast: (cpi && budget) ? budget/cpi : null,
    riskScore: riskScoreTop, openRisks: liveRisks(p).length
  };
}

/* Reconstruct a project's completion curve from when each step was closed.
   Steps completed before the app started recording dates have no timestamp;
   they are counted from the start of the window (flagged in the UI). */
function projectHistory(p, maxPoints){
  const units = projectUnits(p);
  const weightTotal = units.reduce((a,u)=>a+u.weight, 0);
  if(!weightTotal) return { points:[], undated:0 };
  const undated = units.filter(u=>u.done && !u.doneAt).length;
  const nowMs = Date.now();
  const startMs = Math.min(projectStartMs(p), nowMs);
  const span = Math.max(86400000, nowMs-startMs);
  const n = Math.max(2, Math.min(maxPoints||14, Math.ceil(span/86400000)+1));
  const points = [];
  for(let i=0;i<n;i++){
    const at = startMs + span*(i/(n-1));
    const w = units.reduce((a,u)=>{
      if(!u.done) return a;
      const t = u.doneAt ? Date.parse(u.doneAt) : startMs;   // undated = already done at window start
      return a + ((isNaN(t)?startMs:t) <= at ? u.weight : 0);
    }, 0);
    points.push({ ms:at, label:new Date(at).toLocaleDateString(undefined,{month:'short',day:'numeric'}), pct:Math.round(w/weightTotal*100) });
  }
  return { points, undated };
}

/* Portfolio roll-up: one number for the whole book of work, plus a
   per-domain breakdown so IntelMotion / Nigist / Tamar read separately. */
function portfolioStats(list){
  const rows = list.map(p=>({ p, st:projectStats(p) }));
  const planned = rows.filter(r=>r.st.hasPlan);
  const weightTotal = planned.reduce((a,r)=>a+r.st.weightTotal, 0);
  const weightDone  = planned.reduce((a,r)=>a+r.st.weightDone, 0);
  const health = {};
  HEALTH_ORDER.forEach(k=>health[k]=0);
  rows.forEach(r=>{ health[r.st.health] = (health[r.st.health]||0)+1; });

  const areaMap = {};
  rows.forEach(r=>{
    const key = r.p.category || 'Uncategorised';
    const a = areaMap[key] || (areaMap[key] = { area:key, count:0, planned:0, weightDone:0, weightTotal:0, offTrack:0, stalled:0, noPlan:0 });
    a.count++;
    if(r.st.hasPlan){ a.planned++; a.weightDone+=r.st.weightDone; a.weightTotal+=r.st.weightTotal; }
    else a.noPlan++;
    if(r.st.health==='behind' || r.st.health==='risk' || r.st.health==='overdue') a.offTrack++;
    if(r.st.stalled) a.stalled++;
  });
  const byArea = Object.values(areaMap).map(a=>Object.assign(a, {
    pct: a.weightTotal ? Math.round(a.weightDone/a.weightTotal*100) : null
  })).sort((x,y)=>(y.offTrack-x.offTrack) || (y.count-x.count) || x.area.localeCompare(y.area));

  return {
    rows, total:rows.length,
    plannedCount: planned.length,
    noPlanCount: rows.length - planned.length,
    weightDone, weightTotal,
    weightedPct: weightTotal ? Math.round(weightDone/weightTotal*100) : null,
    simplePct: planned.length ? Math.round(planned.reduce((a,r)=>a+r.st.pct,0)/planned.length) : null,
    offTrack: health.behind + health.risk + health.overdue,
    stalledCount: rows.filter(r=>r.st.stalled).length,
    health, byArea
  };}

/* Every roll-up number is a question: which projects is this? Each tile and each
   domain row drills into the list behind it, so a "1 off track" is never a dead end.
   `pick` takes the {p,st} rows portfolioStats already computed — no recount, so the
   list can never disagree with the tile it came from. */
const ROLLUP_DRILLS = {
  weighted: {
    label: 'Weighted complete',
    blurb: port => `${pts(port.weightDone)} of ${pts(port.weightTotal)} effort points closed across ${port.plannedCount} measurable project${port.plannedCount===1?'':'s'}. Big projects move this number more than small ones.`,
    empty: 'No project has been broken into steps yet, so there is no weighted percentage to explain.',
    pick: rows => rows.filter(r=>r.st.hasPlan),
    sort: (a,b) => (b.st.weightTotal-b.st.weightDone)-(a.st.weightTotal-a.st.weightDone),
    note: st => `${pts(st.weightDone)}/${pts(st.weightTotal)} points · ${pts(st.weightTotal-st.weightDone)} left`
  },
  average: {
    label: 'Average project',
    blurb: port => `The plain average of each measurable project's own percentage — every project counts once, whatever its size. Weighted, the same book of work reads ${port.weightedPct==null?'—':port.weightedPct+'%'}.`,
    empty: 'No project has been broken into steps yet, so there is nothing to average.',
    pick: rows => rows.filter(r=>r.st.hasPlan),
    sort: (a,b) => a.st.pct-b.st.pct,
    note: st => `${st.pct}% · ${st.done}/${st.total} steps`
  },
  offtrack: {
    label: 'Off track',
    blurb: () => 'Less work done than time spent, or already past the due date. Variance is percentage points: -20 means you are twenty points behind where the calendar says you should be.',
    empty: 'Nothing is off track — every measurable project is level with its schedule or ahead of it.',
    pick: rows => rows.filter(r=>r.st.health==='behind'||r.st.health==='risk'||r.st.health==='overdue'),
    sort: (a,b) => (a.st.variance==null?99:a.st.variance)-(b.st.variance==null?99:b.st.variance),
    note: st => `${st.pct}% done vs ${st.timePct==null?'—':Math.round(st.timePct)+'%'} of the time`
       + (st.variance!=null?` · ${st.variance>0?'+':''}${st.variance}pts`:'')
       + (st.daysLeft!=null?` · ${st.daysLeft<0?Math.abs(st.daysLeft)+'d overdue':st.daysLeft+'d left'}`:''),
    // The note already carries the deadline; a due chip beside it only restates it.
    hideDue: true
  },
  stalled: {
    label: `Stalled ${STALL_DAYS}d+`,
    blurb: () => `No step has closed in ${STALL_DAYS} days or more. The project may still be on schedule — stalled is about movement, not deadlines.`,
    empty: `Nothing has stalled — every measurable project has closed a step in the last ${STALL_DAYS} days.`,
    pick: rows => rows.filter(r=>r.st.stalled),
    sort: (a,b) => b.st.daysSinceActivity-a.st.daysSinceActivity,
    note: st => `${st.daysSinceActivity}d since a step closed · ${st.pct}% done`
  },
  noplan: {
    label: 'Not broken down',
    blurb: () => 'No milestones and no tasks, so these have no measurable completion — they are not 0% done, they are unmeasured, and they are excluded from every percentage above. Add steps to bring them into the roll-up.',
    empty: 'Every project has been broken into steps.',
    pick: rows => rows.filter(r=>!r.st.hasPlan),
    sort: (a,b) => a.p.title.localeCompare(b.p.title),
    note: () => 'No milestones or tasks yet'
  },
  all: {
    label: 'Projects',
    blurb: port => `Every active project. ${port.plannedCount} measurable, ${port.noPlanCount} not broken down. Archived projects are not counted here.`,
    empty: 'No active projects.',
    pick: rows => rows,
    sort: (a,b) => HEALTH_ORDER.indexOf(a.st.health)-HEALTH_ORDER.indexOf(b.st.health) || (b.st.weightTotal-a.st.weightTotal),
    note: st => st.hasPlan ? `${st.pct}% · ${st.done}/${st.total} steps · ${pts(st.weightDone)}/${pts(st.weightTotal)} points` : 'No milestones or tasks yet'
  }
};

/* ---------- shared progress UI fragments ---------- */
function healthChip(st){

/* Bar with a tick showing where the calendar says you should be. */

function effortChip(effortKey, dataAttrs){

/* ---------- what Now can hold ----------
   A pin used to be an item id, and a milestone is not an item — it lives in
   project.subtasks. So a plan made entirely of projects and milestones, which is
   the normal shape here, left Now and the pipeline permanently empty with no way
   to fill them. A pin is now a reference: a bare item id for a task, or
   "ms:<projectId>:<subtaskId>" for a milestone. Old pins keep working unchanged. */
const MS_PREFIX = 'ms:';
const STORY_PREFIX = 'st:';
function storyRef(projectId, storyId){ return STORY_PREFIX + projectId + ':' + storyId; }
function isStoryRef(ref){ return typeof ref==='string' && ref.indexOf(STORY_PREFIX)===0; }
function msRef(projectId, subId){ return MS_PREFIX + projectId + ':' + subId; }
function isMsRef(ref){ return typeof ref==='string' && ref.indexOf(MS_PREFIX)===0; }

/* Resolve a pin to something renderable, or null if it no longer exists. */
function resolveFocus(ref){
  // An agile project has no milestones, so its backlog items are what Now pins.
  if(isStoryRef(ref)){
    const rest = ref.slice(STORY_PREFIX.length);
    const cut = rest.indexOf(':');
    if(cut < 0) return null;
    const proj = byId(rest.slice(0, cut));
    const story = proj && backlogOf(proj).find(x=>x.id === rest.slice(cut+1));
    if(!story) return null;
    return { ref, kind:'story', project:proj, story, title:story.title, done:story.status==='done',
             priority:proj.priority, effort:null, category:proj.category };
  }
  if(isMsRef(ref)){
    const rest = ref.slice(MS_PREFIX.length);
    const cut = rest.indexOf(':');
    if(cut < 0) return null;
    const proj = byId(rest.slice(0, cut));
    if(!proj || !Array.isArray(proj.subtasks)) return null;
    const sub = proj.subtasks.find(x=>x.id === rest.slice(cut+1));
    if(!sub) return null;
    return { ref, kind:'milestone', project:proj, sub, title:sub.title, done:!!sub.done,
             priority:proj.priority, effort:sub.effort, category:proj.category };
  }
  const it = byId(ref);
  if(!it) return null;
  return { ref, kind:'task', item:it, title:it.title, done:it.status==='done',
           priority:it.priority, effort:it.effort, category:it.category };
}
function focusList(){ return nowPins().map(resolveFocus).filter(Boolean); }

/* Every place you can pin from renders this, so "already in Now" looks the same
   everywhere. It used to differ per list — the Inbox tinted the icon, milestones
   tinted it, and a task inside a project showed no pinned state at all, so one
   already in Now was indistinguishable from one that was not.

   Pinned is dimmed and filled rather than disabled: you still need to be able to
   take something out of Now from the list you are looking at. */
function pinButton(ref, extraAttrs){
  const on = nowPins().indexOf(ref) >= 0;
  return `<button class="icon-btn btn-sm pin-btn${on?' pinned':''}" data-action="toggle-pin" data-id="${esc(ref)}"${extraAttrs||''}
    aria-pressed="${on}" title="${on?'Already in Now — click to take it out':'Pin to Now / Today'}">${on?'📍':'📌'}</button>`;
}

/* The next unfinished milestone of a project — what "work on this project" means
   in practice, and what the pipeline offers for a starred project. */
function nextMilestone(p){
  const pinned = new Set(nowPins());
  return (p.subtasks||[]).find(sx=>!sx.done && !pinned.has(msRef(p.id, sx.id))) || null;
}
/* The agile equivalent: whatever is being worked on, else the top of the backlog. */
function nextStory(p){
  const pinned = new Set(nowPins());
  const open = backlogOf(p).filter(b=>b.status!=='done' && !pinned.has(storyRef(p.id, b.id)));
  return open.find(b=>b.status==='doing') || open[0] || null;
}

/* Suggestions for Now: starred or high-priority tasks, plus the next milestone of
   each starred or high-priority project. One milestone per project, so a single
   nine-step project cannot crowd out everything else. Starring a project used to
   do nothing at all here — every candidate had to be a task. */
function upNextCandidates(){
  const pinned = new Set(nowPins());
  const out = [];

  openTasks()
    .filter(i=>!pinned.has(i.id) && (i.isStarred || i.priority==='high'))
    .forEach(i=>out.push({ ref:i.id, kind:'task', item:i, title:i.title, done:false,
                           priority:i.priority, effort:i.effort, category:i.category,
                           dueDate:i.dueDate, createdAt:i.createdAt }));

  projects()
    .filter(p=>p.status!=='done' && inactiveProjects.indexOf(p.id)===-1 && (p.isStarred || p.priority==='high'))
    .forEach(p=>{
      if((p.method||'traditional')==='agile'){
        const story = nextStory(p);
        if(!story) return;
        out.push({ ref:storyRef(p.id, story.id), kind:'story', project:p, story, title:story.title, done:false,
                   priority:p.priority, effort:null, category:p.category,
                   dueDate:p.dueDate, createdAt:p.createdAt });
        return;
      }
      const sub = nextMilestone(p);
      if(!sub) return;
      out.push({ ref:msRef(p.id, sub.id), kind:'milestone', project:p, sub, title:sub.title, done:false,
                 priority:p.priority, effort:sub.effort, category:p.category,
                 dueDate:p.dueDate, createdAt:p.createdAt });
    });

  const pr = { high:0, medium:1, low:2 };
  return out.sort((a,b)=>{
    if(pr[a.priority]!==pr[b.priority]) return pr[a.priority]-pr[b.priority];
    if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if(a.dueDate) return -1; if(b.dueDate) return 1;
    return String(a.createdAt||'').localeCompare(String(b.createdAt||''));
  });
}

/* =========================================================
   Mutations
   ========================================================= */
function newItem(partial){
  const it = Object.assign({
    id: uid(), type:'task', title:'', status:'open',
    category:'Inbox', priority:'medium', dueDate:null, createdAt: new Date().toISOString(),
    completedAt:null, projectId:null, subtasks:[], assignee:null,
    contactName:null, lastContactDate:null, isStarred:false, xpAwarded:false, effort:DEFAULT_EFFORT, startDate:null,
    seriesId:null, occursOn:null, followupId:null
  }, partial);
  items().push(it);
  return it;
}

function completeItem(item, viaCheckbox){
  const wasDone = item.status==='done';
  item.status = wasDone ? 'open' : 'done';
  item.completedAt = item.status==='done' ? new Date().toISOString() : null;
  if(item.status==='done' && !item.xpAwarded){
    const isMilestoneTask = item.type==='task' && item.projectId;
    grantXP(isMilestoneTask?XP_MILESTONE:XP_TASK, isMilestoneTask?'Milestone done':'Task done');
    item.xpAwarded = true;
    // Finishing a pinned item clears its slot. Nothing is promoted into it:
    // what sits in Now is the owner's choice, never the app's.
    const pins = nowPins();
    const idx = pins.indexOf(item.id);
    if(idx>=0) pins.splice(idx,1);
  }
}

function deleteItem(id){
  const toRemove = new Set([id, ...items().filter(i=>i.projectId===id).map(i=>i.id)]);
  state.state.items = items().filter(i=>!toRemove.has(i.id));
  const p = nowPins();
  toRemove.forEach(rid=>{ const pi=p.indexOf(rid); if(pi>=0) p.splice(pi,1); });
  // A deleted project takes its milestones' pins with it, or Now holds dead refs.
  state.state.settings.nowPins = p.filter(ref=>!isMsRef(ref) || !toRemove.has(ref.slice(MS_PREFIX.length).split(':')[0]));
}

function convertToProject(item, category){
  item.type='project';
  item.category = category;
  item.priority = item.priority||'medium';
}

function toggleStar(item){ item.isStarred = !item.isStarred; }

function addLifeArea(name){
  name = (name||'').trim();
  if(!name || name==='Inbox' || state.state.lifeAreas.some(a=>a.name===name)) return false;
  state.state.lifeAreas.push({name, purpose:'', framework:[], routines:[], guiding_principle:'', open_items:[]});
  return true;
}
function deleteLifeArea(name){
  const idx = state.state.lifeAreas.findIndex(a=>a.name===name);
  if(idx<0) return;
  state.state.lifeAreas.splice(idx,1);
  items().forEach(i=>{ if(i.category===name) i.category='Inbox'; });
  state.state.habits.forEach(h=>{ if(h.category===name) h.category=null; });
}

/* Pin and unpin are the only things that change what is in Now. There is no cap:
   three is the advice, not a rule the app enforces against its owner. */
/* Takes a focus reference — an item id, or "ms:<project>:<subtask>" for a
   milestone. Pin and unpin remain the only things that change what is in Now. */
function togglePin(ref){
  const pins = nowPins();
  const idx = pins.indexOf(ref);
  if(idx>=0){
    const f = resolveFocus(ref);
    pins.splice(idx,1);
    pushToast(f ? `Removed "${f.title}" from Now` : 'Removed from Now');
    return;
  }
  const f = resolveFocus(ref);
  if(!f){ pushToast('That is no longer there to pin'); return; }
  pins.push(ref);
  pushToast(`Pinned "${f.title}" to Now`);
}

function toggleSubtask(item, subId){
  const s = item.subtasks.find(x=>x.id===subId);
  if(!s) return;
  // Finishing a pinned milestone frees its slot. Nothing is promoted into it.
  if(!s.done){
    const pins = nowPins();
    const at = pins.indexOf(msRef(item.id, subId));
    if(at>=0) pins.splice(at,1);
  }
  s.done = !s.done;
  s.doneAt = s.done ? new Date().toISOString() : null;
  if(s.done && !s.xpAwarded){ grantXP(XP_MILESTONE,'Milestone done'); s.xpAwarded=true; }
}

function toggleHabit(habit, dateISO){
  if(dateISO>todayISO()) return;
  habit.log[dateISO] = !habit.log[dateISO];
  if(!habit.log[dateISO]) delete habit.log[dateISO];
  maybeAwardHabitBonus(dateISO);
}
function dowIndex(d){ return (d.getDay()+6)%7; } // 0=Mon..6=Sun, matches DAY_LABELS/startOfWeek
function isHabitRequiredOn(habit, dateISO){
  const f = habit.frequency || {type:'daily'};
  if(f.type==='days') return (f.days||[]).includes(dowIndex(new Date(dateISO+'T00:00:00')));
  if(f.type==='weekly' || f.type==='monthly') return false; // target inside a window, not a given day
  return true; // daily
}
function maybeAwardHabitBonus(dateISO){
  const habits = state.state.habits.filter(h=>h.active!==false && isHabitRequiredOn(h, dateISO));
  if(!habits.length) return;
  const allDone = habits.every(h=>h.log[dateISO]);
  const bonusList = state.state.gamification.habitBonusDates;
  if(allDone && bonusList.indexOf(dateISO)===-1){
    bonusList.push(dateISO);
    grantXP(XP_HABITS, 'All habits complete');
  }
}
function habitStreak(habit){
  const f = habit.frequency || {type:'daily'};
  if(f.type==='weekly')  return weeklyHabitStreak(habit, f.target||1);
  if(f.type==='monthly') return monthlyHabitStreak(habit, f.target||1);
  let cursor=new Date(); let streak=0; let first=true;
  while(true){
    const key=fmtISO(cursor);
    if(isHabitRequiredOn(habit,key)){
      if(habit.log[key]) streak++;
      else if(!first) break;
    }
    first=false;
    cursor=addDays(cursor,-1);
    if(streak>3650) break;
  }
  return streak;
}
function weeklyHabitStreak(habit, target){
  let weekOffset=0, streak=0;
  while(true){
    const start = startOfWeek(addDays(new Date(), -7*weekOffset));
    let count=0;
    for(let i=0;i<7;i++){ if(habit.log[fmtISO(addDays(start,i))]) count++; }
    if(count>=target){
      streak++;
    } else if(weekOffset>0){
      break; // a fully-elapsed past week missed target — streak ends
    } // else: current week still in progress and hasn't hit target yet — skip, don't break
    weekOffset++;
    if(weekOffset>520) break;
  }
  return streak;
}
/* Months are the same shape as weeks: hit the target inside the window, no day
   is required in particular. The current month is never counted as a miss. */
function monthWindow(offset){
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth()-offset, 1);
  return { first, last: new Date(first.getFullYear(), first.getMonth()+1, 0) };
}
function habitMonthCount(habit, offset){
  const { first, last } = monthWindow(offset||0);
  let count=0;
  for(let d=new Date(first); d<=last; d=addDays(d,1)) if(habit.log[fmtISO(d)]) count++;
  return count;
}
function monthlyHabitStreak(habit, target){
  let offset=0, streak=0;
  while(true){
    if(habitMonthCount(habit, offset) >= target) streak++;
    else if(offset>0) break;
    offset++;
    if(offset>240) break;
  }
  return streak;
}
function fmtHabitStreak(habit){
  const t = (habit.frequency||{}).type;
  const n = habitStreak(habit);
  return t==='weekly' ? `${n}wk` : t==='monthly' ? `${n}mo` : `${n}d`;
}

/* =========================================================
   Rendering
   ========================================================= */
function render(){
  const theme = themeMode();
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').setAttribute('content', theme==='dark' ? '#0F172A':'#F8FAFC');
  const app = qs('#app');
  const focusId = document.activeElement && document.activeElement.id;
  const caret = focusId && typeof document.activeElement.selectionStart==='number' ? document.activeElement.selectionStart : null;
  chartNoteShown = false;
  app.innerHTML = renderSidebar() + renderMain();
  wireGlobal();
  renderCharts();
  // Typing in a filter box re-renders the list underneath it — keep the caret.
  if(focusId){
    const back = document.getElementById(focusId);
    if(back && back.focus){
      back.focus();
      if(caret!=null && back.setSelectionRange){ try{ back.setSelectionRange(caret, caret); }catch(e){} }
    }
  }
}

/* ---------- NOW ---------- */
/* Today's date on the front page — re-rendered on every render(), and a timer rolls it at midnight. */
function renderTodayStamp(){
  const d = new Date();
  return `<div class="today-stamp">
    <div class="today-day">${d.toLocaleDateString(undefined,{weekday:'long'})}</div>
    <div class="today-date">${d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}</div>
  </div>`;
}
let midnightTimer = null;
function scheduleMidnightRollover(){
  if(midnightTimer) clearTimeout(midnightTimer);
  const next = new Date(); next.setHours(24,0,5,0);   // just after midnight
  midnightTimer = setTimeout(()=>{
    midnightTimer=null;
    // A new day may have brought recurring items due; create them before repainting.
    if(catchUpRecurring().created) persistLocal();
    render();
    scheduleMidnightRollover();
  }, next-new Date());
}

function renderLifeDashboard(){
  const scope = ui.dashboardProjectScope === 'all' ? 'all' : 'active';
  const today = todayISO();
  const now = new Date();
  const weekEnd = new Date(now); weekEnd.setDate(weekEnd.getDate()+7);
  const iso = d => fmtISO(d);
  const inDashboardScope = it => scope==='all' || (it.type==='project' ? inactiveProjects.indexOf(it.id)===-1 : !it.projectId || inactiveProjects.indexOf(it.projectId)===-1);
  const active = items().filter(it => it.status !== 'done' && it.status !== 'archived' && inDashboardScope(it));
  const projectItems = projects().filter(p => scope==='all' || inactiveProjects.indexOf(p.id)===-1);
  const actionItems = active.filter(it => it.type === 'task' || it.type === 'milestone');
  const overdue = actionItems.filter(it => it.dueDate && it.dueDate < today)
    .sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const dueSoon = actionItems.filter(it => it.dueDate && it.dueDate >= today && it.dueDate <= iso(weekEnd))
    .sort((a,b) => a.dueDate.localeCompare(b.dueDate));
  const blocked = active.filter(it => it.status === 'blocked' || it.blocked === true || !!it.blockedReason);
  const focus = focusList();
  const finished = completedItems().filter(it=>it.completedAt.slice(0,10)>=fmtISO(addDays(new Date(),-6)));
  const attention = projectItems.map(p=>({p,st:projectStats(p)}))
    .filter(x=>x.st && ['overdue','behind','risk','stalled','noplan'].includes(x.st.health))
    .sort((a,b)=>HEALTH_ORDER.indexOf(a.st.health)-HEALTH_ORDER.indexOf(b.st.health)).slice(0,5);
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const dateLabel = value => value ? new Date(value+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}) : 'No due date';
  const rows = (arr, empty, action) => arr.length ? arr.slice(0,5).map(it =>
    '<button class="pick-row" style="width:100%;text-align:left" data-action="'+action+'" data-id="'+esc(it.id)+'">' +
    '<span style="flex:1;min-width:0"><strong>'+esc(it.title)+'</strong><span class="item-meta">'+esc(it.category || 'Unfiled')+(it.dueDate ? ' · due '+esc(dateLabel(it.dueDate)) : '')+'</span></span>' +
    '<span aria-hidden="true">›</span></button>').join('') : '<div class="view-sub" style="padding:12px 0">'+empty+'</div>';
  const metric = (value,label,detail,view) => '<button class="rollup-tile" data-action="nav" data-view="'+view+'">' +
    '<div class="v">'+value+'</div><div class="k">'+label+'</div><div class="drill">'+detail+'</div></button>';
  const reviewCard = (title,questions,view,label) => '<section class="card"><div class="pipeline-head"><div class="pipeline-title">'+title+'</div><a class="btn btn-sm" href="#" data-action="nav" data-view="'+view+'">'+label+'</a></div><ul style="padding-left:20px;margin:8px 0 0">'+questions.map(q=>'<li style="margin:7px 0">'+q+'</li>').join('')+'</ul></section>';
  return '<div class="view">' +
    '<div class="view-head"><div><div class="view-title">My Life Dashboard</div>' +
    '<div class="view-sub">A calm overview of what needs attention across your life. Counts are based on records you have entered.</div></div>' +
    renderTodayStamp() + '</div>' +
    '<div class="filter-bar" style="margin:0 0 14px;align-items:center"><span class="view-sub" style="margin:0">Project scope</span><button class="chip '+(scope==='all'?'on':'')+'" data-action="dashboard-project-scope" data-scope="all">All projects</button><button class="chip '+(scope==='active'?'on':'')+'" data-action="dashboard-project-scope" data-scope="active">Unarchived projects only</button></div>' +
    '<div class="capture"><input id="dashboard-capture" aria-label="Quick capture" placeholder="Quick capture — task, idea, reminder…" autocomplete="off" />' +
    '<button class="btn btn-primary" type="button" data-action="dashboard-capture">＋ Capture</button></div>' +
    '<div class="rollup-grid">' +
    metric(projectItems.length,'Active projects','Portfolios, programmes and projects','projects') +
    metric(overdue.length,'Overdue actions','Tasks and milestones past due','inbox') +
    metric(focus.length,'Current focus','Pinned priorities · aim for 1–3','now') +
    metric(blocked.length,'Blocked items','Items marked as blocked or waiting','projects') + '</div>' +
    '<div class="grid-two" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-bottom:14px">' +
    '<section class="card"><div class="pipeline-head"><div class="pipeline-title">Today’s focus</div><a class="btn btn-sm" href="#" data-action="nav" data-view="now">Open Now</a></div>' +
    (focus.length ? focus.slice(0,3).map((it,i) => '<div class="focus-card" style="margin:8px 0"><div class="focus-num">'+(i+1)+'</div><div><div class="focus-title">'+esc(it.title)+'</div><div class="item-meta">'+esc(it.category || 'Unfiled')+'</div></div></div>').join('') :
    '<div class="view-sub" style="padding:12px 0">Nothing pinned yet. Choose one to three priorities for today.</div>') + '</section>' +
    '<section class="card"><div class="pipeline-head"><div class="pipeline-title">Overdue actions</div><span class="chip">'+overdue.length+'</span></div>' +
    rows(overdue,'No overdue actions.','dashboard-open-item') + '</section>' +
    '<section class="card"><div class="pipeline-head"><div class="pipeline-title">Today & next 7 days</div><span class="chip">'+dueSoon.length+'</span></div>' +
    rows(dueSoon,'Nothing with a due date in the next seven days.','dashboard-open-item') +
    '<div class="view-sub" style="margin-top:8px">Appointments are not shown here unless they are recorded as dated items.</div></section>' +
    '<section class="card"><div class="pipeline-head"><div class="pipeline-title">Projects needing attention</div><a class="btn btn-sm" href="#" data-action="nav" data-view="projects">All projects</a></div>' +
    (attention.length ? attention.map(x=>'<div class="pipeline-row"><div class="item-main"><b>'+esc(x.p.title)+'</b><div class="item-meta">'+esc(x.p.category||'Unfiled')+' · '+esc(HEALTH_META[x.st.health]?.label||x.st.health)+'</div></div><button class="btn btn-sm" data-action="dashboard-open-item" data-id="'+esc(x.p.id)+'">Open</button></div>').join('') :
    '<div class="view-sub" style="padding:12px 0">No active projects currently flagged overdue, behind, at risk, stalled or without a plan.</div>') + '</section>' +
    '<section class="card"><div class="pipeline-head"><div class="pipeline-title">Blocked / waiting</div><span class="chip">'+blocked.length+'</span></div>' +
    rows(blocked,'Nothing currently marked as blocked.','dashboard-open-item') + '</section>' +
    '<section class="card"><div class="pipeline-head"><div class="pipeline-title">This week’s outcomes</div><a class="btn btn-sm" href="#" data-action="nav" data-view="review">Weekly review</a></div>' +
    '<div class="view-sub">Choose the outcomes you want to finish this week during your review. Recently completed: '+finished.length+' item'+(finished.length===1?'':'s')+' in the last 7 days.</div>' +
    '<div class="view-sub" style="margin-top:8px">Weekly outcomes are not yet stored as a separate planning record.</div></section></div>' +
    '<div class="grid-two" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:14px">' +
    reviewCard('Weekly Review',[
      'What did I finish?',
      'What is blocked or overdue?',
      'What deserves attention this week?',
      'What can I pause, delegate, defer or drop?',
      'Is my workload aligned with my priorities?',
      'What is the single most important next action for each active project?'
    ],'weekly-review','Open review') +
    reviewCard('Portfolio Review',[
      'Which life areas are being neglected?',
      'Which programmes and projects justify continued effort?',
      'Are commitments exceeding available time or money?',
      'What should receive more or less attention next month?'
    ],'portfolio-review','Review portfolio') +
    '</div></div>';
}

function renderWeeklyReview(){
  const today = todayISO();
  const weekAgo = fmtISO(addDays(new Date(),-6));
  const done = completedItems().filter(it=>it.completedAt.slice(0,10)>=weekAgo && it.completedAt.slice(0,10)<=today);
  const overdue = items().filter(it=>(it.type==='task'||it.type==='milestone') && it.status!=='done' && it.status!=='archived' && it.dueDate && it.dueDate<today);
  const blocked = items().filter(it=>it.status!=='done' && it.status!=='archived' && (it.status==='blocked'||it.blocked===true||!!it.blockedReason));
  const activeProjects = projects().filter(p=>inactiveProjects.indexOf(p.id)===-1 && p.status!=='done' && p.status!=='archived');
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const panel = (title,body) => '<section class="card" style="margin-bottom:14px"><div class="pipeline-title">'+title+'</div>'+body+'</section>';
  return '<div class="view"><div class="view-head"><div><div class="view-title">Weekly Review</div><div class="view-sub">Review reality first, then decide what deserves your attention next.</div></div><button class="btn" data-action="nav" data-view="dashboard">← Dashboard</button></div>' +
    panel('1. What did I finish?','<div class="view-sub">'+done.length+' completed item'+(done.length===1?'':'s')+' in the last seven days.</div>'+(done.length?done.slice(0,8).map(it=>'<div class="pipeline-row"><div class="item-main">'+esc(it.title)+'<div class="item-meta">'+esc(it.category||'Unfiled')+'</div></div></div>').join(''):'<div class="view-sub" style="padding-top:8px">No completed items recorded in this window.</div>')) +
    panel('2. What is blocked or overdue?','<div class="view-sub">'+blocked.length+' blocked/waiting · '+overdue.length+' overdue actions.</div>'+(blocked.concat(overdue.filter(it=>!blocked.some(b=>b.id===it.id))).slice(0,10).map(it=>'<div class="pipeline-row"><div class="item-main">'+esc(it.title)+'<div class="item-meta">'+esc(it.category||'Unfiled')+(it.dueDate?' · due '+esc(it.dueDate):'')+'</div></div></div>').join('')||'<div class="view-sub" style="padding-top:8px">Nothing currently flagged.</div>')) +
    panel('3. What deserves attention this week?','<div class="view-sub">Choose your one to three current priorities in Now. Keep the week realistic.</div><button class="btn btn-primary" data-action="nav" data-view="now">Choose current focus</button>') +
    panel('4. What can I pause, delegate, defer or drop?','<ul style="padding-left:20px"><li>Which active commitment no longer supports an important outcome?</li><li>What can someone else own?</li><li>What can safely wait until next week or next month?</li></ul>') +
    panel('5. Is my workload aligned with my priorities?','<div class="view-sub">Open commitments are counted by life area on the dashboard. This is a task-count proxy, not a measurement of effort or available capacity.</div><button class="btn" data-action="nav" data-view="dashboard">Review workload by area</button>') +
    panel('6. What is the next action for each active project?','<div class="view-sub">Review the next open milestone or task under each project. Projects with no clear next step should be clarified, paused or archived.</div>'+(activeProjects.length?activeProjects.slice(0,30).map(p=>{const next=(p.subtasks||[]).find(st=>!st.done);return '<div class="pipeline-row"><div class="item-main"><b>'+esc(p.title)+'</b><div class="item-meta">'+esc(next?next.title:'No open milestone recorded — define the next action')+'</div></div><button class="btn btn-sm" data-action="dashboard-open-item" data-id="'+esc(p.id)+'">Open</button></div>';}).join(''):'<div class="view-sub" style="padding-top:8px">No active projects.</div>')) +
    '<div class="view-sub">This page assembles a review from live records; it does not automatically change priorities or commitments.</div></div>';
}

function renderPortfolioReview(){
  const active = items().filter(it=>it.status!=='done' && it.status!=='archived');
  const projectsActive = projects().filter(p=>inactiveProjects.indexOf(p.id)===-1 && p.status!=='done' && p.status!=='archived');
  const areas = state.state.lifeAreas || [];
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const areaRows = ['Inbox',...areas.map(a=>a.name)].map(name=>({name,items:active.filter(it=>it.category===name),projects:projectsActive.filter(p=>p.category===name)}));
  return '<div class="view"><div class="view-head"><div><div class="view-title">Portfolio Review</div><div class="view-sub">Check whether your commitments still deserve the time, money and attention they require.</div></div><button class="btn" data-action="nav" data-view="dashboard">← Dashboard</button></div>' +
    '<div class="rollup-grid"><div class="rollup-tile"><div class="v">'+projectsActive.length+'</div><div class="k">Active portfolio items</div></div><div class="rollup-tile"><div class="v">'+active.length+'</div><div class="k">Open commitments</div></div><div class="rollup-tile"><div class="v">'+areas.filter(a=>areaRows.find(x=>x.name===a.name).items.length===0).length+'</div><div class="k">Life areas with no open items</div></div></div>' +
    '<section class="card" style="margin:14px 0"><div class="pipeline-title">1. Which areas of life are being neglected?</div><div class="view-sub" style="margin:8px 0">Open-item counts show recorded commitments only. Zero items does not prove an area is neglected or well cared for.</div>' +
    areaRows.map(x=>'<div class="pipeline-row"><div class="item-main"><b>'+esc(x.name)+'</b><div class="item-meta">'+x.projects.length+' active portfolio item'+(x.projects.length===1?'':'s')+'</div></div><span class="chip">'+x.items.length+' open</span></div>').join('')+'</section>' +
    '<section class="card" style="margin-bottom:14px"><div class="pipeline-title">2. Which programmes and projects justify continued effort?</div><div class="view-sub" style="margin:8px 0">Use health, value, strategic fit, and cost to decide whether to continue, reshape, pause or stop. The app cannot infer business or personal value from task counts alone.</div>' +
    (projectsActive.length?projectsActive.map(p=>{const st=projectStats(p);return '<div class="pipeline-row"><div class="item-main"><b>'+esc(p.title)+'</b><div class="item-meta">'+esc(p.category||'Unfiled')+' · '+esc(HEALTH_META[st.health]?.label||st.health)+'</div></div><button class="btn btn-sm" data-action="dashboard-open-item" data-id="'+esc(p.id)+'">Review</button></div>';}).join(''):'<div class="view-sub">No active projects.</div>')+'</section>' +

    '<section class="card"><div class="pipeline-title">4. What should receive more or less attention next month?</div><ul style="padding-left:20px"><li>Increase attention for work with high value and a clear next step.</li><li>Reduce or pause low-value work that consumes scarce time or money.</li><li>Keep room for family, health, faith, rest and unplanned obligations.</li></ul><div class="view-sub">These are review prompts, not a saved allocation plan. Record decisions in your project records after reviewing.</div></section></div>';
}

function renderNowView(){
  // Whatever was pinned, in the order it was put there. Nothing is added here
  // by the app, so a deleted item is the only reason a pin disappears.
  const pins = focusList();
  const pipeline = upNextCandidates().slice(0,6);
  const sub = !pins.length
    ? 'Nothing pinned. Pin what today is actually about — from the pipeline below, the Inbox, or any project.'
    : pins.length<=3
      ? `${pins.length} focus item${pins.length===1?'':'s'} — nothing else matters right now.`
      : `${pins.length} focus items. Three is what usually survives a real day, but this is your call.`;
  return `<div class="view">
    <div class="view-head">
      <div><div class="view-title">Now</div><div class="view-sub">${sub}</div></div>
      ${renderTodayStamp()}
    </div>
    <div class="focus-grid">
      ${pins.map((it,i)=>renderFocusCard(it,i,pins.length)).join('')}
      ${pins.length<3? `<div class="focus-empty-slot">＋ Pin a milestone or task from the pipeline, a project, or the Inbox</div>` : ''}
    </div>
    <div class="pipeline">
      <div class="pipeline-head">
        <div class="pipeline-title">⏭ Up next pipeline</div>
        <span class="view-sub" style="margin:0">Starred / high-priority — suggestions only, nothing moves into Now unless you put it there</span>
      </div>
      ${pipeline.length? pipeline.map((f,i)=>renderPipelineRow(f,i)).join('') : `<div class="empty" style="padding:20px">Nothing queued — star a project or a task to add it here.</div>`}

}

/* A milestone has no item row of its own, so its meta is built from the project
   it belongs to — which is also the answer to "where does this come from?". */
function focusMeta(f){
  if(f.kind==='task') return renderMeta(f.item);
  const bits = [];
  bits.push(`<span class="chip" style="${catStyle(f.project.category)}">${esc(f.project.category)}</span>`);
  bits.push(`<button class="parent-chip" data-action="open-project-report" data-id="${f.project.id}" title="Open the project">📁 ${esc(f.project.title)}</button>`);
  // A backlog item is sized in points, not in S/M/L/XL — show what it is sized in.
  bits.push(f.kind==='story'
    ? `<span class="effort-chip" style="cursor:default" title="Story points">${storyPoints(f.story)}</span>`
    : `<span class="effort-chip" style="cursor:default">${(EFFORT[f.effort]||EFFORT[DEFAULT_EFFORT]).label}</span>`);
  if(f.project.dueDate) bits.push(`<span style="${isOverdue(f.project)?'color:var(--c-danger);font-weight:700':''}">${fmtDue(f.project.dueDate)}</span>`);
  return `<div class="item-meta">${bits.join('')}</div>`;
}
/* Ticking a pinned milestone must close the milestone itself, not an item. */
function focusCheckAttrs(f){
  return f.kind==='task'
    ? `data-action="complete" data-id="${f.item.id}"`
    : f.kind==='story'
      ? `data-action="finish-story" data-id="${f.project.id}" data-story="${f.story.id}"`
      : `data-action="toggle-subtask" data-id="${f.project.id}" data-sub="${f.sub.id}"`;
}
function focusOpenAttrs(f){
  return f.kind==='task'
    ? `data-action="open-item" data-id="${f.item.id}"`
    : `data-action="open-project-report" data-id="${f.project.id}"`;
}

function renderFocusCard(f, i, len){
  return `<div class="focus-card" data-dnd-row>
    <button class="check ${f.done?'done':''}" ${focusCheckAttrs(f)}>${checkSvg()}</button>
    <div class="focus-num" style="margin-left:-2px">${i+1}</div>
    <div class="item-main">
      <div class="focus-title clickable-title ${f.done?'item-title done':''}" ${focusOpenAttrs(f)} title="Where does this come from?">${esc(f.title)}</div>
      ${focusMeta(f)}
    </div>
    <div class="item-actions">
      ${moveTools('move-now', f.ref, i, len)}
      <button class="icon-btn btn-sm btn-danger" data-action="toggle-pin" data-id="${esc(f.ref)}" title="Remove from Now — nothing will replace it">✕</button>
    </div>
  </div>`;
}

function renderPipelineRow(f, i){
  return `<div class="pipeline-row">
    ${numLabel(i)}
    <span class="dot pri-dot pri-${f.priority}"></span>
    <div class="item-main">
      <div class="item-title clickable-title" ${focusOpenAttrs(f)} title="Where does this come from?">${esc(f.title)}</div>

function renderMeta(it){
  const bits=[];
  bits.push(`<span class="chip" style="${catStyle(it.category)}">${esc(it.category)}</span>`);
  const parent = it.projectId ? byId(it.projectId) : null;
  const series = it.seriesId ? seriesById(it.seriesId) : null;
  if(parent) bits.push(`<span class="parent-chip">📁 ${esc(parent.title)}</span>`);
  else if(series) bits.push(`<button class="parent-chip" data-action="open-series" data-series="${series.id}" title="${esc(recurrenceLabel(series))} — click to edit the cadence">${series.isChore?'🧹':'🔁'} ${esc(recurrenceLabel(series))}</button>`);
  else if(it.type==='task') bits.push(`<span class="parent-chip"${it.category==='Inbox'?' style="color:var(--c-warn);font-weight:700" title="Give it a domain with Process Inbox"':''}>${it.category==='Inbox'?'needs a domain':'standalone'}</span>`);
  if(it.assignee){
    const tracked = !!followupFor(it.assignee);
    bits.push(`<button class="chip" data-action="goto-followup" data-person="${esc(it.assignee)}" title="${tracked?'Open their follow-up':'Not tracked yet — start a follow-up'}"${tracked?'':' style="border-style:dashed"'}>👤 ${esc(it.assignee)}</button>`);
  }
  if(it.followupId && byId(it.followupId)) bits.push(`<span class="parent-chip" title="Created from a follow-up">↩ follow-up</span>`);
  if(it.dueDate) bits.push(`<span style="${isOverdue(it)?'color:var(--c-danger);font-weight:700':''}">${fmtDue(it.dueDate)}</span>`);
  if(it.isStarred) bits.push('⭐');
  return `<div class="item-meta">${bits.join('')}</div>`;
}
function checkSvg(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

/* ---------- HABIT STRIP (shared) ---------- */

  weekOffset = weekOffset||0;
  const all = state.state.habits;
  // The Now strip only ever shows live habits; the Habits tab can reveal retired ones.
  const habits = compact ? all.filter(h=>h.active!==false)
                         : (ui.showInactiveHabits ? all : all.filter(h=>h.active!==false));
  const week = Array.from({length:7}).map((_,i)=>fmtISO(addDays(startOfWeek(addDays(new Date(),-7*weekOffset)),i)));
  const today = todayISO();
  if(!habits.length && compact){
    return `<div class="habit-strip">
      <div class="habit-strip-head"><span class="section-label" style="margin:0">Daily habits</span>
      <button class="btn btn-sm" data-action="add-habit">+ Add habit</button></div>
      <div class="view-sub">No habits yet — add a small daily one to build momentum.</div>
    </div>`;
  }
  if(!habits.length) return '';
  const wkStart = startOfWeek(addDays(new Date(), -7*weekOffset));
  return `<div class="habit-strip">
    <div class="habit-strip-head">
      <span class="section-label" style="margin:0">${compact?'Daily habits':'Habits'}</span>

        <button class="icon-btn btn-sm" data-action="habit-week" data-dir="1" title="Previous week">‹</button>
        <span>${weekOffset===0?'This week':fmtWeekLabel(weekOffset)}</span>

    </div>
    ${habits.map(h=>`
      <div class="habit-row ${h.active===false?'inactive':''}" ${compact?'':'data-dnd-row'}>
        <div class="habit-name" title="${esc(h.name)}">${h.emoji} ${esc(h.name)}${h.active===false?' <span class="chip" style="padding:1px 6px">retired</span>':''}${h.frequency&&(h.frequency.type==='weekly'||h.frequency.type==='monthly')?` <span style="color:var(--c-text-muted);font-weight:500">(${h.frequency.target}x/${h.frequency.type==='monthly'?'mo':'wk'}${h.frequency.type==='monthly'?` · ${habitMonthCount(h,0)} this month`:''})</span>`:''}</div>
        <div class="habit-days">

        ${compact?'':`${moveTools('move-habit', h.id, all.indexOf(h), all.length)}<button class="icon-btn btn-sm" data-action="toggle-habit-active" data-id="${h.id}" title="${h.active===false?'Reactivate this habit':'Retire this habit — keeps its history'}">${h.active===false?'▶':'⏸'}</button><button class="icon-btn btn-sm" data-action="edit-habit" data-id="${h.id}" title="Edit habit">✎</button><button class="icon-btn btn-sm btn-danger" data-action="delete-habit" data-id="${h.id}" title="Delete habit and its history">🗑</button>`}
