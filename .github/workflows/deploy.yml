# Publishes the site to Firebase Hosting whenever main changes.
# Merging a pull request into main is all it takes — no local tooling required.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:        # also lets you deploy on demand from the Actions tab

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to live channel
    runs-on: ubuntu-latest
    steps:
      - name: Check out the merged code
        uses: actions/checkout@v4

      - name: Publish to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: second-brain-b97ba
          channelId: live
